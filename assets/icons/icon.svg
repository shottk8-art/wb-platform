<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Панель продавца</title>
  <desc id="desc">Три восходящих столбца — аналитика нескольких маркетплейсов</desc>
  <style>
    .tile{fill:#fff;stroke:#161b3029}.bar{fill:#161b30}.accent{fill:#2a45cc}
    @media(prefers-color-scheme:dark){.tile{fill:#1c2133;stroke:#e1e6fa2b}.bar{fill:#e9ecf7}.accent{fill:#7088f0}}
  </style>
  <rect class="tile" x="1" y="1" width="126" height="126" rx="29" stroke-width="2"/>
  <rect class="bar" x="27" y="66" width="18" height="36" rx="9"/>
  <rect class="bar" x="55" y="46" width="18" height="56" rx="9"/>
  <rect class="accent" x="83" y="26" width="18" height="76" rx="9"/>
</svg>
