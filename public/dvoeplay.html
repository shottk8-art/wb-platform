<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<script>
/* Тема — до первой отрисовки, иначе при запуске мигнёт чужим фоном.
   Выбор игрока лежит в общей памяти приложения (ключ dvoeplay:v1);
   пусто — значит берём тему из настроек телефона, как раньше. */
(function(){try{
  var d=JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}'), t=d&&d.theme;
  if(t!=='light'&&t!=='dark') return;
  document.documentElement.setAttribute('data-theme',t);
  var c=t==='dark'?'#1C1C1E':'#F2F2F7', m=document.querySelectorAll('meta[name="theme-color"]'), i;
  for(i=0;i<m.length;i++) m[i].setAttribute('content',c);
}catch(e){}})();

/* Офлайн-режим: после первого открытия приложение работает и без сети
   (кроме игры по сети). Регистрируем после загрузки, чтобы не отнимать
   у страницы первые мгновения. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* Telegram. Его скрипт нужен только внутри мини-приложения: снаружи он
   лишь тормозил бы загрузку, а без сети вешал бы её. Первая страница
   внутри Telegram открывается с #tgWebAppData в адресе — это и признак;
   дальше помним его до конца сеанса, ведь при переходе в игру хвоста
   в адресе уже нет. */
(function(){
  var tg=false;
  try{
    tg=/tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy || sessionStorage.getItem('dp:tg')==='1';
    if(tg) sessionStorage.setItem('dp:tg','1');
  }catch(e){}
  if(!tg) return;
  var s=document.createElement('script');
  s.src='https://telegram.org/js/telegram-web-app.js';
  s.onload=function(){
    var W=window.Telegram&&window.Telegram.WebApp, root=document.documentElement;
    if(!W) return;
    function mine(){
      try{ var t=(JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}')||{}).theme;
           return t==='light'||t==='dark'?t:''; }catch(e){ return ''; }
    }
    function paint(){
      /* своей темы игрок не выбирал — идём за темой Telegram, а не телефона */
      if(!mine() && (W.colorScheme==='dark'||W.colorScheme==='light')) root.setAttribute('data-theme',W.colorScheme);
      var a=root.getAttribute('data-theme');
      var dark=a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var bg=dark?'#1C1C1E':'#F2F2F7';
      try{ W.setHeaderColor(bg); W.setBackgroundColor(bg); }catch(e){}
      try{ if(W.setBottomBarColor) W.setBottomBarColor(bg); }catch(e){}
    }
    try{ W.ready(); }catch(e){}
    try{ W.expand(); }catch(e){}
    /* свайп вниз не должен сворачивать приложение посреди партии:
       в «Матрёшке» и «Магнитном бое» фишки тянут пальцем */
    try{ if(W.disableVerticalSwipes) W.disableVerticalSwipes(); }catch(e){}
    paint();
    try{ W.onEvent('themeChanged',paint); }catch(e){}
    /* в играх кнопка «Назад» Telegram ведёт на главный экран */
    try{
      if(/(^|\/)(index\.html)?$/.test(location.pathname)) W.BackButton.hide();
      else { W.BackButton.show(); W.BackButton.onClick(function(){ location.href='index.html'; }); }
    }catch(e){}
    try{ document.dispatchEvent(new Event('dp:telegram')); }catch(e){}
  };
  document.head.appendChild(s);
})();
</script>

<!-- превью ссылки в Telegram, WhatsApp и других мессенджерах: без этого приглашение
     в сетевую игру приходит голой ссылкой. Картинка — по полному адресу, иначе не покажут -->
<meta property="og:type" content="website">

<style>
:root{
  color-scheme:light;      /* поля ввода и полосы прокрутки тоже светлые */
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --well:#E7E7EC;
  --label:#1C1C1E;
  --label2:rgba(60,60,67,.6);
  --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2);
  --fill:rgba(118,118,128,.12);
  --thumb:#FFFFFF;
  --tint:#007AFF;
  --red-a:#FF5247; --red-b:#E7362B;
  --yel-a:#FFD426; --yel-b:#F5BE0A;
  --card-shadow:0 1px 2px rgba(0,0,0,.05), 0 14px 30px -12px rgba(0,0,0,.16);
  --thumb-shadow:0 3px 8px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
  --spring:cubic-bezier(.32,.72,0,1);
}
/* Тёмная тема. По умолчанию берётся из настроек телефона, но выбор
   в приложении важнее: атрибут data-theme ставится ещё до отрисовки. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1C1E;
    --surface:#2C2C2E;
    --well:#3A3A3C;
    --label:#FFFFFF;
    --label2:rgba(235,235,245,.6);
    --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --fill:rgba(118,118,128,.24);
    --thumb:#48484A;
    --tint:#0A84FF;
    --card-shadow:none;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1C1E;
    --surface:#2C2C2E;
    --well:#3A3A3C;
    --label:#FFFFFF;
    --label2:rgba(235,235,245,.6);
    --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --fill:rgba(118,118,128,.24);
    --thumb:#48484A;
    --tint:#0A84FF;
    --card-shadow:none;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.3);
  }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--label);
  font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}

/* ---------- навигация между экранами ---------- */
.stack{position:relative;height:100dvh;overflow:hidden}
.screen{
  position:absolute;top:0;bottom:0;left:0;right:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  padding:calc(6px + env(safe-area-inset-top)) max(16px,calc((100% - 520px)/2)) calc(12px + env(safe-area-inset-bottom));
  transition:transform .5s var(--spring);
  will-change:transform;
}
/* затемнение уезжающего меню, как в iOS */
#menu::after{
  content:"";position:absolute;inset:0;background:#000;
  opacity:0;pointer-events:none;transition:opacity .5s var(--spring);
}
#game{transform:translateX(100%);pointer-events:none;box-shadow:-10px 0 30px rgba(0,0,0,.22)}
body.playing #menu{transform:translateX(-26%);pointer-events:none}
body.playing #menu::after{opacity:.2}
body.playing #game{transform:translateX(0);pointer-events:auto}

/* ---------- меню ---------- */
#menu{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#menu>*{flex-shrink:0}
/* Ничто в меню не сжимается меньше своего содержимого: на низком экране
   (iPhone SE в Safari — 375×548) меню прокручивается, а не сплющивает
   заставку в полоску и не наезжает подписью на заголовок списка. */
.brand{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mini{
  width:min(62%,216px);aspect-ratio:5/2;
  display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);
  background:var(--surface);border-radius:18px;overflow:hidden;
  box-shadow:var(--card-shadow);margin-bottom:30px;
  flex:none;
}
.mini .c{position:relative;display:grid;place-items:center}
.mini .c::after{content:"";width:72%;aspect-ratio:1;border-radius:50%;background:var(--well)}
.mini .d{
  position:absolute;width:72%;aspect-ratio:1;border-radius:50%;
  box-shadow:0 1px 2px rgba(0,0,0,.14),inset 0 -1px 2px rgba(0,0,0,.1);
  animation:minidrop .6s cubic-bezier(.34,.62,.3,1.25) both;
}
.mini .d.r{background:radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)}
.mini .d.y{background:radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)}
@keyframes minidrop{from{transform:translateY(-280%)}to{transform:translateY(0)}}

.wordmark{margin:0;width:min(240px,76%);line-height:0;color:var(--label)}
.wordmark svg{display:block;width:100%;height:auto;fill:currentColor}
.tagline{margin-top:9px;font-size:15px;color:var(--label2);letter-spacing:-.1px}

.section{font-size:17px;font-weight:600;letter-spacing:-.35px;margin:0 0 9px 4px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  border:0;background:none;color:inherit;font:inherit;text-align:left;
  padding:13px 16px;cursor:pointer;
  transition:background .12s ease;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.row:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.row i{font-style:normal;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.row .chev{width:9px;height:14px;flex:none;fill:none;stroke:var(--label3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.footnote{margin:14px 4px 0;font-size:12px;color:var(--label3);text-align:center;letter-spacing:-.02px}
.tohub{
  align-self:flex-start;flex:none;display:inline-flex;align-items:center;gap:5px;
  margin:0 0 4px;padding:10px 15px 10px 11px;border-radius:999px;
  background:var(--fill);color:var(--tint);text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:-.2px;
  transition:transform .16s var(--spring),opacity .16s ease;
}
.tohub svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tohub:active{transform:scale(.95);opacity:.7}
@media (max-height:660px){.tohub{padding:8px 13px 8px 10px;font-size:13px}}
.legal{margin:12px 0 2px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--label3)}
.legal sup{font-size:.7em;vertical-align:.5em;font-weight:500;letter-spacing:0;margin-left:.05em}

/* ---------- панель игры ---------- */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-bottom:10px}
.navtitle{font-size:17px;font-weight:600;letter-spacing:-.35px;text-align:center}
.back{
  justify-self:start;display:flex;align-items:center;gap:3px;
  border:0;background:none;color:var(--tint);cursor:pointer;
  font:400 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.3px;
  padding:6px 8px 6px 0;transition:opacity .15s ease;
}
.back:active{opacity:.4}
.back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon{
  justify-self:end;width:34px;height:34px;border:0;border-radius:50%;
  background:var(--fill);color:var(--tint);
  display:grid;place-items:center;cursor:pointer;
  transition:transform .18s var(--spring),opacity .18s ease;
}
.icon:active{transform:scale(.9);opacity:.6}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- счёт ---------- */
.scoreboard{position:relative;display:flex;background:var(--fill);border-radius:16px;padding:4px;margin-bottom:14px}
.slider{
  position:absolute;top:4px;left:4px;bottom:4px;width:calc(50% - 4px);
  background:var(--thumb);border-radius:12px;box-shadow:var(--thumb-shadow);
  transition:transform .42s var(--spring),opacity .3s ease;
}
.side{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px}
.side .name{font-size:13px;font-weight:500;color:var(--label2);letter-spacing:-.05px;display:flex;align-items:center;gap:5px}
.side .name::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(180deg,var(--red-a),var(--red-b))}
.side[data-p="2"] .name::before{background:linear-gradient(180deg,var(--yel-a),var(--yel-b))}
.side .score{font-size:22px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:2px}
.dots i{width:3px;height:3px;border-radius:50%;background:var(--label2);opacity:.25;animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.22}30%{opacity:.9}}

/* ---------- поле ---------- */
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:2px 0}
.board{
  position:relative;overflow:hidden;
  width:100%;max-width:430px;max-height:100%;aspect-ratio:7/6;
  display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);
  background:var(--surface);border-radius:24px;box-shadow:var(--card-shadow);
  touch-action:none;outline:none;
}
/* Поле вписывается в место целиком: когда тесно по высоте (телефон боком),
   сужается и ширина — иначе max-height ломал пропорцию, лунки сплющивались
   и нижний ряд уходил под край поля. Без контейнерных единиц — как раньше. */
@supports (width:1cqh){
  .stage{container-type:size}
  .board{width:min(100cqw,430px,100cqh*7/6);max-width:none;max-height:none}
}
.board:focus-visible{box-shadow:var(--card-shadow),0 0 0 4px color-mix(in srgb,var(--tint) 45%,transparent)}
.cell{position:relative;display:grid;place-items:center}
.cell::after{content:"";width:76%;aspect-ratio:1;border-radius:50%;background:var(--well);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.disc{
  position:absolute;width:76%;aspect-ratio:1;border-radius:50%;
  box-shadow:0 1px 2px rgba(0,0,0,.16),inset 0 -2px 3px rgba(0,0,0,.1),inset 0 2px 3px rgba(255,255,255,.28);
  transition:opacity .5s ease;will-change:transform;
}
.disc.p1{background:radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)}
.disc.p2{background:radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)}
.disc.aim{opacity:.24;box-shadow:none;animation:none}
.disc.drop{animation:drop var(--dur,.42s) both}
@keyframes drop{
  0%{transform:translateY(calc(-1 * var(--fall)));animation-timing-function:cubic-bezier(.5,0,.8,.4)}
  60%{transform:translateY(0);animation-timing-function:cubic-bezier(.25,.85,.4,1)}
  76%{transform:translateY(calc(-1 * var(--bounce)));animation-timing-function:cubic-bezier(.5,0,.5,1)}
  100%{transform:translateY(0)}
}
.board.decided .disc:not(.win){opacity:.2}
.disc.win{animation:pop .55s var(--spring) both}
@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.16)}100%{transform:scale(1)}}

.hint{
  padding-top:12px;font-size:13px;color:var(--label2);height:29px;
  letter-spacing:-.05px;text-align:center;transition:opacity .4s ease;
}
.hint button{border:0;background:none;font:600 13px/1 -apple-system,system-ui,sans-serif;color:var(--tint);cursor:pointer;padding:0}

/* ---------- итоговая шторка ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .4s ease;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
/* закрытая шторка уезжает за край вместе со своей тенью: сдвинутая только
   на свою высоту, она оставляла тень на виду — серую полосу по низу экрана */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:2;max-width:520px;margin:0 auto;
  background:var(--surface);border-radius:26px 26px 0 0;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(calc(100% + 60px));transition:transform .5s var(--spring);
  box-shadow:0 -8px 40px rgba(0,0,0,.18);text-align:center;
}
.open .backdrop{opacity:1;pointer-events:auto}
.open .sheet{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 18px}
.medal{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
.sheet h2{font-size:24px;font-weight:700;letter-spacing:-.45px;margin-bottom:5px}
.sheet p{font-size:15px;color:var(--label2);margin-bottom:22px;letter-spacing:-.1px}
.sheet.has-forfeit p{margin-bottom:14px}
.forfeit{
  display:none;width:100%;align-items:center;gap:12px;text-align:left;
  background:var(--fill);border:0;border-radius:14px;
  padding:14px 14px 14px 16px;margin-bottom:14px;
  color:inherit;font:inherit;cursor:pointer;
  transition:transform .18s var(--spring);
}
.forfeit.on{display:flex}
.forfeit:active{transform:scale(.98)}
.ftext{flex:1;font-size:16px;font-weight:600;letter-spacing:-.25px;transition:opacity .16s ease}
.forfeit.roll .ftext{opacity:0}
.forfeit .die{width:20px;height:20px;flex:none;fill:none;stroke:var(--label3);stroke-width:1.9;transition:transform .45s var(--spring)}
.forfeit:active .die{transform:rotate(90deg)}
.primary{
  display:block;width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;
  font:600 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.2px;padding:16px;cursor:pointer;
  transition:transform .18s var(--spring),opacity .18s ease;
}
.primary:active{transform:scale(.97);opacity:.85}
.ghost-btn{border:0;background:none;color:var(--tint);cursor:pointer;font:400 17px/1 -apple-system,system-ui,sans-serif;padding:16px 8px 2px}
.playing-net #reset{display:none}   /* по сети раунд начинается по согласию обоих */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* число повторов обязательно: бесконечная анимация (точки ожидания), сжатая
   до сотой миллисекунды, не замирает, а мерцает */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}}
@media (max-height:660px){
  .wordmark{width:min(205px,72%)}
  .mini{margin-bottom:22px}
  .footnote{margin-top:10px}
  .legal{margin-top:7px}
  .side .score{font-size:19px}
  .row{padding:11px 16px}
}
</style>
</head>
<body>

<div class="stack">

  <!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
  <section class="screen" id="menu">
    <a class="tohub" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Все игры</a>
    <div class="brand">
      <div class="mini" id="mini" aria-hidden="true"></div>

<script>
(function(){
"use strict";
var COLS=7, ROWS=6, SIZE=42;

var boardEl=document.getElementById('board');
var slider=document.getElementById('slider');
var hint=document.getElementById('hint');
var live=document.getElementById('live');
var sheet=document.getElementById('sheet');
var miniEl=document.getElementById('mini');

var grid=new Int8Array(SIZE);
var cells=[];
var mode=0;                 /* 0 — легко, 1 — сложно, 2 — вдвоём, 3 — по сети */
var turn=1, starter=1, moves=0;
var locked=false, over=false, hinted=false;
var scores=[0,0,0];
var aimCol=-1, aiming=false;
var session=0;   /* защита от отложенных таймеров прошлой партии */

/* ---------- заставка меню ---------- */
var MINI=[
  [1,0,'r',0],[1,1,'r',150],[1,2,'r',300],[1,3,'r',450],
  [0,0,'y',80],[0,2,'y',230],[0,3,'y',380]
];
function buildMini(){
  miniEl.innerHTML='';
  var slots=[];
  for(var i=0;i<10;i++){
    var c=document.createElement('div');
    c.className='c'; miniEl.appendChild(c); slots.push(c);
  }
  MINI.forEach(function(m){
    var d=document.createElement('div');
    d.className='d '+m[2];
    d.style.animationDelay=m[3]+'ms';
    slots[m[0]*5+m[1]].appendChild(d);
  });
}

/* ---------- поле ---------- */
for(var i=0;i<SIZE;i++){
  var cell=document.createElement('div');
  cell.className='cell';
  boardEl.appendChild(cell);
  cells.push(cell);
}

var WINS=[];
(function(){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) for(var d=0;d<4;d++){
    var dr=dirs[d][0], dc=dirs[d][1];
    var r3=r+3*dr, c3=c+3*dc;
    if(r3<0||r3>=ROWS||c3<0||c3>=COLS) continue;
    WINS.push([r*COLS+c,(r+dr)*COLS+(c+dc),(r+2*dr)*COLS+(c+2*dc),r3*COLS+c3]);
  }
})();

function freeRow(b,c){ for(var r=ROWS-1;r>=0;r--) if(!b[r*COLS+c]) return r; return -1; }

function winLine(b,r,c,p){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var d=0;d<4;d++){
    var dr=dirs[d][0], dc=dirs[d][1], line=[r*COLS+c];
    for(var s=-1;s<=1;s+=2){
      var rr=r+dr*s, cc=c+dc*s;
      while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&b[rr*COLS+cc]===p){
        line.push(rr*COLS+cc); rr+=dr*s; cc+=dc*s;
      }
    }
    if(line.length>=4) return line;
  }
  return null;
}

/* ---------- соперник ---------- */
var ORDER=[3,2,4,1,5,0,6];

function evaluate(b,me){
  var s=0, i, w, mine, his, v;
  for(i=0;i<WINS.length;i++){
    w=WINS[i]; mine=0; his=0;
    v=b[w[0]]; if(v===me)mine++; else if(v)his++;
    v=b[w[1]]; if(v===me)mine++; else if(v)his++;
    v=b[w[2]]; if(v===me)mine++; else if(v)his++;
    v=b[w[3]]; if(v===me)mine++; else if(v)his++;
    if(mine&&his) continue;
    if(mine===3)s+=48; else if(mine===2)s+=7; else if(mine===1)s+=1;
    if(his===3)s-=58; else if(his===2)s-=9; else if(his===1)s-=1;
  }
  for(var r=0;r<ROWS;r++){ var t=b[r*COLS+3]; if(t===me)s+=5; else if(t)s-=5; }
  return s;
}

function negamax(b,depth,alpha,beta,p){
  var mv=[], i, c, r;
  for(i=0;i<COLS;i++){ c=ORDER[i]; if(!b[c]) mv.push(c); }
  if(!mv.length) return 0;
  for(i=0;i<mv.length;i++){
    c=mv[i]; r=freeRow(b,c); b[r*COLS+c]=p;
    var w=winLine(b,r,c,p); b[r*COLS+c]=0;
    if(w) return 9000+depth;
  }
  if(depth===0) return evaluate(b,p);
  var best=-1e9;
  for(i=0;i<mv.length;i++){
    c=mv[i]; r=freeRow(b,c); b[r*COLS+c]=p;
    var v=-negamax(b,depth-1,-beta,-alpha,3-p);
    b[r*COLS+c]=0;
    if(v>best) best=v;
    if(best>alpha) alpha=best;
    if(alpha>=beta) break;
  }
  return best;
}

function chooseMove(){
  var legal=[], i, c;
  for(i=0;i<COLS;i++){ c=ORDER[i]; if(!grid[c]) legal.push(c); }
  if(!legal.length) return -1;
  if(mode===0 && Math.random()<0.35) return legal[(Math.random()*legal.length)|0];
  var depth = mode===0 ? 2 : 6;
  var best=-1e9, pick=legal[0], b=grid;
  for(i=0;i<legal.length;i++){
    c=legal[i];
    var r=freeRow(b,c); b[r*COLS+c]=2;
    var mine=winLine(b,r,c,2);
    var v = mine ? 1e6 : -negamax(b,depth-1,-1e9,1e9,1);
    b[r*COLS+c]=0;
    if(v>best){ best=v; pick=c; }
  }
  return pick;
}

/* ---------- ход ---------- */
function placeDisc(r,c,p,animate){
  var d=document.createElement('div');
  d.className='disc p'+p;
  if(animate && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    var px=boardEl.clientHeight/ROWS;
    d.style.setProperty('--fall',((r+1)*px)+'px');
    d.style.setProperty('--bounce',(px*0.13)+'px');
    d.style.setProperty('--dur',(0.30+r*0.035)+'s');
    d.classList.add('drop');
  }
  cells[r*COLS+c].appendChild(d);
  return d;
}

function haptic(ms,kind){ FX.fire(ms,kind); }

/* ---------- имена игроков ---------- */
/* Своё имя и имя друга лежат в общей памяти приложения, имя сетевого
   соперника приходит из комнаты. Пусто — показываем как раньше. */
function who(){
  var p=DP.names();
  if(mode===3){
    var me=p.me||'Вы', them=NET.oppName||'Соперник';
    return net.seat===2?[them,me]:[me,them];
  }
  if(mode===2) return [p.me||'Красные', p.friend||'Жёлтые'];
  return [p.me||'Вы','ИИ'];
}
/* настоящее ли имя у стороны — от этого зависит, как назвать победителя */
function named(i){
  var p=DP.names();
  if(mode===3) return i===net.seat ? !!p.me : !!NET.oppName;
  if(mode===2) return i===1 ? !!p.me : !!p.friend;
  return false;
}
function names(){ return who(); }

/* кого ждём: в сетевой партии точка ожидания у того, чей сейчас ход */
function sayTurn(){
  if(mode!==3){ live.textContent=names()[turn-1]+' ходят'; return; }
  live.textContent = turn===net.seat ? 'Ваш ход' : 'Ход соперника';
  netHint();
}

/* строка под полем в сетевой партии: чей ход и на связи ли соперник */
function netHint(){
  /* об обрыве связи предупреждает сам net.js, здесь только чей ход */
  if(mode!==3 || over) return;
  hint.style.opacity='1';
  hint.textContent = turn===net.seat ? 'Ваш ход' : 'Ход соперника';
}

/* имя приходит и от соперника по сети — в разметку только экранированным */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function updateTurn(){
  slider.style.transform='translateX('+(turn===1?0:100)+'%)';
  slider.style.opacity = over ? '0' : '1';
  /* точки ожидания: против ИИ они всегда справа, по сети — у того, чей ход */
  var wait = (locked && !over) ? (mode===3 ? turn : 2) : 0;
  var n=names(), i;
  for(i=1;i<=2;i++){
    document.getElementById('name'+i).innerHTML =
      esc(n[i-1]) + (wait===i ? ' <span class="dots"><i></i><i></i><i></i></span>' : '');
  }
}

function aiThink(extra){
  locked=true; updateTurn();
  var s=session;
  setTimeout(function(){
    if(s!==session) return;
    var mv=chooseMove();
    locked=false; updateTurn();
    if(mv>=0) play(mv);
  }, 400+(extra||0));
}

/* Сам ход: кладём фишку и двигаем партию дальше.
   Сюда приходят и свои ходы, и ходы соперника из сети — очерёдность
   проверяется раньше, в play() и на сервере. */
function drop(c,animate){
  var r=freeRow(grid,c);
  if(r<0) return false;
  clearAim();
  grid[r*COLS+c]=turn;
  placeDisc(r,c,turn,animate!==false);
  haptic(7);
  moves++;
  if(!hinted && mode!==3){ hinted=true; hint.style.opacity='0'; }
  var line=winLine(grid,r,c,turn);
  if(line){ finish(turn,line); return true; }
  if(moves===SIZE){ finish(0,null); return true; }
  turn=3-turn;
  if(mode<2 && turn===2){ aiThink(r*25); return true; }
  if(mode===3) locked = turn!==net.seat;
  updateTurn(); sayTurn();
  return true;
}

function play(c){
  if(over||locked) return;
  if(mode===3){
    if(turn!==net.seat || freeRow(grid,c)<0) return;
    drop(c,true);
    NET.send(c,turn);        /* drop уже передал очередь — её и сообщаем */
    return;
  }
  drop(c,true);
}

/* ---------- общая память приложения dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии. Всё в try/catch:
   если хранилище недоступно, игра работает как раньше, просто без истории. */
var DP=(function(){
  var KEY='dvoeplay:v1';
  function read(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.games) return d; }catch(e){}
    return {v:1,games:{}};
  }
  function write(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function save(id,r){
    r=r||{};
    var d=read(), g=d.games[id]||{plays:0,w1:0,w2:0,draws:0,solved:0,solo:0};
    g.plays=(g.plays||0)+1;
    if(r.win===1) g.w1=(g.w1||0)+1;
    else if(r.win===2) g.w2=(g.w2||0)+1;
    else if(r.mode===2) g.draws=(g.draws||0)+1;   /* ничья бывает только вдвоём */
    if(r.mode!==2) g.solo=(g.solo||0)+1;
    if(r.solved) g.solved=(g.solved||0)+1;
    g.last=Date.now(); g.note=r.note||''; g.mode=r.mode;
    d.games[id]=g;
    try{ duel(d,id,r); }catch(e){}
    write(d);
    /* итог партии — тем, кто слушает: мини-турнир (tour.js) ведёт по нему счёт.
       Бросаем после записи, чтобы слушатель читал уже обновлённую память. */
    try{ document.dispatchEvent(new CustomEvent('dp:save',{detail:{id:id,win:r.win,mode:r.mode}})); }catch(e){}
  }
  /* Сброс статистики стирает только историю партий. Имена, тема и звук —
     настройки, а не статистика: раньше сброс стирал весь ключ, и вместе
     со счётом пропадали имена, выбранная тема и выключенный звук. */
  function clear(){ var d=read(); d.games={}; delete d.duel; write(d); }

  /* ---------- кто кого ----------
     Партия на двоих — на одном телефоне или по сети — пишется ещё и по
     людям: кто выиграл, я или соперник. Счёт по цветам для этого не
     годится: по сети моё место в каждой комнате своё.
     На одном телефоне я — всегда первая сторона (так устроены имена), по
     сети — своё место NET.seat. Соперник на одном телефоне — роль «друг»,
     а не имя: переименуют — счёт останется за ним. По сети соперника узнаём
     по имени, и если оно совпало с именем друга — это он и есть. */
  var PAIRS=12, LOG=40;
  /* день начинается в четыре утра: партия после полуночи — тот же вечер */
  function day(t){ var x=new Date(t-4*36e5); return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }
  function duel(d,id,r){
    if(r.mode!==2) return;                          /* против ИИ и в одиночку — не пара */
    var N=window.NET, net=!!(N&&N.on), mine=net?N.seat:1;
    if(mine!==1 && mine!==2) return;
    var opp=net?clip(N.oppName):'', key=net?'net:'+opp.toLowerCase():'duo';
    var res = r.win===mine ? 1 : (r.win===1||r.win===2) ? 2 : 0;   /* 1 — я, 2 — соперник, 0 — ничья */
    var now=Date.now(), P=d.duel||(d.duel={p:{}});
    var p=P.p[key]||(P.p[key]={me:0,them:0,draw:0,g:{},log:[],run:null,since:now});
    if(net) p.name=opp;
    if(res===1) p.me++; else if(res===2) p.them++; else p.draw++;
    var t=p.g[id]||(p.g[id]=[0,0,0]);
    t[res===1?0:res===2?1:2]++;
    p.log.push([now,res,id]);
    if(p.log.length>LOG) p.log.splice(0,p.log.length-LOG);
    var today=day(now);
    if(!p.run || p.run.d!==today)
      p.run={d:today, n:(p.run && p.run.d===day(now-864e5)) ? p.run.n+1 : 1};
    p.last=now;
    fold(d);
    /* соперников по сети может набраться много — держим дюжину последних */
    var keys=Object.keys(P.p);
    if(keys.length>PAIRS){
      keys.sort(function(a,b){ return (P.p[a].last||0)-(P.p[b].last||0); });
      delete P.p[keys[0]];
    }
  }
  /* Друг с одного телефона и тот же человек по сети — одна пара. Имя друга
     могли вписать и после сетевых партий, поэтому сводим при каждом чтении. */
  function fold(d){
    var P=d.duel, f=names().friend, k='net:'+f.toLowerCase();
    if(!P || !P.p || !f || !P.p[k]) return false;
    var a=P.p.duo, b=P.p[k], id, i;
    if(!a){ P.p.duo=b; delete b.name; delete P.p[k]; return true; }
    a.me+=b.me; a.them+=b.them; a.draw+=b.draw;
    for(id in b.g) if(Object.prototype.hasOwnProperty.call(b.g,id)){
      var x=a.g[id]||(a.g[id]=[0,0,0]);
      for(i=0;i<3;i++) x[i]+=b.g[id][i];
    }
    a.log=a.log.concat(b.log).sort(function(u,v){ return u[0]-v[0]; }).slice(-LOG);
    /* серия вечеров — та, что свежее; в один и тот же день — та, что длиннее */
    if(b.run && (!a.run || (b.run.d===a.run.d ? b.run.n>a.run.n : (b.last||0)>(a.last||0)))) a.run=b.run;
    a.since=Math.min(a.since||b.since, b.since||a.since);
    a.last=Math.max(a.last||0, b.last||0);
    delete P.p[k];
    return true;
  }
  function pair(){
    var d=read();
    if(fold(d)) write(d);
    return d.duel||null;
  }
  function pairReset(key){
    var d=read();
    if(d.duel && d.duel.p && d.duel.p[key]){ delete d.duel.p[key]; write(d); }
  }

  /* Имена игроков. «me» — тот, кто держит телефон, «friend» — с кем
     играют вдвоём на одном телефоне. По сети имя соперника приходит из
     комнаты, здесь оно не хранится. Пусто — значит показываем как раньше. */
  var nmCache=null, nmAt=0;
  function clip(s){ return String(s==null?'':s).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').slice(0,12); }
  function names(v){
    if(v!==undefined){
      var d=read();
      d.names={me:clip(v.me),friend:clip(v.friend)};
      write(d); nmCache=null;
    }
    var n=Date.now();
    if(nmCache===null || n-nmAt>800){
      var q=read().names||{};
      nmCache={me:clip(q.me),friend:clip(q.friend)};
      nmAt=n;
    }
    return nmCache;
  }
  function sound(v){
    if(v===undefined){ try{ return read().sound!==false; }catch(e){ return true; } }
    var d=read(); d.sound=!!v; write(d); return d.sound;
  }
  /* Тема приложения: '' — как в телефоне, 'light'/'dark' — выбор игрока.
     К первой отрисовке её уже применил коротенький скрипт в шапке страницы; здесь
     только хранение и переключение на лету. */
  var LIGHT_BG='#F2F2F7', DARK_BG='#1C1C1E';
  /* Какой повод для большой плашки показали в прошлый раз — чтобы при
     следующем открытии главного экрана показать следующий по кругу.
     Пользуется этим только главный экран, но блок памяти у всех общий. */
  function hero(v){
    if(v!==undefined){ var d=read(); d.hero=String(v||''); write(d); return d.hero; }
    try{ return read().hero||''; }catch(e){ return ''; }
  }
  function theme(v){
    if(v!==undefined){
      var d=read();
      d.theme=(v==='light'||v==='dark')?v:'';
      write(d); wear(d.theme);
      return d.theme;
    }
    try{ var t=read().theme; return (t==='light'||t==='dark')?t:''; }catch(e){ return ''; }
  }
  /* какая тема на экране прямо сейчас — с оглядкой на настройки телефона */
  function dark(){
    var t=theme();
    if(t) return t==='dark';
    /* своей темы нет, но её мог поставить Telegram — тогда главнее он */
    try{ var a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; }catch(e){}
    try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
  }
  function wear(t){
    try{
      var r=document.documentElement, m, i;
      if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
      m=document.querySelectorAll('meta[name="theme-color"]');
      for(i=0;i<m.length;i++) m[i].setAttribute('content', dark()?DARK_BG:LIGHT_BG);
      /* внутри Telegram его шапка тоже должна перекраситься */
      var W=window.Telegram&&window.Telegram.WebApp;
      if(W){ W.setHeaderColor(dark()?DARK_BG:LIGHT_BG); W.setBackgroundColor(dark()?DARK_BG:LIGHT_BG); }
    }catch(e){}
  }
  return {read:read,save:save,clear:clear,sound:sound,names:names,theme:theme,dark:dark,hero:hero,
          pair:pair,pairReset:pairReset,day:day};
})();
/* ---------- звук и тактильная отдача dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии.
   Синтез на лету, файлов нет.

   Главное про характер: это ПЕРКУССИЯ, а не ноты. Ориентир —
   щелчок клавиатуры айфона: очень короткий сухой удар без звона,
   без обертонов и без реверберации, вся энергия в нижней середине.
   Две предыдущие попытки звучали звонко именно потому, что были
   построены как ноты с высокими обертонами и хвостом — не повторять.

   Щелчок = короткий шум через ФНЧ + короткий низкий «толчок».
   Вся шина дополнительно режется фильтром на 2.6кГц, поэтому
   в звуке физически нет частот, которые режут слух. */
var FX=(function(){
  var ctx=null, bus=null, lpf=null, noise=null;
  var lastKind='', lastAt=0, sndCache=null, sndAt=0;
  var CUT=4500;     /* «мягкость» — срез общего ФНЧ, Гц; выбрано на прослушивании */
  var VOL=0.95;     /* общая громкость */

  function allowed(){
    var n=Date.now();
    if(sndCache===null || n-sndAt>800){
      try{ sndCache=DP.read().sound!==false; }catch(e){ sndCache=true; }
      sndAt=n;
    }
    return sndCache;
  }
  function forget(){ sndCache=null; }
  function tune(cut,vol){
    if(cut){ CUT=cut; if(lpf) lpf.frequency.value=cut; }
    if(vol!==undefined){ VOL=vol; if(bus) bus.gain.value=vol; }
    return {cut:CUT,vol:VOL};
  }

  function boot(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=VOL;
      var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
      lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=CUT; lpf.Q.value=.7;
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=2.2;
      comp.attack.value=.003; comp.release.value=.15;
      bus.connect(hp); hp.connect(lpf); lpf.connect(comp); comp.connect(ctx.destination);
      var n=Math.floor(ctx.sampleRate*.06), nb=ctx.createBuffer(1,n,ctx.sampleRate), d=nb.getChannelData(0), i;
      for(i=0;i<n;i++) d[i]=Math.random()*2-1;
      noise=nb;
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* сухой щелчок: шум через ФНЧ, затухание за единицы миллисекунд */
  function click(gain,cut,dur,at){
    if(!ctx||!noise) return;
    try{
      var t=ctx.currentTime+(at||0);
      var s=ctx.createBufferSource(); s.buffer=noise;
      s.playbackRate.value=.9+Math.random()*.2;          /* лёгкий разброс, чтобы не повторялось */
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.Q.value=.6;
      var g=ctx.createGain();
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(bus);
      s.start(t); s.stop(t+dur+.02);
    }catch(e){}
  }
  /* низкий толчок — тело щелчка, одна синусоида без обертонов */
  function thump(freq,dur,gain,at,bend){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*bend),t+dur);
      var g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.002);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  /* мягкая нота — только для итогов, с чуть более долгим затуханием */
  function note(freq,dur,gain,at){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain(), g2=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.010);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      g2.gain.setValueAtTime(.0001,t);
      g2.gain.linearRampToValueAtTime(gain*.07,t+.010);
      g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.5);
      o.connect(g); g.connect(bus);
      o2.connect(g2); g2.connect(bus);
      o.start(t); o.stop(t+dur+.02);
      o2.start(t); o2.stop(t+dur*.5+.02);
    }catch(e){}
  }

  function play(kind){
    if(!boot()) return;
    if(ctx.state==='suspended'){ try{ var pr=ctx.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    switch(kind){
      case 'tick':                                     /* таймер */
        click(1.54,1000,.008);
        break;
      case 'light':                                    /* нажатие — как клавиша */
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
        break;
      case 'medium':                                   /* ход */
        click(1.61,1250,.016);
        thump(330,.045,.98,0,.80);
        break;
      case 'good':                                     /* удачно */
        click(.51,1500,.008);
        note(466.16,.16,.64);
        break;
      case 'heavy':                                    /* тяжёлый ход */
        click(1.66,850,.022);
        thump(200,.090,1.22,0,.72);
        break;
      case 'success':                                  /* победа */
        click(.17,1400,.008);
        note(392.00,.20,.29,0);
        note(523.25,.30,.26,.105);
        break;
      case 'error':                                    /* ошибка */
        click(.21,800,.014);
        thump(220.00,.14,.31,0,.85);
        thump(174.61,.20,.27,.105,.85);
        break;
      default:
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
    }
  }
  function buzz(pattern,kind){
    var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
    if(tg){
      try{
        if(kind==='success'||kind==='error'||kind==='warning') tg.notificationOccurred(kind);
        else if(kind==='heavy') tg.impactOccurred('heavy');
        else if(kind==='medium'||kind==='good') tg.impactOccurred('medium');
        else tg.impactOccurred('light');
        return;
      }catch(e){}
    }
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }
  function kindOf(v,kind){
    if(kind) return kind;
    if(Object.prototype.toString.call(v)==='[object Array]') return v.length>=5?'error':'success';
    if(v<=6)  return 'light';
    if(v<=11) return 'medium';
    return 'heavy';
  }
  function fire(pattern,kind){
    var k=kindOf(pattern,kind), now=Date.now();
    if(k===lastKind && now-lastAt<35) return;     /* без дублей от одного нажатия */
    lastKind=k; lastAt=now;
    if(allowed()) play(k);
    buzz(pattern,k);
  }

  /* мягкий щелчок по элементам управления */
  var UI=['row','btn','primary','back','icon','iconbtn','pill','forfeit','tohub','chip','hero','t'];
  document.addEventListener('pointerdown',function(e){
    var el=e.target, i;
    while(el && el.nodeType===1){
      if(el.classList) for(i=0;i<UI.length;i++) if(el.classList.contains(UI[i])){ fire(5,'light'); return; }
      el=el.parentNode;
    }
  },true);

  return {fire:fire,play:play,boot:boot,forget:forget,tune:tune};
})();


/* ---------- игра по сети ---------- */
/* Вся механика — в общем net.js. Здесь только то, что знает игра:
   как выглядит ход, чья сейчас очередь и что делать с чужим ходом. */
var net={seat:1,round:0,oppOnline:true,oppLeft:false};

NET.init({
  game:'dvoeplay',
  title:'4 в ряд',
  applied:function(){ return moves; },              /* столько ходов уже на поле */
  begin:function(c){ net.seat=c.seat; net.round=c.round; startGame(3); },
  round:function(c){ net.round=c.round; newRound(); },
  move:function(v){ if(!over) drop(v|0,true); },    /* ход соперника */
  peer:function(p){ net.oppOnline=p.online; net.oppLeft=p.left; },
  ended:function(){ showMenu(); }
});

function openSheet(p){
  /* для истории сетевая партия — это игра вдвоём: есть ничьи, не соло */
  DP.save('dvoeplay',{win:p||0,mode:mode===3?2:mode,
    note:(mode===3?'По сети · ':'')+'Счёт '+scores[1]+' : '+scores[2]});
  var title, sub=' Счёт '+scores[1]+' : '+scores[2];
  if(!p){ title='Ничья'; sub='Поле заполнено, победителя нет'; }
  else if(mode===2) title = named(p) ? 'Победа: '+who()[p-1] : 'Победили '+(p===1?'красные':'жёлтые');
  else if(mode===3) title = p===net.seat ? 'Вы выиграли'
    : (named(p) ? 'Победа: '+who()[p-1] : 'Выиграл соперник');
  else title = p===1 ? 'Вы выиграли' : 'Выиграл ИИ';
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetSub').textContent=sub.trim();
  var medal=document.getElementById('medal');
  medal.style.background = !p ? 'var(--well)'
    : (p===1 ? 'radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)'
             : 'radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)');
  /* фант достаётся проигравшему: вдвоём — обоим видно, иначе только ему */
  var showForfeit = mode===2 ? !!p : (mode===3 ? (!!p && p!==net.seat) : p===2);
  if(showForfeit){
    if(mode===2) loserSide=3-p;
    ftextEl.textContent=rollForfeit();
    forfeitEl.classList.add('on');
    forfeitEl.classList.remove('roll');
    sheet.classList.add('has-forfeit');
  } else {
    loserSide=0;
    forfeitEl.classList.remove('on');
    sheet.classList.remove('has-forfeit');
  }
  document.body.classList.add('open');
  live.textContent = title + (showForfeit ? '. ' + ftextEl.textContent : '');
}

function closeSheet(){
  document.body.classList.remove('open');
  hint.style.opacity='1';
  hint.classList.remove('warn');
  hint.innerHTML='<button type="button" id="againInline">Играть снова</button>';
  document.getElementById('againInline').onclick=againPressed;
}

/* «Играть снова»: в сетевой партии раунд начинается, только когда согласны оба */
function againPressed(){
  if(mode===3){ NET.rematch(); return; }
  newRound();
}

/* ---------- прицел ---------- */
function colFrom(x){
  var box=boardEl.getBoundingClientRect();
  var c=Math.floor((x-box.left)/(box.width/COLS));
  return Math.max(0,Math.min(COLS-1,c));
}
function setAim(c){
  if(c===aimCol) return;
  clearAim();
  var r=freeRow(grid,c);
  if(r<0) return;
  aimCol=c;
  placeDisc(r,c,turn,false).classList.add('aim');
}
function clearAim(){
  if(aimCol<0) return;
  var r=freeRow(grid,aimCol);
  if(r>=0){
    var host=cells[r*COLS+aimCol], g=host.querySelector('.aim');
    if(g) host.removeChild(g);
  }
  aimCol=-1;
}

boardEl.addEventListener('pointerdown',function(e){
  if(over||locked) return;
  aiming=true;
  try{ boardEl.setPointerCapture(e.pointerId); }catch(err){}
  setAim(colFrom(e.clientX));
});
boardEl.addEventListener('pointermove',function(e){ if(aiming) setAim(colFrom(e.clientX)); });
boardEl.addEventListener('pointerup',function(){
  if(!aiming) return;
  aiming=false;
  if(aimCol>=0) play(aimCol);
});
boardEl.addEventListener('pointercancel',function(){ aiming=false; clearAim(); });
boardEl.addEventListener('contextmenu',function(e){ e.preventDefault(); });
boardEl.addEventListener('keydown',function(e){
  if(over||locked) return;
  var c = aimCol<0 ? 3 : aimCol;
  if(e.key==='ArrowLeft'){ setAim(Math.max(0,c-1)); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ setAim(Math.min(COLS-1,c+1)); e.preventDefault(); }
  else if(e.key==='Enter'||e.key===' '){ if(aimCol>=0) play(aimCol); e.preventDefault(); }
});

/* ---------- раунды и экраны ---------- */
function newRound(){
  session++;
  grid=new Int8Array(SIZE);
  cells.forEach(function(c){ while(c.firstChild) c.removeChild(c.firstChild); });
  boardEl.classList.remove('decided');
  moves=0; over=false; locked=false; aimCol=-1; aiming=false;
  if(mode===3){
    starter = net.round%2===0 ? 1 : 2;   /* очередь первого хода задаёт сервер */
    turn=starter; locked = turn!==net.seat;
  } else { starter=3-starter; turn=starter; }
  document.body.classList.remove('open');
  if(hinted){ hint.textContent=''; hint.style.opacity='0'; }
  else hint.style.opacity='1';
  updateTurn();
  if(mode<2 && turn===2) aiThink(120);
  if(mode===3) netHint();
}

function startGame(m){
  mode=m;
  scores=[0,0,0];
  document.getElementById('score1').textContent='0';
  document.getElementById('score2').textContent='0';
  starter=2;
  hinted=false;
  hint.textContent='Коснитесь столбца, чтобы бросить фишку';
  document.body.classList.add('playing');
  document.body.classList.toggle('playing-net',m===3);
  document.getElementById('menu').setAttribute('aria-hidden','true');
  document.getElementById('game').removeAttribute('aria-hidden');
  newRound();
  setTimeout(function(){ boardEl.focus({preventScroll:true}); },520);
}

function showMenu(){
  if(NET.on) NET.leave();
  session++;
  document.body.classList.remove('open');
  document.body.classList.remove('playing');
  document.getElementById('game').setAttribute('aria-hidden','true');
  document.getElementById('menu').removeAttribute('aria-hidden');
  over=true; locked=true; aiming=false;
  setTimeout(buildMini,180);
}

[].slice.call(document.querySelectorAll('.row')).forEach(function(b){
  b.addEventListener('click',function(){
    var m=+b.getAttribute('data-mode');
    if(m===3) NET.open(); else startGame(m);
  });
});
document.getElementById('back').addEventListener('click',showMenu);
document.getElementById('reset').addEventListener('click',function(){ starter=3-starter; newRound(); });
document.getElementById('again').addEventListener('click',againPressed);
document.getElementById('look').addEventListener('click',closeSheet);
document.getElementById('backdrop').addEventListener('click',closeSheet);

var sy=null;
sheet.addEventListener('pointerdown',function(e){ sy=e.clientY; });
sheet.addEventListener('pointerup',function(e){ if(sy!==null && e.clientY-sy>60) closeSheet(); sy=null; });

window.addEventListener('resize',clearAim);
buildMini();
updateTurn();
})();
</script>
