<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<script>
/* Тема — до первой отрисовки, иначе при запуске мигнёт чужим фоном.
   Выбор игрока лежит в общей памяти приложения (ключ dvoeplay:v1);
   пусто — значит берём тему из настроек телефона, как раньше. */
(function(){try{
  var d=JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}'), t=d&&d.theme;
  if(t!=='light'&&t!=='dark') return;
  document.documentElement.setAttribute('data-theme',t);
  var c=t==='dark'?'#1C1C1E':'#F2F2F7', m=document.querySelectorAll('meta[name="theme-color"]'), i;
  for(i=0;i<m.length;i++) m[i].setAttribute('content',c);
}catch(e){}})();

/* Офлайн-режим: после первого открытия приложение работает и без сети
   (кроме игры по сети). Регистрируем после загрузки, чтобы не отнимать
   у страницы первые мгновения. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* Telegram. Его скрипт нужен только внутри мини-приложения: снаружи он
   лишь тормозил бы загрузку, а без сети вешал бы её. Первая страница
   внутри Telegram открывается с #tgWebAppData в адресе — это и признак;
   дальше помним его до конца сеанса, ведь при переходе в игру хвоста
   в адресе уже нет. */
(function(){
  var tg=false;
  try{
    tg=/tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy || sessionStorage.getItem('dp:tg')==='1';
    if(tg) sessionStorage.setItem('dp:tg','1');
  }catch(e){}
  if(!tg) return;
  var s=document.createElement('script');
  s.src='https://telegram.org/js/telegram-web-app.js';
  s.onload=function(){
    var W=window.Telegram&&window.Telegram.WebApp, root=document.documentElement;
    if(!W) return;
    function mine(){
      try{ var t=(JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}')||{}).theme;
           return t==='light'||t==='dark'?t:''; }catch(e){ return ''; }
    }
    function paint(){
      /* своей темы игрок не выбирал — идём за темой Telegram, а не телефона */
      if(!mine() && (W.colorScheme==='dark'||W.colorScheme==='light')) root.setAttribute('data-theme',W.colorScheme);
      var a=root.getAttribute('data-theme');
      var dark=a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var bg=dark?'#1C1C1E':'#F2F2F7';
      try{ W.setHeaderColor(bg); W.setBackgroundColor(bg); }catch(e){}
      try{ if(W.setBottomBarColor) W.setBottomBarColor(bg); }catch(e){}
    }
    try{ W.ready(); }catch(e){}
    try{ W.expand(); }catch(e){}
    /* свайп вниз не должен сворачивать приложение посреди партии:
       в «Матрёшке» и «Магнитном бое» фишки тянут пальцем */
    try{ if(W.disableVerticalSwipes) W.disableVerticalSwipes(); }catch(e){}
    paint();
    try{ W.onEvent('themeChanged',paint); }catch(e){}
    /* в играх кнопка «Назад» Telegram ведёт на главный экран */
    try{
      if(/(^|\/)(index\.html)?$/.test(location.pathname)) W.BackButton.hide();
      else { W.BackButton.show(); W.BackButton.onClick(function(){ location.href='index.html'; }); }
    }catch(e){}
    try{ document.dispatchEvent(new Event('dp:telegram')); }catch(e){}
  };
  document.head.appendChild(s);
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dvoeplay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Мемо-дуэль — dvoeplay</title>
<meta name="description" content="Находите пары по памяти и ходите снова. Игра для двоих: на одном телефоне, по сети или против ИИ.">
<!-- превью ссылки в Telegram, WhatsApp и других мессенджерах: без этого приглашение
     в сетевую игру приходит голой ссылкой. Картинка — по полному адресу, иначе не покажут -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="dvoeplay">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Мемо-дуэль — dvoeplay">
<meta property="og:description" content="Находите пары по памяти и ходите снова. Игра для двоих: на одном телефоне, по сети или против ИИ.">
<meta property="og:image" content="https://dvoeplay.netlify.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  color-scheme:light;      /* поля ввода и полосы прокрутки тоже светлые */
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --well:#E8E8ED;
  --fill:rgba(118,118,128,.12);
  --slider:#FFFFFF;
  --sep:#D6D6DB;
  --label:#000000;
  --label2:#6E6E73;
  --label3:#8E8E93;
  --tint:#007AFF;
  --ok:#248A3D;
  --red-a:#FF5247; --red-b:#E7362B;
  --yel-a:#FFD426; --yel-b:#F5BE0A;
  --spring:cubic-bezier(.34,.62,.3,1.25);
  --thumb-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --card-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.14);
  --tile-shadow:0 1px 2px rgba(0,0,0,.10),0 2px 6px -3px rgba(0,0,0,.14);
}
/* Тёмная тема. По умолчанию берётся из настроек телефона, но выбор
   в приложении важнее: атрибут data-theme ставится ещё до отрисовки. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1C1E;
    --surface:#2C2C2E;
    --well:#3A3A3C;
    --fill:rgba(118,118,128,.24);
    --slider:#4C4C50;
    --sep:#48484C;
    --label:#FFFFFF;
    --label2:#98989E;
    --label3:#76767C;
    --tint:#0A84FF;
    --ok:#30D158;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.4);
    --tile-shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1C1E;
    --surface:#2C2C2E;
    --well:#3A3A3C;
    --fill:rgba(118,118,128,.24);
    --slider:#4C4C50;
    --sep:#48484C;
    --label:#FFFFFF;
    --label2:#98989E;
    --label3:#76767C;
    --tint:#0A84FF;
    --ok:#30D158;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.4);
    --tile-shadow:0 1px 2px rgba(0,0,0,.35);
  }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
#app{position:fixed;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px);
  transition:transform .34s var(--spring),opacity .26s ease;
  will-change:transform;
}
/* Планшет и компьютер: колонка шириной с телефон по центру окна, как в
   «4 в ряд» и на главном экране, — а не список, табло и кнопки во всю ширину.
   Низкий альбомный телефон не трогаем: там ширина нужна раскладке «руки по бокам». */
@media (min-width:600px) and (min-height:561px){
  .screen{padding-left:max(calc(env(safe-area-inset-left) + 16px),calc((100% - 520px)/2));
          padding-right:max(calc(env(safe-area-inset-right) + 16px),calc((100% - 520px)/2))}
}
#game{transform:translateX(100%)}
#app.playing #game{transform:none}
#app.playing #menu{transform:translateX(-22%);opacity:0;pointer-events:none}

/* ---------- меню ---------- */
#menu{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#menu>*{flex-shrink:0}
/* Ничто в меню не сжимается меньше своего содержимого: на низком экране
   (iPhone SE в Safari — 375×548) меню прокручивается, а не сплющивает
   заставку в полоску и не наезжает подписью на заголовок списка. */
.brand{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}

.mini{
  position:relative;width:min(62%,216px);aspect-ratio:5/2;
  background:var(--surface);border-radius:18px;overflow:hidden;perspective:600px;
  box-shadow:var(--card-shadow);margin-bottom:30px;
  flex:none;
}
.mini .c{
  position:absolute;top:50%;width:19%;aspect-ratio:3/4;transform:translate(-50%,-50%);
  transition:left .34s var(--spring),opacity .34s ease,transform .34s var(--spring);
  transform-style:preserve-3d;
}
.mini .c .f{
  position:absolute;inset:0;border-radius:6px;display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.mini .c .f.b{background:var(--well)}
.mini .c .f.b::after{
  content:"";width:34%;aspect-ratio:1;border-radius:50%;opacity:.45;
  background:linear-gradient(90deg,var(--red-b) 0 50%,var(--yel-b) 50% 100%);
}
.mini .c .f.a{background:var(--well);transform:rotateY(180deg)}
.mini .c .f.a svg{width:52%;fill:var(--label2)}
.mini .c.up{transform:translate(-50%,-50%) rotateY(180deg)}
.mini .c.gone{opacity:0;transform:translate(-50%,-90%) rotateY(180deg) scale(.6)}
.mini .c.drop{animation:minidrop .5s cubic-bezier(.34,.62,.3,1.25) backwards}
@keyframes minidrop{from{opacity:0;transform:translate(-50%,-120%)}to{opacity:1}}

.wordmark{margin:0;width:min(240px,76%);line-height:0;color:var(--label)}
.wordmark svg{display:block;width:100%;height:auto;fill:currentColor}
.tagline{margin:9px 0 0;font-size:15px;color:var(--label2);letter-spacing:-.1px}

.section{font-size:17px;font-weight:600;letter-spacing:-.35px;margin:0 0 9px 4px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  border:0;background:none;color:inherit;font:inherit;text-align:left;
  padding:13px 16px;cursor:pointer;transition:background .12s ease;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.row:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.row i{font-style:normal;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.row .chev{width:9px;height:14px;flex:none;fill:none;stroke:var(--label3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.footnote{margin:14px 4px 0;font-size:12px;color:var(--label3);text-align:center;letter-spacing:-.02px}
.tohub{
  align-self:flex-start;flex:none;display:inline-flex;align-items:center;gap:5px;
  margin:0 0 4px;padding:10px 15px 10px 11px;border-radius:999px;
  background:var(--fill);color:var(--tint);text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:-.2px;
  transition:transform .16s var(--spring),opacity .16s ease;
}
.tohub svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tohub:active{transform:scale(.95);opacity:.7}
@media (max-height:660px){.tohub{padding:8px 13px 8px 10px;font-size:13px}}
.legal{margin:12px 0 2px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--label3)}
.legal sup{font-size:.7em;vertical-align:.5em;font-weight:500;letter-spacing:0;margin-left:.05em}

/* ---------- навигация ---------- */
/* сетка, а не флекс: боковые колонки равны, и название стоит по центру
   экрана, а не по центру того, что осталось от кнопок */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;flex:none}
.back{
  justify-self:start;display:flex;align-items:center;gap:3px;border:0;background:none;padding:0;cursor:pointer;
  color:var(--tint);font:inherit;font-size:17px;letter-spacing:-.3px;
}
.back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav .ttl{text-align:center;font-size:17px;font-weight:600;letter-spacing:-.35px}
.icon{
  justify-self:end;width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--fill);
  color:var(--tint);
  display:grid;place-items:center;cursor:pointer;transition:transform .18s var(--spring),opacity .18s ease;
}
.icon:active{transform:scale(.9);opacity:.6}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- счёт ---------- */
.score{
  position:relative;flex:none;margin-top:12px;padding:4px;border-radius:16px;background:var(--fill);
  display:grid;grid-template-columns:1fr 1fr;
}
.score .slider{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;
  background:var(--slider);box-shadow:var(--thumb-shadow);
  transition:transform .34s var(--spring);
}
.score.p2 .slider{transform:translateX(100%)}
.side{position:relative;padding:9px 6px 8px;text-align:center;transition:opacity .24s ease}
.side.off{opacity:.5}
.side .who{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.side .dot{width:8px;height:8px;border-radius:50%;flex:none}
.side.a .dot{background:radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)}
.side.b .dot{background:radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)}
.side .num{margin:1px 0 0;font-size:24px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
.side .cap{font-size:11px;color:var(--label3);letter-spacing:0}

/* ---------- поле ---------- */
.stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:11px 0 4px}
.board{
  flex:none;height:100%;width:auto;aspect-ratio:4/5;max-width:min(100%,392px);max-height:100%;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:8px;
}
.cell{position:relative;perspective:800px;-webkit-perspective:800px}
.card{
  position:absolute;inset:0;padding:0;border:0;background:none;cursor:pointer;
  transform-style:preserve-3d;transition:transform .4s var(--spring);
}
.cell.up .card,.cell.won .card{transform:rotateY(180deg)}
.cell.won .card{transform:rotateY(180deg) scale(.94);cursor:default}
.cell.miss .card{animation:nudge .34s ease}
.cell.pop .card{animation:pop .42s var(--spring)}
@keyframes nudge{0%,100%{transform:rotateY(180deg)}25%{transform:rotateY(180deg) translateX(-5%)}75%{transform:rotateY(180deg) translateX(5%)}}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.09)}100%{transform:rotateY(180deg) scale(.94)}}
.face{
  position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face.b{background:var(--surface);box-shadow:var(--tile-shadow)}
.face.b::after{
  content:"";width:30%;aspect-ratio:1;border-radius:50%;opacity:.22;
  background:linear-gradient(90deg,var(--red-b) 0 50%,var(--yel-b) 50% 100%);
}
.face.a{background:var(--well);transform:rotateY(180deg)}
.face.a svg{width:46%;fill:var(--label);opacity:.82}
.cell.won .face.a svg{fill:#fff;opacity:1}
.cell.won.p1 .face.a{background:radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)}
.cell.won.p2 .face.a{background:radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)}
.hint{
  flex:none;margin:6px 0 0;min-height:19px;text-align:center;
  font-size:13px;font-weight:600;letter-spacing:-.1px;color:var(--label2);
  transition:color .2s ease;
}
.hint.good{color:var(--ok)}

/* ---------- шторка итога ---------- */
.scrim{
  position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;
  transition:opacity .28s ease;
}
.scrim.on{opacity:1;pointer-events:auto}
/* закрытая шторка уезжает за край вместе со своей тенью: сдвинутая только
   на свою высоту, она оставляла тень на виду — серую полосу по низу экрана */
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  max-width:520px;margin:0 auto;
  border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(calc(100% + 60px));transition:transform .4s var(--spring);
  box-shadow:0 -12px 40px rgba(0,0,0,.16);
}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 12px}
.medal{
  width:56px;height:56px;border-radius:50%;margin:2px auto 14px;display:grid;place-items:center;
  box-shadow:var(--thumb-shadow);
}
.medal svg{width:28px;height:28px;fill:#fff}
.medal.a{background:radial-gradient(120% 120% at 32% 22%,var(--red-a),var(--red-b) 70%)}
.medal.b{background:radial-gradient(120% 120% at 32% 22%,var(--yel-a),var(--yel-b) 70%)}
.medal.n{background:var(--fill)}
.medal.n svg{fill:var(--label3)}
.sheet h2{margin:0;text-align:center;font-size:24px;font-weight:700;letter-spacing:-.45px}
.sheet p{margin:5px 0 22px;text-align:center;font-size:15px;color:var(--label2);letter-spacing:-.1px}
.forfeit{
  display:none;width:100%;align-items:center;gap:12px;text-align:left;
  background:var(--fill);border:0;border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:12px;
  color:inherit;font:inherit;cursor:pointer;transition:transform .18s var(--spring);
}
.forfeit.on{display:flex}
.forfeit:active{transform:scale(.98)}
.ftext{flex:1;font-size:16px;font-weight:600;letter-spacing:-.25px;transition:opacity .16s ease}
.forfeit.roll .ftext{opacity:0}
.forfeit .die{width:20px;height:20px;flex:none;fill:none;stroke:var(--label3);stroke-width:1.9;transition:transform .45s var(--spring)}
.forfeit:active .die{transform:rotate(90deg)}
.btn{
  display:block;width:100%;border:0;border-radius:14px;padding:14px;cursor:pointer;
  font:inherit;font-size:17px;font-weight:600;letter-spacing:-.3px;
  background:var(--fill);color:var(--label);transition:transform .14s var(--spring),opacity .14s;
}
.btn+.btn{margin-top:9px}
.btn.primary{background:var(--tint);color:#fff}
.btn:active{transform:scale(.97);opacity:.9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion: reduce){
  /* число повторов обязательно: бесконечная анимация (точки ожидания, пульс
     победной фишки), сжатая до миллисекунды, не замирает, а мерцает */
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.06s!important}
}
@media (max-height:660px){
  .wordmark{width:min(205px,72%)}
  .mini{margin-bottom:22px}
  .footnote{margin-top:10px}
  .legal{margin-top:7px}
  .side .num{font-size:21px}
  .row{padding:11px 16px}
  .score{margin-top:9px}
}
</style>
</head>
<body>
<div id="app">

  <section class="screen" id="menu">
    <a class="tohub" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Все игры</a>
    <div class="brand">
      <div class="mini" id="mini" aria-hidden="true"></div>

<script>
(function(){
"use strict";

/* ===== символы: 10 пар ===== */
var SHAPES=[
  '<circle cx="12" cy="12" r="9"/>',
  '<rect x="3.5" y="3.5" width="17" height="17" rx="4.6"/>',
  '<path d="M12 3.1 21.5 20.2h-19z"/>',

  '<path d="M12 20.7S3.3 15.3 3.3 9.4A4.75 4.75 0 0 1 12 6.6a4.75 4.75 0 0 1 8.7 2.8c0 5.9-8.7 11.3-8.7 11.3z"/>',
  '<path d="M20.1 14.7A8.7 8.7 0 0 1 9.3 3.9a8.85 8.85 0 1 0 10.8 10.8z"/>',
  '<path d="M13.7 2 5 13.5h5.3L9.7 22 19 10.3h-5.5z"/>',
  '<path d="M9.6 3h4.8v6.6H21v4.8h-6.6V21H9.6v-6.6H3V9.6h6.6z"/>',
  '<path d="M12 2.8c2.6 0 4.2 2.4 3.3 4.6 2.2-.9 4.6.7 4.6 3.3s-2.4 4.2-4.6 3.3c.9 2.2-.7 4.6-3.3 4.6s-4.2-2.4-3.3-4.6c-2.2.9-4.6-.7-4.6-3.3s2.4-4.2 4.6-3.3C7.8 5.2 9.4 2.8 12 2.8z"/>'
];
var PAIRS=SHAPES.length;              /* 10 пар, 20 карточек, сетка 4×5 */
/* [для «Красные/Жёлтые …» , для «Вы …»] */
var FORFEIT=[
  ['моют посуду','моете посуду','моет посуду'],
  ['выносят мусор','выносите мусор','выносит мусор'],
  ['заваривают чай','завариваете чай','заваривает чай'],
  ['готовят завтрак','готовите завтрак','готовит завтрак'],
  ['пылесосят в комнате','пылесосите в комнате','пылесосит в комнате'],
  ['собирают со стола','собираете со стола','собирает со стола'],
  ['поливают цветы','поливаете цветы','поливает цветы'],
  ['загружают посудомойку','загружаете посудомойку','загружает посудомойку'],
  ['идут за мороженым','идёте за мороженым','идёт за мороженым'],
  ['моют пол на кухне','моете пол на кухне','моет пол на кухне'],
  ['выгуливают собаку','выгуливаете собаку','выгуливает собаку'],
  ['застилают постель три дня','застилаете постель три дня','застилает постель три дня'],
  ['уступают пульт на вечер','уступаете пульт на вечер','уступает пульт на вечер'],
  ['отжимаются десять раз','отжимаетесь десять раз','отжимается десять раз'],
  ['рассказывают анекдот','рассказываете анекдот','рассказывает анекдот'],
  ['поют куплет по выбору победителя','поёте куплет по выбору победителя','поёт куплет по выбору победителя'],
  ['придумывают ужин на завтра','придумываете ужин на завтра','придумывает ужин на завтра'],
  ['молчат целую минуту','молчите целую минуту','молчит целую минуту'],
  ['три раза говорят «ты сегодня сильнее»','три раза говорите «ты сегодня сильнее»','три раза говорит «ты сегодня сильнее»'],
  ['делают победителю комплимент','делаете победителю комплимент','делает победителю комплимент']
];

/* ===== состояние ===== */
var app=document.getElementById('app'), board=document.getElementById('board');
var hint=document.getElementById('hint'), scoreEl=document.getElementById('score');
var numA=document.getElementById('numA'), numB=document.getElementById('numB');
var sideA=document.getElementById('sideA'), sideB=document.getElementById('sideB');
var nameA=document.getElementById('nameA'), nameB=document.getElementById('nameB');
var scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
var medal=document.getElementById('medal'), sTitle=document.getElementById('sheetTitle');
var sText=document.getElementById('sheetText'), liveEl=document.getElementById('live');

var mode=2;                 /* 0 легко, 1 сложно, 2 вдвоём, 3 по сети */
var net={seat:1,round:0};
var flips=0;                /* сколько карточек открыто за раунд — по этому net.js догоняет */
var deck=[], cells=[], open=[], mem={}, taken=0;
var turn=0, score=[0,0], lock=true, session=0, timers=[];
/* ---------- имена игроков ---------- */
/* Своё имя и имя друга лежат в общей памяти приложения, имя сетевого
   соперника приходит из комнаты. Пусто — показываем как раньше. */
function who(){
  var p=DP.names();
  if(mode===3){
    var me=p.me||'Вы', them=NET.oppName||'Соперник';
    return net.seat===2?[them,me]:[me,them];
  }
  if(mode===2) return [p.me||'Красные', p.friend||'Жёлтые'];
  return [p.me||'Вы','Соперник'];
}
/* настоящее ли имя у стороны — от этого зависит, как назвать победителя */
function named(i){
  var p=DP.names();
  if(mode===3) return i===net.seat ? !!p.me : !!NET.oppName;
  if(mode===2) return i===1 ? !!p.me : !!p.friend;
  return false;
}
/* места сервера — 1 и 2, ходы внутри игры — 0 и 1 */
function mySide(){ return net.seat-1; }
function notMine(){
  if(mode===3) return turn!==mySide();
  return mode<2 && turn===1;
}
var lastForfeit=-1, loserSide=0;
var forfeitEl=document.getElementById('forfeit');
var ftextEl=document.getElementById('ftext');

function tap(ms,kind){ FX.fire(ms,kind); }
function later(fn,ms){ var s=session; timers.push(setTimeout(function(){ if(s===session) fn(); },ms)); }
function stop(){ session++; timers.forEach(clearTimeout); timers=[]; }
function svg(i){ return '<svg viewBox="0 0 24 24">'+SHAPES[i]+'</svg>'; }

/* ===== ход соперника: чистая логика, без DOM ===== */
/* SIM-START */
function botFirst(memory, free){
  var seen=free.filter(function(i){ return memory[i]!==undefined; });
  for(var x=0;x<seen.length;x++)
    for(var y=x+1;y<seen.length;y++)
      if(memory[seen[x]]===memory[seen[y]]) return [seen[x],seen[y]];
  var blind=free.filter(function(i){ return memory[i]===undefined; });
  var pool=blind.length?blind:free;
  return [pool[Math.floor(Math.random()*pool.length)],null];
}
function botSecond(memory, free, val){
  var hit=free.filter(function(i){ return memory[i]===val; });
  if(hit.length) return hit[0];
  var blind=free.filter(function(i){ return memory[i]===undefined; });
  var pool=blind.length?blind:free;
  return pool[Math.floor(Math.random()*pool.length)];
}
/* SIM-END */

/* ===== партия ===== */
function deal(){
  stop();
  var vals=[],i;
  for(i=0;i<PAIRS;i++){ vals.push(i); vals.push(i); }
  /* по сети тасуем общим генератором комнаты — иначе у игроков разные карты */
  var rnd = (mode===3 && NET.rng) ? NET.rng : Math.random;
  for(i=vals.length-1;i>0;i--){ var k=Math.floor(rnd()*(i+1)), t=vals[i]; vals[i]=vals[k]; vals[k]=t; }
  deck=vals; open=[]; mem={}; taken=0; score=[0,0]; lock=false; flips=0;
  turn = mode===3 ? (net.round%2===0?0:1) : 0;   /* очередь задаёт сервер */

  board.innerHTML=''; cells=[];
  vals.forEach(function(v,idx){
    var cell=document.createElement('div');
    cell.className='cell';
    cell.innerHTML='<button class="card" aria-label="Карточка '+(idx+1)+'">'+
      '<span class="face b"></span><span class="face a">'+svg(v)+'</span></button>';
    cell.firstChild.addEventListener('click',function(){ human(idx); });
    board.appendChild(cell); cells.push(cell);
  });

  var w=who();
  nameA.textContent=w[0];
  nameB.textContent=w[1];
  paint(); say(turnWord()+' ход');
}

function paint(){
  numA.textContent=score[0]; numB.textContent=score[1];
  scoreEl.classList.toggle('p2',turn===1);
  sideA.classList.toggle('off',turn!==0);
  sideB.classList.toggle('off',turn!==1);
}
function turnWord(){
  if(mode===3) return turn===mySide()?'Ваш':'Соперника';
  if(mode===2) return turn===0?'Красных':'Жёлтых';
  return turn===0?'Ваш':'Соперника';
}
function say(t,good){ hint.textContent=t; hint.classList.toggle('good',!!good); liveEl.textContent=t; }

function free(){
  var r=[];
  for(var i=0;i<deck.length;i++)
    if(!cells[i].classList.contains('won') && open.indexOf(i)<0) r.push(i);
  return r;
}
function remember(i){
  if(mode===0 && Math.random()>0.5) { delete mem[i]; return; }
  mem[i]=deck[i];
}

function human(i){
  if(lock) return;
  if(notMine()) return;
  if(open.indexOf(i)>-1 || cells[i].classList.contains('won')) return;
  flip(i);
  if(mode===3){
    /* пара уже видна сразу — значит уже известно, останется ли ход за нами */
    var keep = open.length<2 || deck[open[0]]===deck[open[1]];
    NET.send(i, keep ? turn+1 : 2-turn);
  }
}
function flip(i){
  cells[i].classList.add('up'); open.push(i); remember(i); tap(8); flips++;
  if(open.length===2){ lock=true; later(judge,760); }
}

function judge(){
  var a=open[0], b=open[1];
  if(deck[a]===deck[b]){
    var cls=turn===0?'p1':'p2';
    [a,b].forEach(function(i){
      cells[i].classList.remove('up');
      cells[i].classList.add('won',cls,'pop');
      later(function(){ cells[i].classList.remove('pop'); },460);
      delete mem[i];
    });
    score[turn]++; taken++; open=[]; lock=false; paint(); tap([12,40,18]);
    if(taken===PAIRS){ finish(); return; }
    say(mode===2 ? 'Пара! '+turnWord()+' ход снова'
      : (turn===(mode===3?mySide():0) ? 'Пара! Ходите снова' : 'Пара у соперника'), true);
    if(mode<2 && turn===1) later(bot,780);
  }else{
    [a,b].forEach(function(i){
      cells[i].classList.add('miss');
      later(function(){ cells[i].classList.remove('miss','up'); },300);
    });
    later(function(){
      open=[]; turn=1-turn; lock=false; paint(); say(turnWord()+' ход');
      if(mode<2 && turn===1) later(bot,620);
    },420);
  }
}

function bot(){
  var av=free(); if(!av.length) return;
  var picked=botFirst(mem,av), first=picked[0], known=picked[1];
  flip(first);
  later(function(){
    var rest=free();
    var second = known!==null && rest.indexOf(known)>-1 ? known : botSecond(mem,rest,deck[first]);
    if(second===undefined) second=rest[0];
    flip(second);
  },700);
}

/* ===== итог ===== */
function rollForfeit(){
  var i;
  do{ i=(Math.random()*FORFEIT.length)|0; } while(i===lastForfeit&&FORFEIT.length>1);
  lastForfeit=i;
  if(mode===2){
    if(named(loserSide)) return who()[loserSide-1]+' '+FORFEIT[i][2];
    return (loserSide===1?'Красные ':'Жёлтые ')+FORFEIT[i][0];
  }
  return 'Вы '+FORFEIT[i][1];
}
forfeitEl.addEventListener('click',function(){
  forfeitEl.classList.add('roll');
  setTimeout(function(){ ftextEl.textContent=rollForfeit(); forfeitEl.classList.remove('roll'); },170);
});
/* ---------- общая память приложения dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии. Всё в try/catch:
   если хранилище недоступно, игра работает как раньше, просто без истории. */
var DP=(function(){
  var KEY='dvoeplay:v1';
  function read(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.games) return d; }catch(e){}
    return {v:1,games:{}};
  }
  function write(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function save(id,r){
    r=r||{};
    var d=read(), g=d.games[id]||{plays:0,w1:0,w2:0,draws:0,solved:0,solo:0};
    g.plays=(g.plays||0)+1;
    if(r.win===1) g.w1=(g.w1||0)+1;
    else if(r.win===2) g.w2=(g.w2||0)+1;
    else if(r.mode===2) g.draws=(g.draws||0)+1;   /* ничья бывает только вдвоём */
    if(r.mode!==2) g.solo=(g.solo||0)+1;
    if(r.solved) g.solved=(g.solved||0)+1;
    g.last=Date.now(); g.note=r.note||''; g.mode=r.mode;
    d.games[id]=g;
    try{ duel(d,id,r); }catch(e){}
    write(d);
    /* итог партии — тем, кто слушает: мини-турнир (tour.js) ведёт по нему счёт.
       Бросаем после записи, чтобы слушатель читал уже обновлённую память. */
    try{ document.dispatchEvent(new CustomEvent('dp:save',{detail:{id:id,win:r.win,mode:r.mode}})); }catch(e){}
  }
  /* Сброс статистики стирает только историю партий. Имена, тема и звук —
     настройки, а не статистика: раньше сброс стирал весь ключ, и вместе
     со счётом пропадали имена, выбранная тема и выключенный звук. */
  function clear(){ var d=read(); d.games={}; delete d.duel; write(d); }

  /* ---------- кто кого ----------
     Партия на двоих — на одном телефоне или по сети — пишется ещё и по
     людям: кто выиграл, я или соперник. Счёт по цветам для этого не
     годится: по сети моё место в каждой комнате своё.
     На одном телефоне я — всегда первая сторона (так устроены имена), по
     сети — своё место NET.seat. Соперник на одном телефоне — роль «друг»,
     а не имя: переименуют — счёт останется за ним. По сети соперника узнаём
     по имени, и если оно совпало с именем друга — это он и есть. */
  var PAIRS=12, LOG=40;
  /* день начинается в четыре утра: партия после полуночи — тот же вечер */
  function day(t){ var x=new Date(t-4*36e5); return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }
  function duel(d,id,r){
    if(r.mode!==2) return;                          /* против ИИ и в одиночку — не пара */
    var N=window.NET, net=!!(N&&N.on), mine=net?N.seat:1;
    if(mine!==1 && mine!==2) return;
    var opp=net?clip(N.oppName):'', key=net?'net:'+opp.toLowerCase():'duo';
    var res = r.win===mine ? 1 : (r.win===1||r.win===2) ? 2 : 0;   /* 1 — я, 2 — соперник, 0 — ничья */
    var now=Date.now(), P=d.duel||(d.duel={p:{}});
    var p=P.p[key]||(P.p[key]={me:0,them:0,draw:0,g:{},log:[],run:null,since:now});
    if(net) p.name=opp;
    if(res===1) p.me++; else if(res===2) p.them++; else p.draw++;
    var t=p.g[id]||(p.g[id]=[0,0,0]);
    t[res===1?0:res===2?1:2]++;
    p.log.push([now,res,id]);
    if(p.log.length>LOG) p.log.splice(0,p.log.length-LOG);
    var today=day(now);
    if(!p.run || p.run.d!==today)
      p.run={d:today, n:(p.run && p.run.d===day(now-864e5)) ? p.run.n+1 : 1};
    p.last=now;
    fold(d);
    /* соперников по сети может набраться много — держим дюжину последних */
    var keys=Object.keys(P.p);
    if(keys.length>PAIRS){
      keys.sort(function(a,b){ return (P.p[a].last||0)-(P.p[b].last||0); });
      delete P.p[keys[0]];
    }
  }
  /* Друг с одного телефона и тот же человек по сети — одна пара. Имя друга
     могли вписать и после сетевых партий, поэтому сводим при каждом чтении. */
  function fold(d){
    var P=d.duel, f=names().friend, k='net:'+f.toLowerCase();
    if(!P || !P.p || !f || !P.p[k]) return false;
    var a=P.p.duo, b=P.p[k], id, i;
    if(!a){ P.p.duo=b; delete b.name; delete P.p[k]; return true; }
    a.me+=b.me; a.them+=b.them; a.draw+=b.draw;
    for(id in b.g) if(Object.prototype.hasOwnProperty.call(b.g,id)){
      var x=a.g[id]||(a.g[id]=[0,0,0]);
      for(i=0;i<3;i++) x[i]+=b.g[id][i];
    }
    a.log=a.log.concat(b.log).sort(function(u,v){ return u[0]-v[0]; }).slice(-LOG);
    /* серия вечеров — та, что свежее; в один и тот же день — та, что длиннее */
    if(b.run && (!a.run || (b.run.d===a.run.d ? b.run.n>a.run.n : (b.last||0)>(a.last||0)))) a.run=b.run;
    a.since=Math.min(a.since||b.since, b.since||a.since);
    a.last=Math.max(a.last||0, b.last||0);
    delete P.p[k];
    return true;
  }
  function pair(){
    var d=read();
    if(fold(d)) write(d);
    return d.duel||null;
  }
  function pairReset(key){
    var d=read();
    if(d.duel && d.duel.p && d.duel.p[key]){ delete d.duel.p[key]; write(d); }
  }

  /* Имена игроков. «me» — тот, кто держит телефон, «friend» — с кем
     играют вдвоём на одном телефоне. По сети имя соперника приходит из
     комнаты, здесь оно не хранится. Пусто — значит показываем как раньше. */
  var nmCache=null, nmAt=0;
  function clip(s){ return String(s==null?'':s).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').slice(0,12); }
  function names(v){
    if(v!==undefined){
      var d=read();
      d.names={me:clip(v.me),friend:clip(v.friend)};
      write(d); nmCache=null;
    }
    var n=Date.now();
    if(nmCache===null || n-nmAt>800){
      var q=read().names||{};
      nmCache={me:clip(q.me),friend:clip(q.friend)};
      nmAt=n;
    }
    return nmCache;
  }
  function sound(v){
    if(v===undefined){ try{ return read().sound!==false; }catch(e){ return true; } }
    var d=read(); d.sound=!!v; write(d); return d.sound;
  }
  /* Тема приложения: '' — как в телефоне, 'light'/'dark' — выбор игрока.
     К первой отрисовке её уже применил коротенький скрипт в шапке страницы; здесь
     только хранение и переключение на лету. */
  var LIGHT_BG='#F2F2F7', DARK_BG='#1C1C1E';
  /* Какой повод для большой плашки показали в прошлый раз — чтобы при
     следующем открытии главного экрана показать следующий по кругу.
     Пользуется этим только главный экран, но блок памяти у всех общий. */
  function hero(v){
    if(v!==undefined){ var d=read(); d.hero=String(v||''); write(d); return d.hero; }
    try{ return read().hero||''; }catch(e){ return ''; }
  }
  function theme(v){
    if(v!==undefined){
      var d=read();
      d.theme=(v==='light'||v==='dark')?v:'';
      write(d); wear(d.theme);
      return d.theme;
    }
    try{ var t=read().theme; return (t==='light'||t==='dark')?t:''; }catch(e){ return ''; }
  }
  /* какая тема на экране прямо сейчас — с оглядкой на настройки телефона */
  function dark(){
    var t=theme();
    if(t) return t==='dark';
    /* своей темы нет, но её мог поставить Telegram — тогда главнее он */
    try{ var a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; }catch(e){}
    try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
  }
  function wear(t){
    try{
      var r=document.documentElement, m, i;
      if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
      m=document.querySelectorAll('meta[name="theme-color"]');
      for(i=0;i<m.length;i++) m[i].setAttribute('content', dark()?DARK_BG:LIGHT_BG);
      /* внутри Telegram его шапка тоже должна перекраситься */
      var W=window.Telegram&&window.Telegram.WebApp;
      if(W){ W.setHeaderColor(dark()?DARK_BG:LIGHT_BG); W.setBackgroundColor(dark()?DARK_BG:LIGHT_BG); }
    }catch(e){}
  }
  return {read:read,save:save,clear:clear,sound:sound,names:names,theme:theme,dark:dark,hero:hero,
          pair:pair,pairReset:pairReset,day:day};
})();
/* ---------- звук и тактильная отдача dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии.
   Синтез на лету, файлов нет.

   Главное про характер: это ПЕРКУССИЯ, а не ноты. Ориентир —
   щелчок клавиатуры айфона: очень короткий сухой удар без звона,
   без обертонов и без реверберации, вся энергия в нижней середине.
   Две предыдущие попытки звучали звонко именно потому, что были
   построены как ноты с высокими обертонами и хвостом — не повторять.

   Щелчок = короткий шум через ФНЧ + короткий низкий «толчок».
   Вся шина дополнительно режется фильтром на 2.6кГц, поэтому
   в звуке физически нет частот, которые режут слух. */
var FX=(function(){
  var ctx=null, bus=null, lpf=null, noise=null;
  var lastKind='', lastAt=0, sndCache=null, sndAt=0;
  var CUT=4500;     /* «мягкость» — срез общего ФНЧ, Гц; выбрано на прослушивании */
  var VOL=0.95;     /* общая громкость */

  function allowed(){
    var n=Date.now();
    if(sndCache===null || n-sndAt>800){
      try{ sndCache=DP.read().sound!==false; }catch(e){ sndCache=true; }
      sndAt=n;
    }
    return sndCache;
  }
  function forget(){ sndCache=null; }
  function tune(cut,vol){
    if(cut){ CUT=cut; if(lpf) lpf.frequency.value=cut; }
    if(vol!==undefined){ VOL=vol; if(bus) bus.gain.value=vol; }
    return {cut:CUT,vol:VOL};
  }

  function boot(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=VOL;
      var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
      lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=CUT; lpf.Q.value=.7;
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=2.2;
      comp.attack.value=.003; comp.release.value=.15;
      bus.connect(hp); hp.connect(lpf); lpf.connect(comp); comp.connect(ctx.destination);
      var n=Math.floor(ctx.sampleRate*.06), nb=ctx.createBuffer(1,n,ctx.sampleRate), d=nb.getChannelData(0), i;
      for(i=0;i<n;i++) d[i]=Math.random()*2-1;
      noise=nb;
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* сухой щелчок: шум через ФНЧ, затухание за единицы миллисекунд */
  function click(gain,cut,dur,at){
    if(!ctx||!noise) return;
    try{
      var t=ctx.currentTime+(at||0);
      var s=ctx.createBufferSource(); s.buffer=noise;
      s.playbackRate.value=.9+Math.random()*.2;          /* лёгкий разброс, чтобы не повторялось */
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.Q.value=.6;
      var g=ctx.createGain();
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(bus);
      s.start(t); s.stop(t+dur+.02);
    }catch(e){}
  }
  /* низкий толчок — тело щелчка, одна синусоида без обертонов */
  function thump(freq,dur,gain,at,bend){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*bend),t+dur);
      var g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.002);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  /* мягкая нота — только для итогов, с чуть более долгим затуханием */
  function note(freq,dur,gain,at){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain(), g2=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.010);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      g2.gain.setValueAtTime(.0001,t);
      g2.gain.linearRampToValueAtTime(gain*.07,t+.010);
      g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.5);
      o.connect(g); g.connect(bus);
      o2.connect(g2); g2.connect(bus);
      o.start(t); o.stop(t+dur+.02);
      o2.start(t); o2.stop(t+dur*.5+.02);
    }catch(e){}
  }

  function play(kind){
    if(!boot()) return;
    if(ctx.state==='suspended'){ try{ var pr=ctx.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    switch(kind){
      case 'tick':                                     /* таймер */
        click(1.54,1000,.008);
        break;
      case 'light':                                    /* нажатие — как клавиша */
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
        break;
      case 'medium':                                   /* ход */
        click(1.61,1250,.016);
        thump(330,.045,.98,0,.80);
        break;
      case 'good':                                     /* удачно */
        click(.51,1500,.008);
        note(466.16,.16,.64);
        break;
      case 'heavy':                                    /* тяжёлый ход */
        click(1.66,850,.022);
        thump(200,.090,1.22,0,.72);
        break;
      case 'success':                                  /* победа */
        click(.17,1400,.008);
        note(392.00,.20,.29,0);
        note(523.25,.30,.26,.105);
        break;
      case 'error':                                    /* ошибка */
        click(.21,800,.014);
        thump(220.00,.14,.31,0,.85);
        thump(174.61,.20,.27,.105,.85);
        break;
      default:
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
    }
  }
  function buzz(pattern,kind){
    var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
    if(tg){
      try{
        if(kind==='success'||kind==='error'||kind==='warning') tg.notificationOccurred(kind);
        else if(kind==='heavy') tg.impactOccurred('heavy');
        else if(kind==='medium'||kind==='good') tg.impactOccurred('medium');
        else tg.impactOccurred('light');
        return;
      }catch(e){}
    }
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }
  function kindOf(v,kind){
    if(kind) return kind;
    if(Object.prototype.toString.call(v)==='[object Array]') return v.length>=5?'error':'success';
    if(v<=6)  return 'light';
    if(v<=11) return 'medium';
    return 'heavy';
  }
  function fire(pattern,kind){
    var k=kindOf(pattern,kind), now=Date.now();
    if(k===lastKind && now-lastAt<35) return;     /* без дублей от одного нажатия */
    lastKind=k; lastAt=now;
    if(allowed()) play(k);
    buzz(pattern,k);
  }

  /* мягкий щелчок по элементам управления */
  var UI=['row','btn','primary','back','icon','iconbtn','pill','forfeit','tohub','chip','hero','t'];
  document.addEventListener('pointerdown',function(e){
    var el=e.target, i;
    while(el && el.nodeType===1){
      if(el.classList) for(i=0;i<UI.length;i++) if(el.classList.contains(UI[i])){ fire(5,'light'); return; }
      el=el.parentNode;
    }
  },true);

  return {fire:fire,play:play,boot:boot,forget:forget,tune:tune};
})();


function finish(){
  lock=true;
  var w = score[0]>score[1] ? 0 : (score[1]>score[0] ? 1 : -1);
  var res=score[0]+':'+score[1];
  if(mode===3) NET.result(w<0?0:w+1);
  /* для истории сетевая партия — это игра вдвоём: есть ничьи, не соло */
  DP.save('memo-duel',{win:w<0?0:w+1,mode:mode===3?2:mode,
    note:(mode===3?'По сети · ':'')+'Счёт '+score[0]+' : '+score[1]});
  medal.className='medal '+(w===0?'a':w===1?'b':'n');
  if(w<0){
    sTitle.textContent='Ничья';
    sText.textContent='Поровну, '+res+'. Пересдать?';
  }else if(mode===2){
    sTitle.textContent = named(w+1) ? 'Победа: '+who()[w] : ((w===0?'Красные':'Жёлтые')+' выиграли');
    sText.textContent=res;
  }else if(mode===3){
    sTitle.textContent = w===mySide() ? 'Вы выиграли'
      : (named(w+1) ? 'Победа: '+who()[w] : 'Соперник выиграл');
    sText.textContent = res;
  }else{
    sTitle.textContent = w===0 ? 'Вы выиграли' : 'Соперник выиграл';
    sText.textContent = res+' — '+(mode===0?'лёгкий':'сложный')+' соперник';
  }
  /* фант достаётся проигравшему: вдвоём видят оба, иначе только он сам */
  var showForfeit = mode===2 ? w>=0 : (mode===3 ? (w>=0 && w!==mySide()) : w===1);
  if(showForfeit){
    if(mode===2) loserSide = w===0 ? 2 : 1;
    ftextEl.textContent=rollForfeit();
    forfeitEl.classList.add('on');
  }else{
    forfeitEl.classList.remove('on');
  }
  say(w<0?'Ничья':turnWord()+' победа');
  later(function(){ scrim.classList.add('on'); sheet.classList.add('on'); },520);
  tap(w===0?[14,50,22]:12);
}
function closeSheet(){ scrim.classList.remove('on'); sheet.classList.remove('on'); }

/* ===== заставка меню ===== */
var miniEl=document.getElementById('mini');
var MINI=[[24,4,0],[50,7,180],[76,4,360]];
function playMini(){
  miniEl.innerHTML='';
  var els=[];
  MINI.forEach(function(m,i){
    var c=document.createElement('div');
    c.className='c drop'; c.style.left=m[0]+'%'; c.style.animationDelay=m[2]+'ms';
    c.innerHTML='<span class="f b"></span><span class="f a">'+svg(m[1])+'</span>';
    miniEl.appendChild(c); els.push(c);
  });
  var t=[];
  t.push(setTimeout(function(){ els[0].classList.add('up'); },1150));
  t.push(setTimeout(function(){ els[2].classList.add('up'); },1600));
  t.push(setTimeout(function(){ els[0].classList.add('gone'); els[2].classList.add('gone'); },2500));
  t.push(setTimeout(playMini,3900));
  miniEl.timers=t;
}
function stopMini(){ if(miniEl.timers) miniEl.timers.forEach(clearTimeout); }

/* ===== переходы ===== */
function openGame(m){
  mode=m; app.classList.add('playing'); stopMini(); closeSheet();
  document.body.classList.toggle('playing-net',m===3);
  deal();
}
function goMenu(){
  if(NET.on) NET.leave();
  document.body.classList.remove('playing-net');
  stop(); closeSheet(); app.classList.remove('playing'); lock=true; stopMini(); playMini();
}
Array.prototype.forEach.call(document.querySelectorAll('.row'),function(r){
  r.addEventListener('click',function(){
    var m=+r.dataset.mode;
    if(m===3) NET.open(); else openGame(m);
  });
});
document.getElementById('restart').addEventListener('click',function(){ closeSheet(); deal(); });
document.getElementById('again').addEventListener('click',function(){
  if(mode===3){ NET.rematch(); return; }          /* по сети раздача начинается по согласию обоих */
  closeSheet(); deal();
});

/* ---------- игра по сети ---------- */
/* Вся механика — в общем net.js. Здесь только то, что знает игра:
   ход — это номер карточки, а очередь зависит от того, нашлась ли пара. */
NET.init({
  game:'memo-duel',
  title:'Мемо-дуэль',
  applied:function(){ return flips; },
  /* Пока две карточки открыты и мы ждём, совпали они или нет, принимать
     следующий ход нельзя: третья карточка легла бы поверх пары. */
  busy:function(){ return lock || open.length>=2; },
  begin:function(c){ net.seat=c.seat; net.round=c.round; openGame(3); },
  round:function(c){ net.round=c.round; closeSheet(); deal(); },
  move:function(v){
    v=v|0;
    if(open.indexOf(v)>-1 || (cells[v] && cells[v].classList.contains('won'))) return;
    flip(v);
  },
  ended:goMenu
});
document.getElementById('toMenuBtn').addEventListener('click',goMenu);
document.getElementById('toMenuTop').addEventListener('click',goMenu);
scrim.addEventListener('click',closeSheet);
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

playMini();
})();
</script>
</body>
