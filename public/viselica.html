<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<script>
/* Тема — до первой отрисовки, иначе при запуске мигнёт чужим фоном.
   Выбор игрока лежит в общей памяти приложения (ключ dvoeplay:v1);
   пусто — значит берём тему из настроек телефона, как раньше. */
(function(){try{
  var d=JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}'), t=d&&d.theme;
  if(t!=='light'&&t!=='dark') return;
  document.documentElement.setAttribute('data-theme',t);
  var c=t==='dark'?'#1C1C1E':'#F2F2F7', m=document.querySelectorAll('meta[name="theme-color"]'), i;
  for(i=0;i<m.length;i++) m[i].setAttribute('content',c);
}catch(e){}})();

/* Офлайн-режим: после первого открытия приложение работает и без сети
   (кроме игры по сети). Регистрируем после загрузки, чтобы не отнимать
   у страницы первые мгновения. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* Telegram. Его скрипт нужен только внутри мини-приложения: снаружи он
   лишь тормозил бы загрузку, а без сети вешал бы её. Первая страница
   внутри Telegram открывается с #tgWebAppData в адресе — это и признак;
   дальше помним его до конца сеанса, ведь при переходе в игру хвоста
   в адресе уже нет. */
(function(){
  var tg=false;
  try{
    tg=/tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy || sessionStorage.getItem('dp:tg')==='1';
    if(tg) sessionStorage.setItem('dp:tg','1');
  }catch(e){}
  if(!tg) return;
  var s=document.createElement('script');
  s.src='https://telegram.org/js/telegram-web-app.js';
  s.onload=function(){
    var W=window.Telegram&&window.Telegram.WebApp, root=document.documentElement;
    if(!W) return;
    function mine(){
      try{ var t=(JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}')||{}).theme;
           return t==='light'||t==='dark'?t:''; }catch(e){ return ''; }
    }
    function paint(){
      /* своей темы игрок не выбирал — идём за темой Telegram, а не телефона */
      if(!mine() && (W.colorScheme==='dark'||W.colorScheme==='light')) root.setAttribute('data-theme',W.colorScheme);
      var a=root.getAttribute('data-theme');
      var dark=a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var bg=dark?'#1C1C1E':'#F2F2F7';
      try{ W.setHeaderColor(bg); W.setBackgroundColor(bg); }catch(e){}
      try{ if(W.setBottomBarColor) W.setBottomBarColor(bg); }catch(e){}
    }
    try{ W.ready(); }catch(e){}
    try{ W.expand(); }catch(e){}
    /* свайп вниз не должен сворачивать приложение посреди партии:
       в «Матрёшке» и «Магнитном бое» фишки тянут пальцем */
    try{ if(W.disableVerticalSwipes) W.disableVerticalSwipes(); }catch(e){}
    paint();
    try{ W.onEvent('themeChanged',paint); }catch(e){}
    /* в играх кнопка «Назад» Telegram ведёт на главный экран */
    try{
      if(/(^|\/)(index\.html)?$/.test(location.pathname)) W.BackButton.hide();
      else { W.BackButton.show(); W.BackButton.onClick(function(){ location.href='index.html'; }); }
    }catch(e){}
    try{ document.dispatchEvent(new Event('dp:telegram')); }catch(e){}
  };
  document.head.appendChild(s);
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dvoeplay">

<title>Виселица — dvoeplay</title>
<meta name="description" content="Загадайте слово за 30 секунд — соперник отгадывает. Игра для двоих: на одном телефоне или по сети.">
<!-- превью ссылки в Telegram, WhatsApp и других мессенджерах: без этого приглашение
     в сетевую игру приходит голой ссылкой. Картинка — по полному адресу, иначе не покажут -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="dvoeplay">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Быстрая виселица — dvoeplay">
<meta property="og:description" content="Загадайте слово за 30 секунд — соперник отгадывает. Игра для двоих: на одном телефоне или по сети.">
<meta property="og:image" content="https://dvoeplay.netlify.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  color-scheme:light;      /* поля ввода и полосы прокрутки тоже светлые */
  --bg:#F2F2F7; --surface:#FFFFFF; --well:#E8E8ED;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16);
  --tint:#007AFF;
  --red-a:#FF5247; --red-b:#E7362B;
  --yel-a:#FFD426; --yel-b:#F5BE0A;
  --grn-a:#4CD671; --grn-b:#30B855;
  --abs:#8A8D93;
  --thumb-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --card-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.14);
  --pc-shadow:0 2px 6px rgba(0,0,0,.20);
  --spring:cubic-bezier(.34,1.48,.5,1);
  --ease:cubic-bezier(.32,.72,0,1);
}
/* Тёмная тема. По умолчанию берётся из настроек телефона, но выбор
   в приложении важнее: атрибут data-theme ставится ещё до отрисовки. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1C1E; --surface:#2C2C2E; --well:#3A3A3C;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --tint:#0A84FF;
    --abs:#4B4B4D;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.4);
    --pc-shadow:0 3px 9px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1C1E; --surface:#2C2C2E; --well:#3A3A3C;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --tint:#0A84FF;
    --abs:#4B4B4D;
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.4);
    --pc-shadow:0 3px 9px rgba(0,0,0,.45);
  }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--label);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- каркас из двух экранов ---------- */
.app{position:fixed;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 10px);
  transition:transform .46s var(--ease),opacity .46s var(--ease);
  background:var(--bg);
  will-change:transform;
}
/* Планшет и компьютер: колонка шириной с телефон по центру окна, как в
   «4 в ряд» и на главном экране, — а не список, табло и кнопки во всю ширину.
   Низкий альбомный телефон не трогаем: там ширина нужна раскладке «руки по бокам». */
@media (min-width:600px) and (min-height:561px){
  .screen{padding-left:max(calc(env(safe-area-inset-left) + 16px),calc((100% - 520px)/2));
          padding-right:max(calc(env(safe-area-inset-right) + 16px),calc((100% - 520px)/2))}
}
#game{transform:translateX(100%)}
.app.playing #menu{transform:translateX(-28%);opacity:.35}
.app.playing #game{transform:translateX(0)}

/* ---------- навигация ---------- */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-bottom:10px}
.navtitle{font-size:17px;font-weight:600;letter-spacing:-.35px;text-align:center}
.back{
  justify-self:start;display:flex;align-items:center;gap:3px;
  border:0;background:none;color:var(--tint);cursor:pointer;
  font:400 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.3px;
  padding:6px 8px 6px 0;transition:opacity .15s ease;
}
.back:active{opacity:.4}
.back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon{
  justify-self:end;width:34px;height:34px;border:0;border-radius:50%;
  background:var(--fill);color:var(--tint);display:grid;place-items:center;cursor:pointer;
  transition:transform .18s var(--spring),opacity .18s ease;
}
.icon:active{transform:scale(.9);opacity:.6}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- меню ---------- */
#menu{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#menu>*{flex-shrink:0}
/* Ничто в меню не сжимается меньше своего содержимого: на низком экране
   (iPhone SE в Safari — 375×548) меню прокручивается, а не сплющивает
   заставку в полоску и не наезжает подписью на заголовок списка. */
.brand{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}

.mini{
  position:relative;width:min(62%,216px);aspect-ratio:5/2;
  background:var(--surface);border-radius:18px;overflow:hidden;
  box-shadow:var(--card-shadow);margin-bottom:30px;
  flex:none;
}
.mgrid{position:absolute;inset:14px;display:flex;gap:7px}
.mtile{
  flex:1;border-radius:8px;background:var(--well);
  display:flex;align-items:center;justify-content:center;
  font:700 20px/1 -apple-system,system-ui,sans-serif;color:var(--label);
  transition:background .25s ease,color .25s ease,transform .3s var(--spring);
}
.mtile::after{content:"";width:42%;height:2px;border-radius:1px;background:var(--label3);transition:opacity .2s ease}
.mtile.on{background:linear-gradient(180deg,var(--grn-a),var(--grn-b));color:#fff}
.mtile.on::after{opacity:0;width:0}
.mtile.pop{animation:tilepop .28s var(--spring)}

.wordmark{margin:0;width:min(240px,76%);line-height:0;color:var(--label)}
.wordmark svg{display:block;width:100%;height:auto;fill:currentColor}
.tagline{margin:9px 0 0;font-size:15px;color:var(--label2);letter-spacing:-.1px}

.section{font-size:17px;font-weight:600;letter-spacing:-.35px;margin:0 0 9px 4px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  border:0;background:none;color:inherit;font:inherit;text-align:left;
  padding:13px 16px;cursor:pointer;transition:background .12s ease;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.row:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.row i{font-style:normal;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.row .chev{width:9px;height:14px;flex:none;fill:none;stroke:var(--label3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.footnote{margin:14px 4px 0;font-size:12px;color:var(--label3);text-align:center;letter-spacing:-.02px}
.tohub{
  align-self:flex-start;flex:none;display:inline-flex;align-items:center;gap:5px;
  margin:0 0 4px;padding:10px 15px 10px 11px;border-radius:999px;
  background:var(--fill);color:var(--tint);text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:-.2px;
  transition:transform .16s var(--spring),opacity .16s ease;
}
.tohub svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tohub:active{transform:scale(.95);opacity:.7}
@media (max-height:660px){.tohub{padding:8px 13px 8px 10px;font-size:13px}}
.legal{margin:12px 0 2px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--label3)}
.legal sup{font-size:.7em;vertical-align:.5em;font-weight:500;letter-spacing:0;margin-left:.05em}

/* ---------- счёт (только режим «Вдвоём») ---------- */
.scoreboard{position:relative;display:none;background:var(--fill);border-radius:16px;padding:4px;margin-bottom:10px}
#game.duo .scoreboard{display:flex}
.slider{
  position:absolute;top:4px;left:4px;bottom:4px;width:calc(50% - 4px);
  background:var(--surface);border-radius:12px;box-shadow:var(--thumb-shadow);
  transition:transform .42s var(--spring),opacity .3s ease;
}
.side{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px}
.side .name{font-size:13px;font-weight:500;color:var(--label2);letter-spacing:-.05px;display:flex;align-items:center;gap:5px}
.side .name::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(180deg,var(--red-a),var(--red-b))}
.side[data-p="2"] .name::before{background:linear-gradient(180deg,var(--yel-a),var(--yel-b))}
.side .score{font-size:24px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.12;transition:transform .3s var(--spring)}
.side.bump .score{transform:scale(1.22)}
.side .cap{font-size:11px;color:var(--label3);letter-spacing:0}

/* ---------- игровая зона ---------- */
/* justify-content:center нельзя: на низком экране центрирование срезает
   содержимое сверху и доскроллить до него невозможно. Свободное место
   забирает картинка (.pic растягивается), поэтому переполнения обычно нет. */
.arena{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;overflow-x:hidden}
#stage,.setup{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#game.setting #stage{display:none}
#game:not(.setting) .setup{display:none}

/* ---------- виселица ---------- */
.pic{flex:1;min-height:66px;width:100%;display:flex;align-items:center;justify-content:center}
.pic svg{width:auto;height:100%;max-height:250px;max-width:100%;overflow:visible}
.frame path{fill:none;stroke:var(--label3);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
/* Фигура — плоский цвет, без SVG-градиента. Градиент по умолчанию
   считается от рамки элемента, а у вертикального туловища её ширина
   равна нулю: такую линию SVG не рисует вовсе. */
.man .part{
  fill:none;stroke:var(--red-b);
  stroke-width:6;stroke-linecap:round;stroke-linejoin:round;
}
.part{opacity:0;transition:opacity .3s ease}
.part.on{opacity:1}
.pic.quake{animation:quake .3s ease both}
@keyframes quake{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  20%{transform:translate(-3px,1px) rotate(-.7deg)}
  40%{transform:translate(3px,-1px) rotate(.7deg)}
  60%{transform:translate(-2px,2px) rotate(-.5deg)}
  80%{transform:translate(2px,0) rotate(.4deg)}
}

/* ---------- слово ---------- */
.wrow{display:flex;gap:8px;justify-content:center;flex:none;flex-wrap:wrap}
.wrow.shake{animation:rowshake .4s ease}
@keyframes rowshake{
  10%,90%{transform:translateX(-6px)} 20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-8px)} 40%,60%{transform:translateX(8px)}
}
.tile{
  width:var(--tile,52px);height:var(--tile,52px);
  border:2px solid var(--sep);border-radius:8px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font:700 calc(var(--tile,52px) * .42)/1 -apple-system,system-ui,sans-serif;
  color:var(--label);text-transform:uppercase;
  transition:border-color .15s ease,width .2s ease,height .2s ease;
}
.tile.e{width:var(--etile,52px);height:var(--etile,52px);font-size:calc(var(--etile,52px) * .42)}
.tile.opt{border-style:dashed}
.tile.filled{border-color:var(--label3);border-style:solid}
.tile.turn1{border-color:var(--red-b)}
.tile.turn2{border-color:var(--yel-b)}
.tile.pop{animation:tilepop .18s var(--spring)}
@keyframes tilepop{0%{transform:scale(.85)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
.tile.correct{border-color:transparent;background:linear-gradient(180deg,var(--grn-a),var(--grn-b));color:#fff}
.tile.absent{border-color:transparent;background:var(--abs);color:#fff}
.tile.bounce{animation:tilebounce .5s var(--spring)}
@keyframes tilebounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}

/* ---------- панель загадывания ---------- */
.who{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.who::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(180deg,var(--red-a),var(--red-b))}
.setup.p2 .who::before{background:linear-gradient(180deg,var(--yel-a),var(--yel-b))}
.timer{position:relative;width:104px;height:104px;flex:none;margin:auto 0}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--fill);stroke-width:7}
.prg{
  fill:none;stroke:var(--tint);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:226.2;stroke-dashoffset:0;transition:stroke .25s ease;
}
.timer.warn .prg{stroke:var(--red-b)}
.num{
  position:absolute;inset:0;display:grid;place-items:center;
  font:700 36px/1 -apple-system,system-ui,sans-serif;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;transition:color .25s ease,transform .2s var(--spring);
}
.timer.warn .num{color:var(--red-b)}
.timer.tick .num{transform:scale(1.14)}
.note{margin:0 0 2px;font-size:13px;color:var(--label2);letter-spacing:-.05px;text-align:center}

.hint{
  flex:none;text-align:center;font-size:13px;color:var(--label2);letter-spacing:-.05px;
  min-height:18px;margin:8px 0 2px;transition:color .18s ease;
}

/* ---------- подсказка-пузырь ---------- */
/* Висит абсолютно внутри .arena, координаты и хвостик считает JS: пузырь
   целится в конкретный элемент (слово, картинку, строку ввода) и не даёт
   себе вылезти за края. У целей в нижней половине разворачивается (flip). */
.tip{
  position:absolute;left:0;top:0;z-index:3;
  max-width:min(268px,94%);
  background:var(--surface);color:var(--label);
  border:1px solid var(--sep);border-radius:14px;
  box-shadow:var(--card-shadow);
  padding:10px 14px;
  font:500 14px/1.35 -apple-system,system-ui,sans-serif;letter-spacing:-.15px;
  text-align:center;
  opacity:0;pointer-events:none;
  transform:translateY(-5px);
  transition:opacity .2s ease,transform .3s var(--spring);
}
.tip.on{opacity:1;transform:translateY(0)}
.tip.flip{transform:translateY(5px)}
.tip.flip.on{transform:translateY(0)}
.tip::after{
  content:"";position:absolute;left:var(--tip-arrow,50%);margin-left:-7px;top:-8px;
  width:14px;height:14px;background:var(--surface);
  border:1px solid var(--sep);border-right:0;border-bottom:0;
  border-radius:3px 0 0 0;transform:rotate(45deg);
}
.tip.flip::after{top:auto;bottom:-8px;transform:rotate(225deg)}

/* ---------- экранная клавиатура ---------- */
.kbd{--kgap:4px;flex:none;display:flex;flex-direction:column;gap:8px;max-width:480px;width:100%;margin:0 auto;padding:2px 0 calc(env(safe-area-inset-bottom) + 4px)}
.krow{display:flex;gap:var(--kgap);justify-content:center}
/* В среднем ряду на клавишу меньше — сдвигаем его ровно на полклавиши
   с каждой стороны, тогда ширина клавиш совпадает во всех трёх рядах. */
.krow.mid{padding:0 calc((100% + var(--kgap)) / 24)}
/* padding:0 обязателен: свой отступ кнопки работает нижней границей для
   flex-basis, и ряд перестаёт делиться по заданным пропорциям. */
.key{
  flex:1;min-width:0;height:48px;padding:0;
  border:1.5px solid var(--sep);border-radius:8px;
  background:var(--bg);color:var(--label);
  font:600 18px/1 -apple-system,system-ui,sans-serif;letter-spacing:0;
  text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:transform .1s var(--spring),background .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease;
}
.key:active{transform:scale(.88);background:var(--fill2)}
.key.wide{flex:1.6}
.key svg{width:21px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.key.enter{background:var(--tint);border-color:var(--tint);color:#fff}
.key.enter svg{width:24px;height:20px;stroke-width:2.9}
.key.correct{border-color:transparent;background:linear-gradient(180deg,var(--grn-a),var(--grn-b));color:#fff}
.key.absent{border-color:transparent;background:var(--abs);color:#fff}
/* Во время отгадывания ✓ и стирание не нужны — прячем их, но место
   оставляем, иначе буквы поедут и клавиатура прыгнет при смене фазы. */
.kbd.guessing .util{visibility:hidden;pointer-events:none}

/* ---------- итоговая шторка ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .38s var(--ease);z-index:5}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(102%);transition:transform .5s var(--ease);
  max-width:520px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 14px}
.medal{
  position:relative;width:56px;height:56px;border-radius:50%;margin:2px auto 14px;
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.62),rgba(255,255,255,0) 48%),
             linear-gradient(180deg,var(--a),var(--b));
  box-shadow:var(--pc-shadow),inset 0 -3px 6px rgba(0,0,0,.2);
}
.medal::after{
  content:"";position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.62),rgba(255,255,255,0) 48%),
             linear-gradient(180deg,var(--a2),var(--b2));
  box-shadow:0 0 0 2px var(--surface);
}
.medal.tie{--a:var(--fill);--b:var(--fill);--a2:var(--label3);--b2:var(--label3);box-shadow:none}
.sheet.on .medal{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.sheet h2{margin:0;text-align:center;font-size:24px;font-weight:700;letter-spacing:-.45px}
.sheet p{margin:5px 0 22px;text-align:center;font-size:15px;color:var(--label2);letter-spacing:-.1px}
.forfeit{
  display:none;width:100%;align-items:center;gap:12px;text-align:left;
  background:var(--fill);border:0;border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:12px;
  color:inherit;font:inherit;cursor:pointer;transition:transform .18s var(--spring);
}
.forfeit.on{display:flex}
.forfeit:active{transform:scale(.98)}
.ftext{flex:1;font-size:16px;font-weight:600;letter-spacing:-.25px;transition:opacity .16s ease}
.forfeit.roll .ftext{opacity:0}
.forfeit .die{width:20px;height:20px;flex:none;fill:none;stroke:var(--label3);stroke-width:1.9;transition:transform .45s var(--spring)}
.forfeit:active .die{transform:rotate(90deg)}
.primary{
  width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;
  font:600 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.4px;
  padding:16px;cursor:pointer;transition:transform .18s var(--spring),opacity .15s ease;
}
.primary:active{transform:scale(.98);opacity:.85}
.ghost-btn{
  width:100%;border:0;background:none;color:var(--tint);
  font:400 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.4px;
  padding:15px;margin-top:2px;cursor:pointer;transition:opacity .15s ease;
}
.ghost-btn:active{opacity:.45}
.pill{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,20px);
  z-index:4;border:0;border-radius:22px;background:var(--tint);color:#fff;
  font:600 15px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.3px;
  padding:13px 20px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.pill.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  /* число повторов обязательно: бесконечная анимация (точки ожидания, пульс
     победной фишки), сжатая до миллисекунды, не замирает, а мерцает */
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.06s!important}
}

}

  .row{padding:11px 16px}
  .key{height:42px;font-size:16px}
  .timer{width:88px;height:88px}
  .num{font-size:30px}
}
</style>

/* Порядок деталей — свой на каждый режим, и он же задаёт число ошибок:

var SEQ=[
  [['rope'],['head'],['body'],['armL'],['armR'],['legL'],['legR']],
  [['head'],['armL','armR'],['body'],['legL'],['legR']],
  [['head'],['body'],['armL'],['armR'],['legL'],['legR']],
  [['head'],['body'],['armL'],['armR'],['legL'],['legR']]   /* по сети — как вдвоём */
];
var SET_TIME=30;
/* Последние секунды таймер краснеет и подтикивает вибрацией. */
var WARN_AT=5;
var MIN_LEN=4, MAX_LEN=6;
var ALPHABET="абвгдежзийклмнопрстуфхцчшщъыьэюя";

var app=document.getElementById('app');
var gameEl=document.getElementById('game');
var arenaEl=document.getElementById('arena');
var picEl=document.getElementById('pic');
var manEl=document.getElementById('man');
var galEl=document.getElementById('gal');
var wrowEl=document.getElementById('wrow');
var erowEl=document.getElementById('erow');
var setupEl=document.getElementById('setup');
var whoEl=document.getElementById('who');
var timerEl=document.getElementById('timer');
var prgEl=document.getElementById('prg');
var numEl=document.getElementById('num');
var kbdEl=document.getElementById('kbd');
var hintEl=document.getElementById('hint');
var tipEl=document.getElementById('tip');
var liveEl=document.getElementById('live');
var sliderEl=document.getElementById('slider');
var sheetEl=document.getElementById('sheet');
var backdrop=document.getElementById('backdrop');
var pillEl=document.getElementById('pill');
var mgridEl=document.getElementById('mgrid');

var mode=0, phase='guess';
var word='', lastWord='';
var tiles=[], eTiles=[], entry=[];
var shown=[], used={}, keyState={};
var mistakes=0, maxMist=6;
var over=false, locked=false, session=0;
var setter=2, guesser=1, active=1;
var net={seat:1,round:0};
var plies=0;          /* сетевых ходов за раунд: слово плюс буквы */
/* вдвоём — это и «на одном телефоне», и «по сети»: роли и счёт одинаковые */
/* ---------- имена игроков ---------- */
/* Своё имя и имя друга лежат в общей памяти приложения, имя сетевого
   соперника приходит из комнаты. Пусто — показываем как раньше. */
function who(){
  var p=DP.names();
  if(mode===3){
    var me=p.me||'Вы', them=NET.oppName||'Соперник';
    return net.seat===2?[them,me]:[me,them];
  }
  if(mode===2) return [p.me||'Красные', p.friend||'Жёлтые'];
  return [p.me||'Вы','Соперник'];
}
/* настоящее ли имя у стороны — от этого зависит, как назвать победителя */
function named(i){
  var p=DP.names();
  if(mode===3) return i===net.seat ? !!p.me : !!NET.oppName;
  if(mode===2) return i===1 ? !!p.me : !!p.friend;
  return false;
}
function duo(){ return mode>=2; }
function iSet(){ return mode!==3 || setter===net.seat; }      /* я загадываю */
function iGuess(){ return mode!==3 || guesser===net.seat; }   /* я отгадываю */
var wins=[0,0,0], solved=0, played=0;
var timerId=null, timeLeft=SET_TIME, lastTick=99;
var RING=2*Math.PI*36;

/* ===================== ВСПОМОГАТЕЛЬНОЕ ===================== */
function reduceMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function haptic(v,kind){ FX.fire(v,kind); }
function pickWord(){
  var pool=POOL[mode], w;
  do{ w=pool[(Math.random()*pool.length)|0]; }while(w===lastWord && pool.length>1);
  lastWord=w;
  return w;
}
function sideName(p,cap){ var s=(p===1?'красные':'жёлтые'); return cap? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function errForm(n){ return n===1?'ошибка':(n>=2&&n<=4?'ошибки':'ошибок'); }
function letterForm(n){ return n===1?'буква':(n>=2&&n<=4?'буквы':'букв'); }

/* ===================== РАЗМЕРЫ ===================== */
/* Плитки считаем сами: длина слова меняется от раунда к раунду, так что
   фиксированной сетки нет. Строку ввода считаем по шести местам, чтобы
   она не прыгала, пока игрок набирает слово. */
function fit(){
  var r=arenaEl.getBoundingClientRect();
  if(!r.width||!r.height) return;
  var gap=8;
  function sizeFor(n){
    var maxW=Math.min(r.width,380);
    return Math.max(26,Math.min(56,(maxW-(n-1)*gap-4)/n, r.height*0.26));
  }
  arenaEl.style.setProperty('--tile', sizeFor(word.length||MAX_LEN)+'px');
  arenaEl.style.setProperty('--etile', sizeFor(MAX_LEN)+'px');
}

/* ===================== ФИГУРА ===================== */
function partEl(name){ return galEl.querySelector('[data-p="'+name+'"]'); }
function figurePieces(){ return galEl.querySelectorAll('.frame path,.man .part'); }
function resetFigure(){
  var all=figurePieces(), i, el;
  for(i=0;i<all.length;i++){
    el=all[i];
    el.classList.remove('on');
    el.style.strokeDasharray='';
    el.style.strokeDashoffset='';
    el.style.transition='';
    el.style.transform='';
    el.style.transformOrigin='';
    el.style.opacity='';
  }
  picEl.classList.remove('quake');
  /* Верёвка попадает в очередь ошибок только на лёгком уровне. В остальных
     режимах она просто часть виселицы и стоит на месте с самого начала. */
  var inSeq={}, steps=SEQ[mode], j,k;
  for(j=0;j<steps.length;j++) for(k=0;k<steps[j].length;k++) inSeq[steps[j][k]]=1;
  for(i=0;i<all.length;i++){
    var n=all[i].getAttribute('data-p');
    if(n&&!inSeq[n]&&all[i].classList.contains('part')) all[i].classList.add('on');
  }
}
/* Куда валится каждая деталь. cx/cy — её центр в исходном виде, ang — наклон
   к горизонтали (по нему считаем, на сколько довернуть, чтобы легла плашмя),
   x — куда примерно ложится, lay — слой в куче, delay — очерёдность падения:
   первым срывается человек, последним заваливается столб. Пола (base) в
   таблице нет: он и есть земля, на которую всё падает. */
var FLOOR=134;
var HEAP={
  head :{cx:80,cy:44 ,len:24 ,ang:  0,x:72,lay:2,delay:  0,round:1},
  body :{cx:80,cy:73 ,len:34 ,ang: 90,x:62,lay:1,delay: 20},
  armL :{cx:72,cy:71 ,len:21 ,ang:-41,x:40,lay:2,delay: 30},
  armR :{cx:88,cy:71 ,len:21 ,ang: 41,x:80,lay:0,delay: 30},
  legL :{cx:73,cy:101,len:26 ,ang:-58,x:52,lay:3,delay: 10},
  legR :{cx:87,cy:101,len:26 ,ang: 58,x:68,lay:3,delay: 10},
  rope :{cx:80,cy:24 ,len:16 ,ang: 90,x:86,lay:1,delay: 90},
  beam :{cx:53,cy:16 ,len:54 ,ang:  0,x:42,lay:1,delay:130},
  brace:{cx:35,cy:25 ,len:25 ,ang:-45,x:24,lay:2,delay:170},
  post :{cx:26,cy:77 ,len:122,ang: 90,x:56,lay:0,delay:200}
};
/* Виселица собрана — значит, слово не отгадано. Она вздрагивает и обрушивается
   на землю, обломки остаются лежать. Шторка приходит уже поверх кучи. */
function collapseFigure(){
  var s=session, pieces=[].slice.call(figurePieces());
  picEl.classList.add('quake');
  setTimeout(function(){
    if(s!==session) return;
    picEl.classList.remove('quake');
    for(var i=0;i<pieces.length;i++){
      (function(el){
        var g=HEAP[el.getAttribute('data-p')];
        if(!g) return;
        var a=Math.random()*24-12;                     /* легла почти плашмя */
        var half=g.round? g.len/2+3
                        : Math.abs(Math.sin(a*Math.PI/180))*g.len/2+3;
        var dx=g.x+(Math.random()*6-3)-g.cx;
        var dy=(FLOOR-g.lay*4-half)-g.cy;              /* низ детали ложится на землю */
        /* Точку вращения задаём явно, в координатах картинки: у вертикальных
           линий рамка нулевой ширины, и полагаться на «центр самой детали»
           тут не стоит. */
        el.style.transformOrigin=g.cx+'px '+g.cy+'px';
        el.style.transition='transform .6s cubic-bezier(.42,0,.5,1.12) '+g.delay+'ms';
        el.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) rotate('+(a-g.ang).toFixed(1)+'deg)';
      })(pieces[i]);
    }
  },300);
}
/* Штрих «прорисовывается»: длину линии знает сам SVG (getTotalLength),
   поэтому анимация одинаково работает и для линий, и для круга-головы.
   У лица длины нет — оно просто проявляется. */
function drawPart(el){
  el.classList.add('on');
  if(!el.getTotalLength) return;
  var L;
  try{ L=el.getTotalLength(); }catch(e){ return; }
  if(!L) return;
  /* Промежуток в пунктире делаем длиннее самой линии, а стартовое смещение —
     чуть больше её длины. Иначе граница между штрихом и промежутком попадает
     на конец линии, а такую границу нулевой длины браузер с круглыми торцами
     рисует точкой — и перед ногой в воздухе повисает красная капля. */
  el.style.transition='none';
  el.style.strokeDasharray=L+' '+(L+2);
  el.style.strokeDashoffset=L+1;
  el.getBoundingClientRect();
  el.style.transition='stroke-dashoffset .38s ease,opacity .3s ease';
  el.style.strokeDashoffset=0;
  /* Пунктир — только для проявления штриха. Снимаем его, чтобы деталь
     не осталась недорисованной, если анимация где-то не сработает. */
  setTimeout(function(){
    el.style.strokeDasharray='';
    el.style.strokeDashoffset='';
  },420);
}
function addPart(){
  var step=SEQ[mode][mistakes-1];
  if(!step) return;
  for(var i=0;i<step.length;i++){
    var el=partEl(step[i]);
    if(el) drawPart(el);
  }
}

/* Чей сейчас ход — контуром плиток, как в «5 буквах»: заливка и рамка
   строки заняты состоянием буквы, цвет игрока живёт только в бордюре. */

/* ===================== ПОДСКАЗКИ ИГРОКУ =====================
   Пузырь целится в конкретный элемент внутри .arena и разворачивается,
   если цель в нижней половине. Текст дублируем в aria-live: сам пузырь
   от скринридера скрыт, иначе прочитается дважды. */
var tipTimer=null;
function showTip(msg,target,ms,keep){
  if(!target) return;
  tipEl.textContent=msg;
  liveEl.textContent=msg;
  var flip=(target.offsetTop+target.offsetHeight/2)>arenaEl.clientHeight/2;
  tipEl.classList.toggle('flip',flip);
  var w=tipEl.offsetWidth, h=tipEl.offsetHeight, edge=8;
  /* keep — то, что пузырь закрывать не должен: цифры таймера над строкой
     ввода (край кольца закрыть можно). На низком экране места над целью нет —
     встаём под неё, а если и там не помещаемся, пузырь не показываем: та же
     подсказка есть строкой под полем и в aria-live. */
  if(flip && keep && target.offsetTop-h-10 < textBottom(keep)-arenaEl.getBoundingClientRect().top+arenaEl.scrollTop){
    if(target.offsetTop+target.offsetHeight+10+h > arenaEl.clientHeight){ hideTip(); return; }
    flip=false; tipEl.classList.remove('flip');
  }
  var cx=target.offsetLeft+target.offsetWidth/2;
  var maxLeft=Math.max(edge,arenaEl.clientWidth-w-edge);
  var left=Math.max(edge,Math.min(cx-w/2,maxLeft));
  tipEl.style.left=left+'px';
  tipEl.style.setProperty('--tip-arrow',Math.max(14,Math.min(cx-left,w-14))+'px');
  tipEl.style.top=(flip? target.offsetTop-h-10 : target.offsetTop+target.offsetHeight+10)+'px';
  tipEl.classList.add('on');
  clearTimeout(tipTimer);
  tipTimer=setTimeout(hideTip,ms||3000);
}
function hideTip(){ clearTimeout(tipTimer); tipEl.classList.remove('on'); }
/* низ самого текста, а не его блока: цифры таймера — блок во всё кольцо */
function textBottom(el){
  var r=document.createRange(); r.selectNodeContents(el);
  var b=r.getBoundingClientRect();
  return b.height ? b.bottom : el.getBoundingClientRect().bottom;
}

/* Что игрок уже видел. Флаги переживают перезапуск, если хранилище
   доступно; если нет — подсказки просто покажутся раз за сеанс. */
var TIPS_KEY='dvoeplay.viselica.tips';
var tipsSeen={set:0,start:0,miss:0};
try{
  var savedTips=JSON.parse(localStorage.getItem(TIPS_KEY)||'{}');
  for(var tk in tipsSeen) if(savedTips[tk]) tipsSeen[tk]=1;
}catch(e){}

}

/* ===================== ТАЙМЕР ЗАГАДЫВАНИЯ ===================== */
function paintTimer(){
  var n=Math.max(0,Math.ceil(timeLeft-0.001));
  numEl.textContent=n;
  prgEl.style.strokeDashoffset=RING*(1-Math.max(0,timeLeft)/SET_TIME);
  timerEl.classList.toggle('warn',timeLeft<=WARN_AT+0.001);
  if(n!==lastTick){
    lastTick=n;
    if(n<=WARN_AT&&n>0){
      haptic(12,'tick');
      timerEl.classList.add('tick');
      setTimeout(function(){ timerEl.classList.remove('tick'); },160);
    }
  }
}
function startTimer(){
  clearTimer();
  var s=session, t0=Date.now();
  timeLeft=SET_TIME; lastTick=99; paintTimer();
  timerId=setInterval(function(){
    if(s!==session||phase!=='set'){ clearTimer(); return; }
    timeLeft=Math.max(0,SET_TIME-(Date.now()-t0)/1000);
    paintTimer();
    if(timeLeft<=0){
      clearTimer();
      /* по сети слово выбирает только тот, кто загадывает: второй ждёт его по сети */
      if(mode===3 && !iSet()) return;
      if(entry.length>=MIN_LEN) commitWord(entry.join(''),false);
      else commitWord(pickWord(),true);
    }
  },70);
}
function clearTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function startSetup(){

  document.getElementById('note').textContent = mode!==3 ? 'Соперник, отвернись!'
    : (iSet() ? 'Соперника рядом нет — слово он не увидит' : 'Слово появится, когда соперник его загадает');
  active=setter;

  setTimeout(function(){

function onLetter(ch){

function onEnter(){

function commitWord(w,auto){
  word=w; lastWord=w;

function takeWord(w){

/* ===================== ФАЗА ОТГАДЫВАНИЯ ===================== */
function startGuess(auto){
  phase='guess';
  gameEl.classList.remove('setting');
  kbdEl.classList.add('guessing');
  maxMist=SEQ[mode].length;
  mistakes=0;
  active=(duo()?guesser:1);
  resetFigure();
  resetKeyboard();
  buildWord();
  fit();
  paintTurnTiles(); paintScore(); paintHint();
  liveEl.textContent=(mode===3 ? (iGuess()?'Отгадывайте слово из ':'Соперник отгадывает слово из ')
    : mode===2 ? sideName(guesser,true)+' отгадывают слово из ' : 'Загадано слово из ')
    +word.length+' '+letterForm(word.length)+'. Ошибок можно сделать '+maxMist+'.';
  var s=session;
  if(auto){
    setTimeout(function(){
      if(s===session&&!over) showTip('Не успели — слово выбрала игра',wrowEl,3000);
    },420);
    return;
  }
  if(!tipsSeen.start){
    setTimeout(function(){
      if(s!==session||over) return;
      markTip('start');
      showTip('Нажимайте буквы — верные встанут в слово',wrowEl,4200);
    },620);
  }
}
function guessLetter(ch){
  if(phase!=='guess'||over||locked) return;
  if(mode===3 && !iGuess()) return;      /* загадавший не подсказывает себе сам */
  if(used[ch]) return;
  takeLetter(ch);                        /* сначала считаем ход у себя … */
  if(mode===3) NET.send(ch,guesser);     /* … потом шлём: отгадывающий ходит дальше сам */
}
/* буква — своя или пришедшая по сети */
function takeLetter(ch){
  if(phase!=='guess'||over) return;
  if(used[ch]) return;
  plies++;
  used[ch]=1;
  hideTip();
  var hit=false, i, n=0;
  for(i=0;i<word.length;i++) if(word[i]===ch){ hit=true; n++; }
  keyState[ch]=hit?'correct':'absent';
  renderKeyboard();
  if(hit){
    var k=0;
    for(i=0;i<word.length;i++){
      if(word[i]!==ch) continue;
      shown[i]=true;
      (function(t,d){
        setTimeout(function(){
          t.textContent=ch;
          t.classList.remove('turn1','turn2');
          t.classList.add('correct','pop');
          setTimeout(function(){ t.classList.remove('pop'); },200);
        },d);
      })(tiles[i],k*90);
      k++;
    }
    haptic(8,'good');
    liveEl.textContent='Буква '+ch.toUpperCase()+' есть в слове'+(n>1?', '+n+' раза':'')+'.';
    if(shown.indexOf(false)<0){ finish(true); return; }
  }else{
    mistakes++;
    addPart();
    shakeRow(wrowEl);
    haptic(14,'error');
    liveEl.textContent='Буквы '+ch.toUpperCase()+' нет. Осталось ошибок: '+(maxMist-mistakes)+'.';
    if(mistakes>=maxMist){ finish(false); return; }
    if(!tipsSeen.miss){
      markTip('miss');
      showTip('Мимо. Каждая ошибка дорисовывает часть фигуры',picEl,3400);
    }
  }
  paintHint();
}
function revealRest(){
  for(var i=0;i<word.length;i++){
    if(shown[i]) continue;
    (function(t,d,ch){
      setTimeout(function(){
        t.textContent=ch;
        t.classList.remove('turn1','turn2');
        t.classList.add('absent','pop');
        setTimeout(function(){ t.classList.remove('pop'); },200);
      },d);
    })(tiles[i],i*70,word[i]);
  }
}

var lastForfeit=-1, loserSide=0;
var forfeitEl=document.getElementById('forfeit');
var ftextEl=document.getElementById('ftext');
function rollForfeit(){
  var i;
  do{ i=(Math.random()*FORFEIT.length)|0; } while(i===lastForfeit&&FORFEIT.length>1);
  lastForfeit=i;
  /* по сети фант видит только проигравший — значит и говорить надо ему */
  if(mode===3) return 'Вы '+FORFEIT[i][1];
  if(named(loserSide)) return who()[loserSide-1]+' '+FORFEIT[i][2];
  return sideName(loserSide,true)+' '+FORFEIT[i][0];
}
forfeitEl.addEventListener('click',function(){
  forfeitEl.classList.add('roll');
  setTimeout(function(){ ftextEl.textContent=rollForfeit(); forfeitEl.classList.remove('roll'); },170);
});

function finish(win){
  over=true; locked=true;
  clearTimer(); hideTip();
  var s=session, scorer=0;
  if(mode===3) NET.result(win?guesser:setter);
  if(duo()){
    scorer=win?guesser:setter;
    wins[scorer]++;
    loserSide=3-scorer;
    active=scorer;
    paintScore(); bump(scorer);
  }else{
    played++;
    if(win) solved++;
  }
  paintTurnTiles();
  if(win){
    for(var i=0;i<tiles.length;i++){
      (function(t,d){ setTimeout(function(){ if(s===session) t.classList.add('bounce'); },d); })(tiles[i],i*80);
    }
    haptic([14,60,26]);
  }else{
    revealRest();
    collapseFigure();
    haptic([12,50,10,40,18]);
  }
  hintEl.textContent = win? 'Слово открыто' : 'Слово: '+word.toUpperCase();
  /* При выключенных анимациях обвал занимает мгновение — незачем держать
     паузу перед шторкой. */
  var wait = win? 900 : (reduceMotion()? 700 : 1800);
  setTimeout(function(){ if(s===session) openSheet(win); }, wait);
}
/* ---------- общая память приложения dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии. Всё в try/catch:
   если хранилище недоступно, игра работает как раньше, просто без истории. */
var DP=(function(){
  var KEY='dvoeplay:v1';
  function read(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.games) return d; }catch(e){}
    return {v:1,games:{}};
  }
  function write(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function save(id,r){
    r=r||{};
    var d=read(), g=d.games[id]||{plays:0,w1:0,w2:0,draws:0,solved:0,solo:0};
    g.plays=(g.plays||0)+1;
    if(r.win===1) g.w1=(g.w1||0)+1;
    else if(r.win===2) g.w2=(g.w2||0)+1;
    else if(r.mode===2) g.draws=(g.draws||0)+1;   /* ничья бывает только вдвоём */
    if(r.mode!==2) g.solo=(g.solo||0)+1;
    if(r.solved) g.solved=(g.solved||0)+1;
    g.last=Date.now(); g.note=r.note||''; g.mode=r.mode;
    d.games[id]=g;
    try{ duel(d,id,r); }catch(e){}
    write(d);
    /* итог партии — тем, кто слушает: мини-турнир (tour.js) ведёт по нему счёт.
       Бросаем после записи, чтобы слушатель читал уже обновлённую память. */
    try{ document.dispatchEvent(new CustomEvent('dp:save',{detail:{id:id,win:r.win,mode:r.mode}})); }catch(e){}
  }
  /* Сброс статистики стирает только историю партий. Имена, тема и звук —
     настройки, а не статистика: раньше сброс стирал весь ключ, и вместе
     со счётом пропадали имена, выбранная тема и выключенный звук. */
  function clear(){ var d=read(); d.games={}; delete d.duel; write(d); }

  /* ---------- кто кого ----------
     Партия на двоих — на одном телефоне или по сети — пишется ещё и по
     людям: кто выиграл, я или соперник. Счёт по цветам для этого не
     годится: по сети моё место в каждой комнате своё.
     На одном телефоне я — всегда первая сторона (так устроены имена), по
     сети — своё место NET.seat. Соперник на одном телефоне — роль «друг»,
     а не имя: переименуют — счёт останется за ним. По сети соперника узнаём
     по имени, и если оно совпало с именем друга — это он и есть. */
  var PAIRS=12, LOG=40;
  /* день начинается в четыре утра: партия после полуночи — тот же вечер */
  function day(t){ var x=new Date(t-4*36e5); return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }
  function duel(d,id,r){
    if(r.mode!==2) return;                          /* против ИИ и в одиночку — не пара */
    var N=window.NET, net=!!(N&&N.on), mine=net?N.seat:1;
    if(mine!==1 && mine!==2) return;
    var opp=net?clip(N.oppName):'', key=net?'net:'+opp.toLowerCase():'duo';
    var res = r.win===mine ? 1 : (r.win===1||r.win===2) ? 2 : 0;   /* 1 — я, 2 — соперник, 0 — ничья */
    var now=Date.now(), P=d.duel||(d.duel={p:{}});
    var p=P.p[key]||(P.p[key]={me:0,them:0,draw:0,g:{},log:[],run:null,since:now});
    if(net) p.name=opp;
    if(res===1) p.me++; else if(res===2) p.them++; else p.draw++;
    var t=p.g[id]||(p.g[id]=[0,0,0]);
    t[res===1?0:res===2?1:2]++;
    p.log.push([now,res,id]);
    if(p.log.length>LOG) p.log.splice(0,p.log.length-LOG);
    var today=day(now);
    if(!p.run || p.run.d!==today)
      p.run={d:today, n:(p.run && p.run.d===day(now-864e5)) ? p.run.n+1 : 1};
    p.last=now;
    fold(d);
    /* соперников по сети может набраться много — держим дюжину последних */
    var keys=Object.keys(P.p);
    if(keys.length>PAIRS){
      keys.sort(function(a,b){ return (P.p[a].last||0)-(P.p[b].last||0); });
      delete P.p[keys[0]];
    }
  }
  /* Друг с одного телефона и тот же человек по сети — одна пара. Имя друга
     могли вписать и после сетевых партий, поэтому сводим при каждом чтении. */
  function fold(d){
    var P=d.duel, f=names().friend, k='net:'+f.toLowerCase();
    if(!P || !P.p || !f || !P.p[k]) return false;
    var a=P.p.duo, b=P.p[k], id, i;
    if(!a){ P.p.duo=b; delete b.name; delete P.p[k]; return true; }
    a.me+=b.me; a.them+=b.them; a.draw+=b.draw;
    for(id in b.g) if(Object.prototype.hasOwnProperty.call(b.g,id)){
      var x=a.g[id]||(a.g[id]=[0,0,0]);
      for(i=0;i<3;i++) x[i]+=b.g[id][i];
    }
    a.log=a.log.concat(b.log).sort(function(u,v){ return u[0]-v[0]; }).slice(-LOG);
    /* серия вечеров — та, что свежее; в один и тот же день — та, что длиннее */
    if(b.run && (!a.run || (b.run.d===a.run.d ? b.run.n>a.run.n : (b.last||0)>(a.last||0)))) a.run=b.run;
    a.since=Math.min(a.since||b.since, b.since||a.since);
    a.last=Math.max(a.last||0, b.last||0);
    delete P.p[k];
    return true;
  }
  function pair(){
    var d=read();
    if(fold(d)) write(d);
    return d.duel||null;
  }
  function pairReset(key){
    var d=read();
    if(d.duel && d.duel.p && d.duel.p[key]){ delete d.duel.p[key]; write(d); }
  }

  /* Имена игроков. «me» — тот, кто держит телефон, «friend» — с кем
     играют вдвоём на одном телефоне. По сети имя соперника приходит из
     комнаты, здесь оно не хранится. Пусто — значит показываем как раньше. */
  var nmCache=null, nmAt=0;
  function clip(s){ return String(s==null?'':s).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').slice(0,12); }
  function names(v){
    if(v!==undefined){
      var d=read();
      d.names={me:clip(v.me),friend:clip(v.friend)};
      write(d); nmCache=null;
    }
    var n=Date.now();
    if(nmCache===null || n-nmAt>800){
      var q=read().names||{};
      nmCache={me:clip(q.me),friend:clip(q.friend)};
      nmAt=n;
    }
    return nmCache;
  }
  function sound(v){
    if(v===undefined){ try{ return read().sound!==false; }catch(e){ return true; } }
    var d=read(); d.sound=!!v; write(d); return d.sound;
  }
  /* Тема приложения: '' — как в телефоне, 'light'/'dark' — выбор игрока.
     К первой отрисовке её уже применил коротенький скрипт в шапке страницы; здесь
     только хранение и переключение на лету. */
  var LIGHT_BG='#F2F2F7', DARK_BG='#1C1C1E';
  /* Какой повод для большой плашки показали в прошлый раз — чтобы при
     следующем открытии главного экрана показать следующий по кругу.
     Пользуется этим только главный экран, но блок памяти у всех общий. */
  function hero(v){
    if(v!==undefined){ var d=read(); d.hero=String(v||''); write(d); return d.hero; }
    try{ return read().hero||''; }catch(e){ return ''; }
  }
  function theme(v){
    if(v!==undefined){
      var d=read();
      d.theme=(v==='light'||v==='dark')?v:'';
      write(d); wear(d.theme);
      return d.theme;
    }
    try{ var t=read().theme; return (t==='light'||t==='dark')?t:''; }catch(e){ return ''; }
  }
  /* какая тема на экране прямо сейчас — с оглядкой на настройки телефона */
  function dark(){
    var t=theme();
    if(t) return t==='dark';
    /* своей темы нет, но её мог поставить Telegram — тогда главнее он */
    try{ var a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; }catch(e){}
    try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
  }
  function wear(t){
    try{
      var r=document.documentElement, m, i;
      if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
      m=document.querySelectorAll('meta[name="theme-color"]');
      for(i=0;i<m.length;i++) m[i].setAttribute('content', dark()?DARK_BG:LIGHT_BG);
      /* внутри Telegram его шапка тоже должна перекраситься */
      var W=window.Telegram&&window.Telegram.WebApp;
      if(W){ W.setHeaderColor(dark()?DARK_BG:LIGHT_BG); W.setBackgroundColor(dark()?DARK_BG:LIGHT_BG); }
    }catch(e){}
  }
  return {read:read,save:save,clear:clear,sound:sound,names:names,theme:theme,dark:dark,hero:hero,
          pair:pair,pairReset:pairReset,day:day};
})();
/* ---------- звук и тактильная отдача dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии.
   Синтез на лету, файлов нет.

   Главное про характер: это ПЕРКУССИЯ, а не ноты. Ориентир —
   щелчок клавиатуры айфона: очень короткий сухой удар без звона,
   без обертонов и без реверберации, вся энергия в нижней середине.
   Две предыдущие попытки звучали звонко именно потому, что были
   построены как ноты с высокими обертонами и хвостом — не повторять.

   Щелчок = короткий шум через ФНЧ + короткий низкий «толчок».
   Вся шина дополнительно режется фильтром на 2.6кГц, поэтому
   в звуке физически нет частот, которые режут слух. */
var FX=(function(){
  var ctx=null, bus=null, lpf=null, noise=null;
  var lastKind='', lastAt=0, sndCache=null, sndAt=0;
  var CUT=4500;     /* «мягкость» — срез общего ФНЧ, Гц; выбрано на прослушивании */
  var VOL=0.95;     /* общая громкость */

  function allowed(){
    var n=Date.now();
    if(sndCache===null || n-sndAt>800){
      try{ sndCache=DP.read().sound!==false; }catch(e){ sndCache=true; }
      sndAt=n;
    }
    return sndCache;
  }
  function forget(){ sndCache=null; }
  function tune(cut,vol){
    if(cut){ CUT=cut; if(lpf) lpf.frequency.value=cut; }
    if(vol!==undefined){ VOL=vol; if(bus) bus.gain.value=vol; }
    return {cut:CUT,vol:VOL};
  }

  function boot(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=VOL;
      var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
      lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=CUT; lpf.Q.value=.7;
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=2.2;
      comp.attack.value=.003; comp.release.value=.15;
      bus.connect(hp); hp.connect(lpf); lpf.connect(comp); comp.connect(ctx.destination);
      var n=Math.floor(ctx.sampleRate*.06), nb=ctx.createBuffer(1,n,ctx.sampleRate), d=nb.getChannelData(0), i;
      for(i=0;i<n;i++) d[i]=Math.random()*2-1;
      noise=nb;
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* сухой щелчок: шум через ФНЧ, затухание за единицы миллисекунд */
  function click(gain,cut,dur,at){
    if(!ctx||!noise) return;
    try{
      var t=ctx.currentTime+(at||0);
      var s=ctx.createBufferSource(); s.buffer=noise;
      s.playbackRate.value=.9+Math.random()*.2;          /* лёгкий разброс, чтобы не повторялось */
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.Q.value=.6;
      var g=ctx.createGain();
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(bus);
      s.start(t); s.stop(t+dur+.02);
    }catch(e){}
  }
  /* низкий толчок — тело щелчка, одна синусоида без обертонов */
  function thump(freq,dur,gain,at,bend){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*bend),t+dur);
      var g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.002);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  /* мягкая нота — только для итогов, с чуть более долгим затуханием */
  function note(freq,dur,gain,at){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain(), g2=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.010);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      g2.gain.setValueAtTime(.0001,t);
      g2.gain.linearRampToValueAtTime(gain*.07,t+.010);
      g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.5);
      o.connect(g); g.connect(bus);
      o2.connect(g2); g2.connect(bus);
      o.start(t); o.stop(t+dur+.02);
      o2.start(t); o2.stop(t+dur*.5+.02);
    }catch(e){}
  }

  function play(kind){
    if(!boot()) return;
    if(ctx.state==='suspended'){ try{ var pr=ctx.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    switch(kind){
      case 'tick':                                     /* таймер */
        click(1.54,1000,.008);
        break;
      case 'light':                                    /* нажатие — как клавиша */
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
        break;
      case 'medium':                                   /* ход */
        click(1.61,1250,.016);
        thump(330,.045,.98,0,.80);
        break;
      case 'good':                                     /* удачно */
        click(.51,1500,.008);
        note(466.16,.16,.64);
        break;
      case 'heavy':                                    /* тяжёлый ход */
        click(1.66,850,.022);
        thump(200,.090,1.22,0,.72);
        break;
      case 'success':                                  /* победа */
        click(.17,1400,.008);
        note(392.00,.20,.29,0);
        note(523.25,.30,.26,.105);
        break;
      case 'error':                                    /* ошибка */
        click(.21,800,.014);
        thump(220.00,.14,.31,0,.85);
        thump(174.61,.20,.27,.105,.85);
        break;
      default:
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
    }
  }
  function buzz(pattern,kind){
    var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
    if(tg){
      try{
        if(kind==='success'||kind==='error'||kind==='warning') tg.notificationOccurred(kind);
        else if(kind==='heavy') tg.impactOccurred('heavy');
        else if(kind==='medium'||kind==='good') tg.impactOccurred('medium');
        else tg.impactOccurred('light');
        return;
      }catch(e){}
    }
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }
  function kindOf(v,kind){
    if(kind) return kind;
    if(Object.prototype.toString.call(v)==='[object Array]') return v.length>=5?'error':'success';
    if(v<=6)  return 'light';
    if(v<=11) return 'medium';
    return 'heavy';
  }
  function fire(pattern,kind){
    var k=kindOf(pattern,kind), now=Date.now();
    if(k===lastKind && now-lastAt<35) return;     /* без дублей от одного нажатия */
    lastKind=k; lastAt=now;
    if(allowed()) play(k);
    buzz(pattern,k);
  }

  /* мягкий щелчок по элементам управления */
  var UI=['row','btn','primary','back','icon','iconbtn','pill','forfeit','tohub','chip','hero','t'];
  document.addEventListener('pointerdown',function(e){
    var el=e.target, i;
    while(el && el.nodeType===1){
      if(el.classList) for(i=0;i<UI.length;i++) if(el.classList.contains(UI[i])){ fire(5,'light'); return; }
      el=el.parentNode;
    }
  },true);

  return {fire:fire,play:play,boot:boot,forget:forget,tune:tune};
})();


function openSheet(win){
  /* для истории сетевая партия — это игра вдвоём: есть ничьи, не соло */
  DP.save('viselica',{win:duo()?(win?guesser:setter):0, solved:(!duo()&&win)?1:0,
    mode:duo()?2:mode,
    note:duo()?((mode===3?'По сети · ':'')+'Счёт '+wins[1]+' : '+wins[2]):('Решено '+solved+' из '+played)});
  var m=document.getElementById('medal');
  var titleEl=document.getElementById('sheetTitle');
  var subEl=document.getElementById('sheetSub');
  var W=word.toUpperCase();
  if(duo()){
    var scorer=win?guesser:setter;
    titleEl.textContent = mode===3
      ? (scorer===net.seat ? (win?'Вы отгадали слово':'Ваше слово устояло')
                           : (named(scorer)
                              ? (win? who()[scorer-1]+' отгадал(а) слово'
                                    : who()[scorer-1]+' загадал(а) — слово устояло')
                              : (win?'Соперник отгадал слово':'Слово соперника устояло')))
      : (win ? (named(guesser) ? who()[guesser-1]+' отгадал(а) слово'
                                : sideName(guesser,true)+' отгадали слово')
             : 'Слово устояло');
    subEl.textContent = W+' · счёт '+wins[1]+' : '+wins[2];
    m.className='medal';
    m.style.setProperty('--a',scorer===1?'var(--red-a)':'var(--yel-a)');
    m.style.setProperty('--b',scorer===1?'var(--red-b)':'var(--yel-b)');
    m.style.setProperty('--a2',scorer===1?'var(--yel-a)':'var(--red-a)');
    m.style.setProperty('--b2',scorer===1?'var(--yel-b)':'var(--red-b)');
    /* фант достаётся проигравшему: вдвоём видят оба, по сети — только он сам */
    if(mode!==3 || scorer!==net.seat){
      ftextEl.textContent=rollForfeit();
      forfeitEl.classList.add('on');
    } else forfeitEl.classList.remove('on');
  }else{
    forfeitEl.classList.remove('on');
    if(win){
      titleEl.textContent='Слово угадано!';
      subEl.textContent=W+' · '+(mistakes? mistakes+' '+errForm(mistakes) : 'без ошибок')+' · решено '+solved+' из '+played;
      m.className='medal';
      m.style.setProperty('--a','var(--grn-a)');
      m.style.setProperty('--b','var(--grn-b)');
      m.style.setProperty('--a2','var(--yel-a)');
      m.style.setProperty('--b2','var(--yel-b)');
    }else{
      titleEl.textContent='Слово не угадано';
      subEl.textContent='Было: '+W+' · решено '+solved+' из '+played;
      m.className='medal tie';
    }
  }
  sheetEl.classList.add('on'); backdrop.classList.add('on'); pillEl.classList.remove('on');
}
function closeSheet(showPill){
  sheetEl.classList.remove('on'); backdrop.classList.remove('on');
  if(showPill) pillEl.classList.add('on');
}

document.getElementById('again').addEventListener('click',function(){

/* ===================== РАУНД ===================== */
function newRound(keepRoles){
  session++;
  clearTimer(); hideTip();
  over=false; locked=false;
  mistakes=0; entry=[];
  resetFigure(); resetKeyboard();
  pillEl.classList.remove('on');
  plies=0;
  if(mode===3){
    setter = net.round%2===0 ? 1 : 2;   /* кто загадывает, задаёт сервер */
    guesser=3-setter;
    startSetup();
  }else if(mode===2){
    if(!keepRoles){ setter=3-setter; }
    guesser=3-setter;
    startSetup();
  }else{
    word=pickWord();
    startGuess(false);
  }
}

/* ===================== ЗАСТАВКА ===================== */
var MINI_WORD='друг';
var MINI_ORDER=[2,0,3,1];
var miniTimers=[];
function playMini(){
  miniTimers.forEach(clearTimeout); miniTimers=[];
  var mt=mgridEl.querySelectorAll('.mtile'), i;
  for(i=0;i<mt.length;i++){ mt[i].className='mtile'; mt[i].textContent=''; }
  function at(ms,fn){ miniTimers.push(setTimeout(fn,ms)); }
  for(i=0;i<MINI_ORDER.length;i++){
    (function(step){
      var idx=MINI_ORDER[step];
      at(600+step*430,function(){
        mt[idx].textContent=MINI_WORD[idx].toUpperCase();
        mt[idx].classList.add('on','pop');
      });
      at(600+step*430+300,function(){ mt[idx].classList.remove('pop'); });
    })(i);
  }
  at(600+MINI_ORDER.length*430+1100,playMini);
}

/* ===================== ЗАПУСК ===================== */
kbdEl.addEventListener('click',function(e){
  var btn=e.target.closest('.key');
  if(!btn) return;
  var k=btn.getAttribute('data-k');
  if(k==='ENTER') onEnter();
  else if(k==='BACK') onBack();
  else if(phase==='set') onLetter(k);
  else guessLetter(k);
});
document.addEventListener('keydown',function(e){
  if(!app.classList.contains('playing')) return;
  if(e.key==='Enter'){ e.preventDefault(); onEnter(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); onBack(); return; }
  var low=(e.key||'').toLowerCase();
  if(low.length===1 && ALPHABET.indexOf(low)>=0){
    if(phase==='set') onLetter(low); else guessLetter(low);
  }
});
function startGame(m){

  wins=[0,0,0]; solved=0; played=0; setter=2;

  document.body.classList.toggle('playing-net',m===3);

/* ---------- игра по сети ---------- */
/* Игра асимметричная, поэтому и ходы разные: сначала загадывающий шлёт
   слово, потом отгадывающий шлёт буквы. Первый ход раунда — всегда слово,
   по этому и различаем. */
NET.init({
  game:'viselica',
  title:'Быстрая виселица',
  applied:function(){ return plies; },
  begin:function(c){ net.seat=c.seat; net.round=c.round; startGame(3); },
  round:function(c){ net.round=c.round; closeSheet(false); newRound(false); },
  move:function(v){
    v=String(v||'');
    if(phase==='set') takeWord(v);
    else takeLetter(v);
  },
  ended:toMenu
});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
var fitTimer=null;
function fitDebounced(){
  clearTimeout(fitTimer);
  fitTimer=setTimeout(fit,80);
}
window.addEventListener('resize',fitDebounced);
window.addEventListener('orientationchange',function(){ setTimeout(fit,250); });
if(window.ResizeObserver) new ResizeObserver(fitDebounced).observe(arenaEl);

playMini();
})();
</script>
