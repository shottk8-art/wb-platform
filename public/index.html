/* ---------- мини-турнир ---------- */
/* Несколько игр подряд вдвоём на одном телефоне. Здесь турнир собирают
   (игры — случайно или самим, фанты — по очереди и втайне) и здесь же
   открывают итог. Сами игры ведёт общий модуль tour.js. */
var tzNow=document.getElementById('tourNow');
var tzInvite=document.getElementById('tourInvite');
var tzSheet=document.getElementById('tourSheet');
var tzEnd=document.getElementById('tourEnd');
var CUP="<svg class='tz-cup' viewBox='0 0 40 40' aria-hidden='true'><rect width='40' height='40' rx='11' fill='#1C1C1E'/>"+
  "<path d='M12.6 9.6h14.8v6.3a7.4 7.4 0 0 1-14.8 0z' fill='#F5BE0A'/>"+
  "<path d='M12.8 11.8H9.6a3.6 3.6 0 0 0 3.9 5.4M27.2 11.8h3.2a3.6 3.6 0 0 1-3.9 5.4' fill='none' stroke='#F5BE0A' stroke-width='2.2' stroke-linecap='round'/>"+
  "<rect x='18.4' y='22.4' width='3.2' height='4.8' fill='#F5BE0A'/><rect x='13.6' y='27' width='12.8' height='4.4' rx='1.6' fill='#E7362B'/></svg>";
var CHECK="<svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='11' fill='#30B855'/>"+
  "<path d='M7 12.4l3.3 3.3L17.2 8.8' fill='none' stroke='#fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>";
/* настройка живёт, пока открыта шторка: закрыли посреди — откроется там же */
var tz={step:1, mode:'rnd', count:3, draw:[], pick:[], f:['','']};
var tzStopArmed=false;

function tzPool(){ return GAMES.filter(function(g){ return g.ready; }).map(function(g){ return g.id; }); }
function tzTitles(){ var o={}; GAMES.forEach(function(g){ if(g.ready) o[g.id]=g.title; }); return o; }
function tzShuffle(){
  var p=tzPool(), i, j, x;
  for(i=p.length-1;i>0;i--){ j=(Math.random()*(i+1))|0; x=p[i]; p[i]=p[j]; p[j]=x; }
  tz.draw=p.slice(0,tz.count);
}
function tzGames(){ return tz.mode==='rnd' ? tz.draw : tz.pick; }
/* Кто играет, в турнире не спрашиваем: имена те же, что в играх (шторка
   «Имена игроков»), первый — красные, второй — жёлтые. Без имени сторону
   зовём по цвету, и глагол тогда во множественном: «пишет Аня», но «пишут
   жёлтые». Читаются всякий раз заново — переименовали посреди турнира,
   и всё покажет новое имя. */
function tzNm(i){ return sides('duo')[i]; }
function tzNamed(i){ var n=DP.names(); return !!(i ? n.friend : n.me); }
function tzV(i,one,many){ return tzNamed(i) ? one : many; }
function tzLow(i){ return tzNamed(i) ? tzNm(i) : tzNm(i).toLowerCase(); }
function tzIcon(id){ return '<svg viewBox="0 0 64 64" aria-hidden="true">'+(ICON[id]||'')+'</svg>'; }

/* ---------- карточки на главном ---------- */
function renderTour(){
  var t=TOUR.read();
  tzInvite.innerHTML = t ? '' :
    '<button class="tz-card" id="tzInv" type="button">'+CUP+
      '<span class="tz-txt"><b>Мини-турнир</b><i>Несколько игр подряд, а проигравшему — фант от соперника</i></span>'+
      '<span class="tz-cta">Собрать</span></button>';
  tzInvite.hidden=!!t;
  if(!t){
    document.getElementById('tzInv').addEventListener('click',function(){ openSetup(false); });
    tzNow.innerHTML=''; tzNow.hidden=true;
    return;
  }
  var s=TOUR.score(t), n=TOUR.played(t), plan=TOUR.planned(t), done=TOUR.over(t), cur=TOUR.current(t);
  var head = done ? 'окончен' : (n>=plan ? 'решающая игра' : 'игра '+(n+1)+' из '+plan);
  var icons=t.games.map(function(g,i){
    var r=t.res[i];
    return '<span class="tz-g'+(i<n?' done':'')+(i===n&&!done?' now':'')+'" title="'+esc(TOUR.title(t,g))+'">'+tzIcon(g)+
      (i<n ? '<i'+(r===1?' class="a"':r===2?' class="b"':'')+'></i>' : '')+'</span>';
  }).join('');
  tzNow.innerHTML=
    '<div class="tz-now">'+
      '<span class="pr-head"><b>Турнир</b><i>'+esc(head)+'</i></span>'+
      board(sides('duo'),{me:s[0],them:s[1]},false)+
      '<div class="tz-games">'+icons+'</div>'+
      (done ? '<button class="btn primary tz-go" id="tzOpen" type="button">Итоги и фант</button>'
            : '<a class="btn primary tz-go" id="tzGo" href="'+esc(TOUR.link(t))+'">'+(n?'Продолжить: ':'Начать: ')+esc(TOUR.title(t,cur))+'</a>')+
      '<button class="tz-stop" id="tzStop" type="button">Прервать турнир</button>'+
    '</div>';
  tzNow.hidden=false;
  tzStopArmed=false;
  if(done) document.getElementById('tzOpen').addEventListener('click',openEnd);
  document.getElementById('tzStop').addEventListener('click',function(){
    var b=document.getElementById('tzStop');
    if(!tzStopArmed){ tzStopArmed=true; b.classList.add('armed'); b.textContent='Точно прервать? Фанты пропадут'; return; }
    TOUR.write(null); renderTour(); announce('Турнир прерван');
  });
}

/* ---------- настройка ---------- */
function openSetup(fresh){
  if(fresh){ tz.step=1; tz.f=['','']; }
  if(tz.step===1 && !tz.draw.length) tzShuffle();
  renderSetup();
  backdrop.classList.add('on'); tzSheet.classList.add('on');
}
function closeSetup(){ unType(tzSheet); tzSheet.classList.remove('on'); backdrop.classList.remove('on'); }
function tzReady(){ return tzGames().length>=2; }
/* keep — перерисовка того же шага (перемешали, сменили число игр): шторка
   остаётся там, где её пролистали; новый шаг начинается сверху */
function renderSetup(keep){
  var body=document.getElementById('tzBody'), sub=document.getElementById('tzSub'), h='', g=tzGames(), y=tzSheet.scrollTop;
  if(tz.step===1){
    sub.textContent='Несколько игр подряд на одном телефоне. Проигравший выполняет фант, который втайне придумал соперник';
    h+='<p class="pr-sub">Игры</p>'+
       '<div class="tz-seg" id="tzMode"><button type="button" data-m="rnd"'+(tz.mode==='rnd'?' class="on"':'')+'>Случайно</button>'+
         '<button type="button" data-m="pick"'+(tz.mode==='pick'?' class="on"':'')+'>Выбрать самим</button></div>';
    if(tz.mode==='rnd'){
      h+='<div class="tz-seg" id="tzCount"><button type="button" data-n="3"'+(tz.count===3?' class="on"':'')+'>3 игры</button>'+
           '<button type="button" data-n="5"'+(tz.count===5?' class="on"':'')+'>5 игр</button></div>'+
         '<div class="slist" id="tzDraw">'+tz.draw.map(function(id,k){
           return '<div class="srow">'+tzIcon(id)+'<span class="n"><b>'+esc(byId(id).title)+'</b><i>'+esc(byId(id).desc)+'</i></span>'+
                  '<span class="v">'+(k+1)+'</span></div>';
         }).join('')+'</div>'+
         '<button class="btn" id="tzShuffle" type="button">Перемешать</button>';
    }else{
      h+='<p class="tz-hint">Нажимайте игры в том порядке, в каком будете играть. Нужно хотя бы две</p>'+
         '<div class="slist" id="tzPick">'+tzPool().map(function(id){
           var k=tz.pick.indexOf(id);
           return '<button class="srow tz-pick'+(k>-1?' on':'')+'" type="button" data-g="'+id+'" aria-pressed="'+(k>-1)+'">'+tzIcon(id)+
                  '<span class="n"><b>'+esc(byId(id).title)+'</b><i>'+esc(byId(id).desc)+'</i></span>'+
                  '<span class="tz-num">'+(k>-1?k+1:'')+'</span></button>';
         }).join('')+'</div>';
    }
    h+='<p class="tz-hint" id="tzWhy" style="text-align:center;margin-top:12px"></p>'+
       '<button class="btn primary" id="tzToF" type="button">Дальше — фанты</button>';
  }else if(tz.step===2 || tz.step===3){
    /* пишет первый — фант второму; потом наоборот */
    var w=tz.step===2?0:1, o=1-w;
    sub.textContent='Фанты пишутся по очереди и прячутся: их откроют только в конце';
    h+='<div class="tz-who '+(w?'b':'a')+'"><span>'+tzV(w,'Пишет','Пишут')+'</span><b>'+esc(tzNm(w))+'</b></div>'+
       '<p class="tz-hint" style="text-align:center">Фант, который '+tzV(o,'выполнит','выполнят')+' <b>'+esc(tzLow(o))+'</b>, '+
         'если '+tzV(o,'проиграет','проиграют')+' турнир. '+esc(tzNm(o))+', не '+tzV(o,'подглядывай','подглядывайте')+'!</p>'+
       '<textarea class="nin tz-f" id="tzF" maxlength="120" enterkeyhint="done" placeholder="Например: моет посуду всю неделю"></textarea>'+
       '<button class="btn" id="tzIdea" type="button">Подсказать</button>'+
       '<button class="btn primary" id="tzHide" type="button" disabled>'+(w?'Спрятать':'Спрятать и передать телефон')+'</button>'+
       (w===0?'<button class="tz-back" id="tzBack" type="button">Назад к играм</button>':'');
  }else{
    sub.textContent='';
    h+='<div class="tz-ok">'+CHECK+'Оба фанта спрятаны</div>'+
       '<p class="tz-hint" style="text-align:center">Их откроют только в конце — проигравшему</p>'+
       '<div class="slist">'+g.map(function(id,k){
         return '<div class="srow">'+tzIcon(id)+'<span class="n"><b>'+esc(byId(id).title)+'</b></span><span class="v">'+(k+1)+'</span></div>';
       }).join('')+'</div>'+
       '<button class="btn primary" id="tzStart" type="button">Начать турнир</button>';
  }
  body.innerHTML=h;
  try{ tzSheet.scrollTop=keep ? y : 0; }catch(e){}
  wireSetup();
}
function tzCheck(){
  var b=document.getElementById('tzToF'), why=document.getElementById('tzWhy');
  if(!b) return;
  var ok=tzReady();
  b.disabled=!ok;
  why.textContent = ok ? '' : 'Выберите хотя бы две игры';
}
function wireSetup(){
  var el=function(id){ return document.getElementById(id); };
  if(tz.step===1){
    [].forEach.call(document.querySelectorAll('#tzMode button'),function(b){
      b.addEventListener('click',function(){ tz.mode=b.getAttribute('data-m'); renderSetup(true); });
    });
    [].forEach.call(document.querySelectorAll('#tzCount button'),function(b){
      b.addEventListener('click',function(){ tz.count=+b.getAttribute('data-n'); tzShuffle(); renderSetup(true); });
    });
    if(el('tzShuffle')) el('tzShuffle').addEventListener('click',function(){ tzShuffle(); renderSetup(true); });
    /* выбор игры меняет только номера на кнопках — список не перерисовывается,
       и шторка не прыгает, сколько бы игр ни выбирали */
    [].forEach.call(document.querySelectorAll('#tzPick .tz-pick'),function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-g'), k=tz.pick.indexOf(id);
        if(k>-1) tz.pick.splice(k,1); else tz.pick.push(id);
        paintPick();
        tzCheck();
      });
    });
    el('tzToF').addEventListener('click',function(){ if(!tzReady()) return; tz.step=2; renderSetup(); });
    tzCheck();
  }else if(tz.step===2 || tz.step===3){
    var f=el('tzF'), hide=el('tzHide'), w=tz.step===2?0:1;
    /* поле растёт вместе с текстом, а не прокручивает его внутри себя */
    var grow=function(){ f.style.height='auto'; f.style.height=Math.min(Math.max(f.scrollHeight,96),168)+'px'; };
    f.addEventListener('input',function(){ hide.disabled=!f.value.trim(); grow(); });
    /* фант — одна фраза: «Готово» на клавиатуре заканчивает набор, а не переносит строку */
    f.addEventListener('keydown',function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); try{ f.blur(); }catch(err){} } });
    el('tzIdea').addEventListener('click',function(){
      f.value=FORFEIT[(Math.random()*FORFEIT.length)|0][2];
      hide.disabled=false; grow();
    });
    hide.addEventListener('click',function(){
      var v=f.value.replace(/\s+/g,' ').trim();
      if(!v) return;
      tz.f[1-w]=v;                       /* пишет w — выполнит соперник */
      f.value='';
      try{ f.blur(); }catch(e){}
      tz.step++;
      renderSetup();
      announce(tz.step===3 ? 'Фант спрятан. Передайте телефон' : 'Оба фанта спрятаны');
    });
    if(el('tzBack')) el('tzBack').addEventListener('click',function(){ tz.step=1; renderSetup(); });
  }else{
    el('tzStart').addEventListener('click',function(){
      var t=TOUR.start({games:tzGames(), titles:tzTitles(), pool:tzPool(), f:tz.f});
      tz={step:1, mode:tz.mode, count:tz.count, draw:[], pick:[], f:['','']};
      location.href=TOUR.link(t);
    });
  }
}

function paintPick(){
  [].forEach.call(document.querySelectorAll('#tzPick .tz-pick'),function(b){
    var k=tz.pick.indexOf(b.getAttribute('data-g'));
    b.classList.toggle('on',k>-1);
    b.setAttribute('aria-pressed',String(k>-1));
    b.querySelector('.tz-num').textContent=k>-1 ? k+1 : '';
  });
}

/* ---------- итог ---------- */
function openEnd(){
  var t=TOUR.read();
  if(!t || !TOUR.over(t)) return;
  var w=TOUR.winner(t), l=3-w, s=TOUR.score(t), plan=TOUR.planned(t), rows='';
  document.getElementById('teMedal').className='tz-medal'+(w===2?' b':'');
  /* как в играх: «Победа: Аня», а без имени — «Победили жёлтые» */
  document.getElementById('teTitle').textContent=tzNamed(w-1) ? 'Победа: '+tzNm(w-1) : 'Победили '+tzLow(w-1);
  document.getElementById('teSub').textContent='Турнир '+s[0]+' : '+s[1]+' · '+t.games.length+' '+plural(t.games.length,'игра','игры','игр')+
    (t.tb ? ' · с решающей' : '');
  t.games.forEach(function(g,i){
    var r=t.res[i];
    rows+='<div class="srow">'+tzIcon(g)+'<span class="n"><b>'+esc(TOUR.title(t,g))+'</b>'+
      (i>=plan?'<i>решающая</i>':'')+'</span>'+
      '<span class="tz-res'+(r===1?' a':r===2?' b':'')+'">'+esc(r ? tzNm(r-1) : 'ничья')+'</span></div>';
  });
  document.getElementById('teBody').innerHTML=
    '<div class="slist">'+rows+'</div>'+
    '<button class="tz-reveal'+(l===2?' b':'')+'" id="teReveal" type="button">'+
      '<span class="tz-cover">Открыть фант<em>'+esc(tzNm(l-1))+', '+tzV(l-1,'готовься','готовьтесь')+'</em></span>'+
      '<span class="tz-open"></span>'+
    '</button>'+
    '<button class="tz-second" id="teSecond" type="button" hidden>Показать второй фант — он не пригодился</button>';
  var rv=document.getElementById('teReveal'), sc=document.getElementById('teSecond');
  rv.addEventListener('click',function(){
    if(rv.classList.contains('shown')) return;
    /* текст фанта попадает на страницу только сейчас — до нажатия его нет нигде, даже в разметке */
    var who=tzNm(l-1)+' '+tzV(l-1,'выполняет','выполняют')+' фант';
    rv.querySelector('.tz-open').innerHTML='<i>'+esc(who)+'</i><b>«'+esc(t.f[l-1])+'»</b><em>придумано соперником</em>';
    rv.classList.add('shown'); sc.hidden=false;
    FX.fire([14,60,26],'success');
    announce(who+': '+t.f[l-1]);
  });
  sc.addEventListener('click',function(){
    sc.innerHTML='А это ждало бы: <b>'+esc(tzNm(w-1))+'</b> — «'+esc(t.f[w-1])+'»';
  });
  backdrop.classList.add('on'); tzEnd.classList.add('on');
}
function closeEnd(){ tzEnd.classList.remove('on'); backdrop.classList.remove('on'); }
document.getElementById('teDone').addEventListener('click',function(){ TOUR.write(null); closeEnd(); renderTour(); });
document.getElementById('teAgain').addEventListener('click',function(){
  TOUR.write(null); tzEnd.classList.remove('on'); renderTour();
  openSetup(true);
});

/* ---------- статистика ---------- */
var sheetEl=document.getElementById('sheet');
var backdrop=document.getElementById('backdrop');
var resetBtn=document.getElementById('statReset');
var resetArmed=false;

function renderStats(){
  var games=DP.read().games, html='', total=0, i, g, s;
  for(i=0;i<GAMES.length;i++){
    g=GAMES[i]; if(!g.ready) continue;
    s=games[g.id];
    if(!s) continue;
    total+=s.plays||0;
    /* вдвоём показываем счёт красные : жёлтые, в одиночной игре — сколько отгадано */
    var duel=(s.w1||0)+(s.w2||0)+(s.draws||0);
    var score=duel ? ((s.w1||0)+' : '+(s.w2||0))
                   : (s.solved ? (s.solved+' / '+(s.plays||0)) : '—');
    var sub=(s.plays||0)+' '+plural(s.plays||0,'партия','партии','партий');
    if(duel&&s.draws) sub+=' · ничьих '+s.draws;
    if(s.solved) sub+=' · угадано '+s.solved;
    sub+=' · '+ago(s.last);
    html+='<div class="srow">'+
            '<svg viewBox="0 0 64 64" aria-hidden="true">'+ICON[g.id]+'</svg>'+
            '<span class="n"><b>'+esc(g.title)+'</b><i>'+esc(sub)+'</i></span>'+
            '<span class="v">'+score+'</span>'+
          '</div>';
  }
  document.getElementById('statBody').innerHTML = html
    ? '<div class="slist">'+html+'</div>'
    : '<div class="slist"><p class="empty">Пока пусто.<br>Сыграйте партию — здесь появится счёт по каждой игре.</p></div>';
  document.getElementById('statSub').textContent = total
    ? ('Всего партий: '+total+' · красные : жёлтые')
    : 'История партий хранится только на этом устройстве';
  resetBtn.hidden=!total;
  resetBtn.textContent='Сбросить статистику';
  resetArmed=false;
}
function plural(n,a,b,c){
  var n10=n%10, n100=n%100;
  if(n10===1&&n100!==11) return a;
  if(n10>=2&&n10<=4&&(n100<10||n100>=20)) return b;
  return c;
}
function openStats(){ renderStats(); backdrop.classList.add('on'); sheetEl.classList.add('on'); }
function closeStats(){ backdrop.classList.remove('on'); sheetEl.classList.remove('on'); }

/* ---------- имена игроков ---------- */
/* Одно место на всё приложение: игры читают имена из общей памяти. */
var whoSheet=document.getElementById('whoSheet');
var meEl=document.getElementById('nameMe'), friendEl=document.getElementById('nameFriend');
function saveWho(){ DP.names({me:meEl.value, friend:friendEl.value}); }
function openWho(){
  var p=DP.names();
  meEl.value=p.me; friendEl.value=p.friend;
  backdrop.classList.add('on'); whoSheet.classList.add('on');
}
function closeWho(){
  saveWho();
  unType(whoSheet);
  try{ meEl.blur(); friendEl.blur(); }catch(e){}
  backdrop.classList.remove('on'); whoSheet.classList.remove('on');
  renderRecent(); renderPair(); renderTour();
}
meEl.addEventListener('input',saveWho);
friendEl.addEventListener('input',saveWho);
[meEl,friendEl].forEach(function(el){
  el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
});
document.getElementById('whoBtn').addEventListener('click',openWho);
document.getElementById('whoClose').addEventListener('click',closeWho);

/* строка для скринридера — та же, что во всех играх */
function announce(t){
  var el=document.getElementById('live');
  if(el) el.textContent=t;
}

/* ---------- переключатель звука ---------- */
var sndBtn=document.getElementById('sndBtn');
var SND_ON="<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M11 5L6.5 9H3v6h3.5L11 19z'/><path d='M15.5 8.8a4.5 4.5 0 0 1 0 6.4'/><path d='M18.5 6a8 8 0 0 1 0 12'/></svg>";
var SND_OFF="<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M11 5L6.5 9H3v6h3.5L11 19z'/><path d='M16 10l5 5M21 10l-5 5'/></svg>";
function paintSound(){
  var on=DP.sound();
  sndBtn.innerHTML = on ? SND_ON : SND_OFF;
  sndBtn.classList.toggle('off',!on);
  sndBtn.setAttribute('aria-pressed',on?'true':'false');
  sndBtn.setAttribute('aria-label',on?'Звук включён':'Звук выключен');
}
sndBtn.addEventListener('click',function(){
  var on=DP.sound(!DP.sound());
  FX.forget(); paintSound();
  announce(on?'Звук включён':'Звук выключен');
  if(on) FX.play('good');           /* включили — коротко подтверждаем на слух */
});
paintSound();

/* ---------- переключатель темы ---------- */
/* Кнопка показывает тему, которая сейчас на экране: солнце — светлая,
   месяц — тёмная. Пока игрок её не трогал, тема берётся из настроек
   телефона и меняется вместе с ними; первое же нажатие фиксирует выбор. */
var themeBtn=document.getElementById('themeBtn');
var T_SUN="<svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='4.1'/>"+
  "<path d='M12 2.6V5M12 19v2.4M21.4 12H19M5 12H2.6M18.6 5.4 17 7M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4'/></svg>";
var T_MOON="<svg viewBox='0 0 24 24' aria-hidden='true'>"+
  "<path d='M20.3 14.6A8.6 8.6 0 0 1 9.4 3.7 8.6 8.6 0 1 0 20.3 14.6z'/></svg>";
function paintTheme(){
  var night=DP.dark();
  themeBtn.innerHTML = night ? T_MOON : T_SUN;
  themeBtn.setAttribute('aria-label', night ? 'Тёмная тема, включить светлую'
                                            : 'Светлая тема, включить тёмную');
}
themeBtn.addEventListener('click',function(){
  var night=DP.dark();
  DP.theme(night?'light':'dark');
  paintTheme();
  announce(night?'Светлая тема':'Тёмная тема');
});
paintTheme();
/* внутри Telegram тему может поставить он сам — кнопка должна это отразить */
document.addEventListener('dp:telegram', paintTheme);
/* своего выбора ещё нет — идём за настройками телефона, если их поменяли */
try{
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
    if(!DP.theme()) paintTheme();
  });
}catch(e){}

document.getElementById('statBtn').addEventListener('click',openStats);
document.getElementById('statClose').addEventListener('click',closeStats);
/* одна подложка на все шторки: закрывает ту, что открыта */
function closeTop(){
  if(whoSheet.classList.contains('on')) closeWho();
  else if(pairSheet.classList.contains('on')) closePair();
  else if(tzSheet.classList.contains('on')) closeSetup();
  else if(tzEnd.classList.contains('on')) closeEnd();
  else closeStats();
}
backdrop.addEventListener('click',closeTop);
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeTop(); });

/* ---------- поле ввода в шторке ---------- */
/* Пока в шторке набирают текст, у неё класс typing — она стоит у верхнего
   края экрана (см. стили). Первая попытка (27.09) поднимала шторку ровно на
   высоту клавиатуры по visualViewport — на телефоне пользователя это уносило
   всё за край экрана: высоту клавиатуры iPhone, Telegram и Android считают
   по-разному. Верхний край от клавиатуры не зависит вовсе. */
var FIELD='input,textarea';
function sheetOf(t){ return t && t.closest ? t.closest('.sheet') : null; }
document.addEventListener('focusin',function(e){
  var sh=sheetOf(e.target);
  if(sh && e.target.matches(FIELD)) sh.classList.add('typing');
});
document.addEventListener('focusout',function(e){
  var sh=sheetOf(e.target);
  if(!sh) return;
  /* Не сразу: нажатие на кнопку шторки должно попасть туда, куда целились, а
     переход к соседнему полю — не дёргать шторку вниз и обратно. */
  setTimeout(function(){
    var a=document.activeElement;
    if(a && sh.contains(a) && a.matches(FIELD)) return;
    sh.classList.remove('typing');
    if(window.scrollY) window.scrollTo(0,0);      /* iPhone мог сдвинуть страницу, пока была клавиатура */
  },200);
});
/* шторку закрыли посреди набора — поле отпускаем, клавиатура уходит */
function unType(sh){
  var a=document.activeElement;
  if(a && sh.contains(a)) try{ a.blur(); }catch(e){}
  sh.classList.remove('typing');
}
resetBtn.addEventListener('click',function(){
  if(!resetArmed){ resetArmed=true; resetBtn.textContent='Точно сбросить?'; return; }
  DP.clear(); renderStats(); renderRecent(); renderPair();
});

renderHero();
renderPair();
renderTour();
renderRecent();
renderBento();
/* вернулись из последней игры турнира — сразу итог */
(function(){
  var m=/[?&]tour=(\d+)/.exec(location.search), t=TOUR.read();
  if(m && t && t.id===+m[1] && TOUR.over(t)) setTimeout(openEnd,350);
})();
})();
</script>
