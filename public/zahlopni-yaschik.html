<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<script>
/* Тема — до первой отрисовки, иначе при запуске мигнёт чужим фоном.
   Выбор игрока лежит в общей памяти приложения (ключ dvoeplay:v1);
   пусто — значит берём тему из настроек телефона, как раньше. */
(function(){try{
  var d=JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}'), t=d&&d.theme;
  if(t!=='light'&&t!=='dark') return;
  document.documentElement.setAttribute('data-theme',t);
  var c=t==='dark'?'#1C1C1E':'#F2F2F7', m=document.querySelectorAll('meta[name="theme-color"]'), i;
  for(i=0;i<m.length;i++) m[i].setAttribute('content',c);
}catch(e){}})();

/* Офлайн-режим: после первого открытия приложение работает и без сети
   (кроме игры по сети). Регистрируем после загрузки, чтобы не отнимать
   у страницы первые мгновения. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* Telegram. Его скрипт нужен только внутри мини-приложения: снаружи он
   лишь тормозил бы загрузку, а без сети вешал бы её. Первая страница
   внутри Telegram открывается с #tgWebAppData в адресе — это и признак;
   дальше помним его до конца сеанса, ведь при переходе в игру хвоста
   в адресе уже нет. */
(function(){
  var tg=false;
  try{
    tg=/tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy || sessionStorage.getItem('dp:tg')==='1';
    if(tg) sessionStorage.setItem('dp:tg','1');
  }catch(e){}
  if(!tg) return;
  var s=document.createElement('script');
  s.src='https://telegram.org/js/telegram-web-app.js';
  s.onload=function(){
    var W=window.Telegram&&window.Telegram.WebApp, root=document.documentElement;
    if(!W) return;
    function mine(){
      try{ var t=(JSON.parse(localStorage.getItem('dvoeplay:v1')||'{}')||{}).theme;
           return t==='light'||t==='dark'?t:''; }catch(e){ return ''; }
    }
    function paint(){
      /* своей темы игрок не выбирал — идём за темой Telegram, а не телефона */
      if(!mine() && (W.colorScheme==='dark'||W.colorScheme==='light')) root.setAttribute('data-theme',W.colorScheme);
      var a=root.getAttribute('data-theme');
      var dark=a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var bg=dark?'#1C1C1E':'#F2F2F7';
      try{ W.setHeaderColor(bg); W.setBackgroundColor(bg); }catch(e){}
      try{ if(W.setBottomBarColor) W.setBottomBarColor(bg); }catch(e){}
    }
    try{ W.ready(); }catch(e){}
    try{ W.expand(); }catch(e){}
    /* свайп вниз не должен сворачивать приложение посреди партии:
       в «Матрёшке» и «Магнитном бое» фишки тянут пальцем */
    try{ if(W.disableVerticalSwipes) W.disableVerticalSwipes(); }catch(e){}
    paint();
    try{ W.onEvent('themeChanged',paint); }catch(e){}
    /* в играх кнопка «Назад» Telegram ведёт на главный экран */
    try{
      if(/(^|\/)(index\.html)?$/.test(location.pathname)) W.BackButton.hide();
      else { W.BackButton.show(); W.BackButton.onClick(function(){ location.href='index.html'; }); }
    }catch(e){}
    try{ document.dispatchEvent(new Event('dp:telegram')); }catch(e){}
  };
  document.head.appendChild(s);
})();
</script>

     в сетевую игру приходит голой ссылкой. Картинка — по полному адресу, иначе не покажут -->

<style>
:root{
  color-scheme:light;      /* поля ввода и полосы прокрутки тоже светлые */
  --bg:#F2F2F7; --surface:#FFFFFF; --well:#E8E8ED;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16);
  --tint:#007AFF;
  --red-a:#FF5247; --red-b:#E7362B;
  --yel-a:#FFD426; --yel-b:#F5BE0A;
  --on-yel:#1C1C1E;
  --die:#FFFFFF;
  --edge:rgba(60,60,67,.07);
  --thumb-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --card-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -10px rgba(0,0,0,.14);
  --pc-shadow:0 2px 6px rgba(0,0,0,.20);
  --inset:inset 0 1px 3px rgba(0,0,0,.07);
  --spring:cubic-bezier(.34,1.48,.5,1);
  --ease:cubic-bezier(.32,.72,0,1);
  --pad:12px; --rgap:7px; --colgap:12px; --rpad:6px; --rackw:94px; --dsz:64px; --tfont:26px;
}
/* Тёмная тема. По умолчанию берётся из настроек телефона, но выбор
   в приложении важнее: атрибут data-theme ставится ещё до отрисовки. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1C1E; --surface:#2C2C2E; --well:#3A3A3C;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --tint:#0A84FF;
    --die:#48484A;
    --edge:rgba(255,255,255,.07);
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.5),0 12px 28px -14px rgba(0,0,0,.9);
    --pc-shadow:0 3px 9px rgba(0,0,0,.45);
    --inset:inset 0 1px 3px rgba(0,0,0,.34);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1C1C1E; --surface:#2C2C2E; --well:#3A3A3C;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6);
    --tint:#0A84FF;
    --die:#48484A;
    --edge:rgba(255,255,255,.07);
    --thumb-shadow:0 3px 8px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.5),0 12px 28px -14px rgba(0,0,0,.9);
    --pc-shadow:0 3px 9px rgba(0,0,0,.45);
    --inset:inset 0 1px 3px rgba(0,0,0,.34);
  }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--label);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- каркас из двух экранов ---------- */
.app{position:fixed;inset:0;overflow:hidden}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 10px);
  transition:transform .46s var(--ease),opacity .46s var(--ease);
  background:var(--bg);
  will-change:transform;
}
/* Планшет и компьютер: колонка шириной с телефон по центру окна, как в
   «4 в ряд» и на главном экране, — а не список, табло и кнопки во всю ширину.
   Низкий альбомный телефон не трогаем: там ширина нужна раскладке «руки по бокам». */
@media (min-width:600px) and (min-height:561px){
  .screen{padding-left:max(calc(env(safe-area-inset-left) + 16px),calc((100% - 520px)/2));
          padding-right:max(calc(env(safe-area-inset-right) + 16px),calc((100% - 520px)/2))}
}
#game{transform:translateX(100%)}
.app.playing #menu{transform:translateX(-28%);opacity:.35}
.app.playing #game{transform:translateX(0)}

/* ---------- навигация ---------- */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-bottom:10px}
.navtitle{font-size:17px;font-weight:600;letter-spacing:-.35px;text-align:center}
.back{
  justify-self:start;display:flex;align-items:center;gap:3px;
  border:0;background:none;color:var(--tint);cursor:pointer;
  font:400 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.3px;
  padding:6px 8px 6px 0;transition:opacity .15s ease;
}
.back:active{opacity:.4}
.back svg{width:11px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon{
  justify-self:end;width:34px;height:34px;border:0;border-radius:50%;
  background:var(--fill);color:var(--tint);display:grid;place-items:center;cursor:pointer;
  transition:transform .18s var(--spring),opacity .18s ease;
}
.icon:active{transform:scale(.9);opacity:.6}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ---------- меню ---------- */
#menu{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#menu>*{flex-shrink:0}
/* Ничто в меню не сжимается меньше своего содержимого: на низком экране
   (iPhone SE в Safari — 375×548) меню прокручивается, а не сплющивает
   заставку в полоску и не наезжает подписью на заголовок списка. */
.brand{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}

.mini{
  position:relative;width:min(62%,216px);aspect-ratio:5/2;
  background:var(--surface);border-radius:18px;overflow:hidden;
  box-shadow:var(--card-shadow);margin-bottom:30px;
  flex:none;
}
.mrow{position:absolute;left:6%;right:6%;bottom:16%;display:flex;justify-content:center;gap:3px}
.mtile{
  flex:1;max-width:11px;height:30px;border-radius:3px;background:var(--well);
  transition:background .3s ease,transform .35s var(--spring),opacity .35s ease;
}
.mtile.r{background:linear-gradient(180deg,var(--red-a),var(--red-b))}
.mtile.y{background:linear-gradient(180deg,var(--yel-a),var(--yel-b))}
.mtile.down{transform:translateY(4px) scaleY(.82)}
.mdie{
  position:absolute;left:50%;top:17%;width:15px;height:15px;border-radius:4px;
  background:var(--well);transform:translate(-50%,0);
  transition:transform .3s var(--spring),background .3s ease;
}
.mdie::after{
  content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
  background:var(--label3);transform:translate(-50%,-50%);
}
.mdie.hop{transform:translate(-50%,-9px) rotate(20deg)}

.wordmark{margin:0;width:min(240px,76%);line-height:0;color:var(--label)}
.wordmark svg{display:block;width:100%;height:auto;fill:currentColor}
.tagline{margin:9px 0 0;font-size:15px;color:var(--label2);letter-spacing:-.1px}

.section{font-size:17px;font-weight:600;letter-spacing:-.35px;margin:0 0 9px 4px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--card-shadow)}
.row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  border:0;background:none;color:inherit;font:inherit;text-align:left;
  padding:13px 16px;cursor:pointer;transition:background .12s ease;
}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.row:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.row i{font-style:normal;font-size:13px;color:var(--label2);letter-spacing:-.05px}
.row .chev{width:9px;height:14px;flex:none;fill:none;stroke:var(--label3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.footnote{margin:14px 4px 0;font-size:12px;color:var(--label3);text-align:center;letter-spacing:-.02px}
.tohub{
  align-self:flex-start;flex:none;display:inline-flex;align-items:center;gap:5px;
  margin:0 0 4px;padding:10px 15px 10px 11px;border-radius:999px;
  background:var(--fill);color:var(--tint);text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:-.2px;
  transition:transform .16s var(--spring),opacity .16s ease;
}
.tohub svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tohub:active{transform:scale(.95);opacity:.7}
@media (max-height:660px){.tohub{padding:8px 13px 8px 10px;font-size:13px}}
.legal{margin:12px 0 2px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.1px;color:var(--label3)}
.legal sup{font-size:.7em;vertical-align:.5em;font-weight:500;letter-spacing:0;margin-left:.05em}

/* ---------- счёт ---------- */
.scoreboard{position:relative;display:flex;background:var(--fill);border-radius:16px;padding:4px;flex:none;margin-bottom:14px}
.slider{
  position:absolute;top:4px;left:4px;bottom:4px;width:calc(50% - 4px);
  background:var(--surface);border-radius:12px;box-shadow:var(--thumb-shadow);
  transition:transform .42s var(--spring),opacity .3s ease;
}
.side{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 9px}
.side .name{font-size:13px;font-weight:500;color:var(--label2);letter-spacing:-.05px;display:flex;align-items:center;gap:5px}
.side .name::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(180deg,var(--red-a),var(--red-b))}
.side[data-p="2"] .name::before{background:linear-gradient(180deg,var(--yel-a),var(--yel-b))}
.side .score{font-size:24px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.12;transition:transform .3s var(--spring)}
.side.bump .score{transform:scale(1.22)}
.side .cap{font-size:11px;color:var(--label3);letter-spacing:0}
.dots{display:inline-flex;gap:2px}
.dots i{width:3px;height:3px;border-radius:50%;background:var(--label2);opacity:.25;animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.22}30%{opacity:.9}}

/* ---------- ящик: слева цифры, справа стол для броска ---------- */
.arena{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
.board{
  margin:auto;width:min(100%,392px);height:100%;
  background:var(--surface);border-radius:24px;
  box-shadow:var(--card-shadow),inset 0 0 0 1px var(--edge);
  padding:var(--pad);display:flex;gap:var(--colgap);
}

/* ---- стойка с цифрами: открытые плашки, которые захлопываются ---- */
.rack{
  width:var(--rackw);flex:none;display:grid;gap:var(--rgap);
  grid-template-rows:repeat(var(--rrows,6),1fr);grid-auto-flow:column;grid-auto-columns:1fr;
  padding:var(--rpad);border-radius:18px;background:var(--fill2);box-shadow:var(--inset);
}
.tile{
  position:relative;min-height:0;min-width:0;border:0;padding:0;margin:0;background:none;
  cursor:pointer;transition:transform .18s var(--spring),opacity .2s ease;
}
.tile:active:not(:disabled){transform:scale(.94)}
.tile.off{opacity:.42}
.tile.off .face.up{box-shadow:0 1px 0 rgba(0,0,0,.10)}
.tile.sel{transform:scale(.94)}
/* створка: верхняя грань схлопывается, нижняя раскрывается следом.
   Только scaleY — такую анимацию целиком тянет композитор, без перерисовки слоёв */
.face{
  position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;
  font:600 17px/1 -apple-system,system-ui,sans-serif;font-size:var(--tfont);letter-spacing:-.5px;
  transition:transform .2s;
}
.face.up{
  background:var(--die);color:var(--label);
  box-shadow:0 2px 0 rgba(0,0,0,.13),0 3px 7px rgba(0,0,0,.13);
  transform:scaleY(1);
  transition-timing-function:cubic-bezier(.2,.7,.35,1);
  transition-delay:calc(var(--d,0ms) + 200ms);
}
.face.down{
  background:radial-gradient(circle at 26% 22%,rgba(255,255,255,.5),rgba(255,255,255,0) 58%),linear-gradient(180deg,var(--red-a),var(--red-b));
  color:#fff;box-shadow:inset 0 1px 3px rgba(0,0,0,.24);
  transform:scaleY(0);
  transition-timing-function:cubic-bezier(.55,0,.85,.5);
  transition-delay:var(--d,0ms);
}
.tile.o2 .face.down{
  color:var(--on-yel);
  background:radial-gradient(circle at 26% 22%,rgba(255,255,255,.5),rgba(255,255,255,0) 58%),linear-gradient(180deg,var(--yel-a),var(--yel-b));
}
.tile.shut .face.up{
  transform:scaleY(0);
  transition-timing-function:cubic-bezier(.55,0,.85,.5);
  transition-delay:var(--d,0ms);
}
.tile.shut .face.down{
  transform:scaleY(1);
  transition-timing-function:cubic-bezier(.2,.7,.35,1);
  transition-delay:calc(var(--d,0ms) + 200ms);
}
.tile.sel .face.up{box-shadow:inset 0 0 0 3.5px var(--red-b),0 2px 0 rgba(0,0,0,.13)}
.rack.p2 .tile.sel .face.up{box-shadow:inset 0 0 0 3.5px var(--yel-b),0 2px 0 rgba(0,0,0,.13)}
/* цифра не подходит под кубики: плашка мотает головой и на миг
   гаснет в «недоступный» вид — тот же, что до броска */
.tile.nope{animation:nope .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes nope{
  0%,100%{transform:translateX(0)}
  13%{transform:translateX(-8px)}
  30%{transform:translateX(7px)}
  48%{transform:translateX(-5px)}
  66%{transform:translateX(4px)}
  84%{transform:translateX(-2px)}
}
.tile.nope .face.up{animation:noface .42s ease}
@keyframes noface{
  0%,100%{
    background:var(--die);color:var(--label);
    box-shadow:0 2px 5px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.4);
  }
  16%,70%{
    background:var(--well);color:var(--label3);
    box-shadow:inset 0 0 0 3px var(--label3);
  }
}
.rack.win .tile{animation:winpulse .62s var(--spring);animation-delay:calc(var(--i)*45ms)}
@keyframes winpulse{0%,100%{transform:scale(1)}45%{transform:scale(1.09)}}

/* ---- стол, на который бросают ---- */
.pit{
  flex:1;min-width:0;position:relative;border:0;padding:0;margin:0;
  -webkit-appearance:none;appearance:none;
  border-radius:18px;background:var(--fill2);box-shadow:var(--inset);
  overflow:hidden;cursor:pointer;
}
.pit:disabled{cursor:default}
.pit::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 70% at 50% 0%,rgba(0,0,0,.05),rgba(0,0,0,0) 62%);
}
.die{
  position:absolute;left:0;top:0;width:var(--dsz);height:var(--dsz);border-radius:23%;
  background-color:var(--die);
  background-image:radial-gradient(circle at 30% 24%,rgba(255,255,255,.38),rgba(255,255,255,0) 58%);
  box-shadow:0 6px 14px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.14);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:calc(var(--dsz)*.13);
  transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--rot,0deg));
  transition:opacity .25s ease;
}
.die i{
  width:calc(var(--dsz)*.175);height:calc(var(--dsz)*.175);
  place-self:center;border-radius:50%;background:var(--label);
  opacity:0;transition:opacity .07s linear;
}
.die.idle{opacity:.4}
.die.hide{display:none}
.die.v1 i:nth-child(5),
.die.v2 i:nth-child(1),.die.v2 i:nth-child(9),
.die.v3 i:nth-child(1),.die.v3 i:nth-child(5),.die.v3 i:nth-child(9),
.die.v4 i:nth-child(1),.die.v4 i:nth-child(3),.die.v4 i:nth-child(7),.die.v4 i:nth-child(9),
.die.v5 i:nth-child(1),.die.v5 i:nth-child(3),.die.v5 i:nth-child(5),.die.v5 i:nth-child(7),.die.v5 i:nth-child(9),
.die.v6 i:nth-child(1),.die.v6 i:nth-child(3),.die.v6 i:nth-child(4),.die.v6 i:nth-child(6),.die.v6 i:nth-child(7),.die.v6 i:nth-child(9){opacity:1}
.die.throw{animation:throwdie var(--dur,1150ms) linear both}
@keyframes throwdie{
  0%{
    transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) rotate(var(--spin)) scale(.58);
    box-shadow:0 26px 34px rgba(0,0,0,.24),0 1px 2px rgba(0,0,0,.10);
    animation-timing-function:cubic-bezier(.3,.32,.62,.7);
  }
  22%{
    transform:translate(calc(var(--x) + var(--dx)*.52),calc(var(--y) + var(--dy)*.5)) rotate(calc(var(--spin)*.58)) scale(.74);
    box-shadow:0 22px 30px rgba(0,0,0,.24),0 1px 2px rgba(0,0,0,.11);
    animation-timing-function:cubic-bezier(.36,.08,.72,.5);
  }
  40%{
    transform:translate(calc(var(--x) + var(--dx)*.2),calc(var(--y) + var(--dy)*.16)) rotate(calc(var(--spin)*.26)) scale(.9);
    box-shadow:0 17px 24px rgba(0,0,0,.23),0 1px 2px rgba(0,0,0,.12);
    animation-timing-function:cubic-bezier(.5,0,.86,.48);
  }
  52%{
    transform:translate(var(--x),var(--y)) rotate(calc(var(--rot) + 22deg)) scale(1.08,.89);
    box-shadow:0 3px 7px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.16);
    animation-timing-function:cubic-bezier(.1,.76,.42,1);
  }
  61%{
    transform:translate(calc(var(--x) - 3px),calc(var(--y) - var(--dsz)*.3)) rotate(calc(var(--rot) + 12deg)) scale(1);
    box-shadow:0 14px 20px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.13);
    animation-timing-function:cubic-bezier(.5,0,.86,.48);
  }
  70%{
    transform:translate(var(--x),var(--y)) rotate(calc(var(--rot) + 5deg)) scale(1.05,.93);
    box-shadow:0 3px 7px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.16);
    animation-timing-function:cubic-bezier(.1,.76,.42,1);
  }
  78%{
    transform:translate(var(--x),calc(var(--y) - var(--dsz)*.12)) rotate(calc(var(--rot) + 1deg)) scale(1);
    box-shadow:0 9px 14px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.13);
    animation-timing-function:cubic-bezier(.5,0,.86,.48);
  }
  86%{
    transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(1.03,.96);
    box-shadow:0 3px 7px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.15);
    animation-timing-function:cubic-bezier(.22,.7,.4,1);
  }
  93%{
    transform:translate(var(--x),calc(var(--y) - var(--dsz)*.035)) rotate(var(--rot)) scale(1);
    box-shadow:0 7px 12px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.14);
  }
  100%{
    transform:translate(var(--x),var(--y)) rotate(var(--rot)) scale(1);
    box-shadow:0 6px 14px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.14);
  }
}

/* ---------- панель действия ---------- */
.dock{flex:none;display:flex;align-items:center;gap:10px;margin-top:12px}
.roll{
  flex:1;height:52px;padding:0;border:0;border-radius:14px;
  background:var(--tint);color:#fff;
  font:600 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.4px;
  cursor:pointer;transition:transform .18s var(--spring),opacity .18s ease;
}
.roll:active:not(:disabled){transform:scale(.98);opacity:.85}
.roll:disabled{opacity:.4;cursor:default}
.hint{
  flex:none;text-align:center;font-size:13px;color:var(--label2);letter-spacing:-.05px;
  min-height:18px;margin-top:10px;transition:color .18s ease;
}
.hint.hot{color:var(--tint);font-weight:500}

/* ---------- итоговая шторка ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .38s var(--ease);z-index:5}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(102%);transition:transform .5s var(--ease);
  max-width:520px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 14px}
.medal{
  position:relative;width:56px;height:56px;border-radius:50%;margin:2px auto 14px;
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.62),rgba(255,255,255,0) 48%),
             linear-gradient(180deg,var(--a),var(--b));
  box-shadow:var(--pc-shadow),inset 0 -3px 6px rgba(0,0,0,.2);
}
.medal::after{
  content:"";position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.62),rgba(255,255,255,0) 48%),
             linear-gradient(180deg,var(--a2),var(--b2));
  box-shadow:0 0 0 2px var(--surface);
}
.medal.tie{--a:var(--fill);--b:var(--fill);--a2:var(--label3);--b2:var(--label3);box-shadow:none}
.sheet.on .medal{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.sheet h2{margin:0;text-align:center;font-size:24px;font-weight:700;letter-spacing:-.45px}
.sheet p{margin:5px 0 22px;text-align:center;font-size:15px;color:var(--label2);letter-spacing:-.1px}
.forfeit{
  display:none;width:100%;align-items:center;gap:12px;text-align:left;
  background:var(--fill);border:0;border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:12px;
  color:inherit;font:inherit;cursor:pointer;transition:transform .18s var(--spring);
}
.forfeit.on{display:flex}
.forfeit:active{transform:scale(.98)}
.ftext{flex:1;font-size:16px;font-weight:600;letter-spacing:-.25px;transition:opacity .16s ease}
.forfeit.roll .ftext{opacity:0}
.forfeit .die2{width:20px;height:20px;flex:none;fill:none;stroke:var(--label3);stroke-width:1.9;transition:transform .45s var(--spring)}
.forfeit:active .die2{transform:rotate(90deg)}
.primary{
  width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;
  font:600 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.4px;
  padding:16px;cursor:pointer;transition:transform .18s var(--spring),opacity .15s ease;
}
.primary:active{transform:scale(.98);opacity:.85}
.ghost-btn{
  width:100%;border:0;background:none;color:var(--tint);
  font:400 17px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.4px;
  padding:15px;margin-top:2px;cursor:pointer;transition:opacity .15s ease;
}
.ghost-btn:active{opacity:.45}
.pill{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translate(-50%,20px);
  z-index:4;border:0;border-radius:22px;background:var(--tint);color:#fff;
  font:600 15px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.3px;
  padding:13px 20px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.pill.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  /* число повторов обязательно: бесконечная анимация (точки ожидания, пульс
     победной фишки), сжатая до миллисекунды, не замирает, а мерцает */
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.06s!important}
}
@media (max-height:660px){
  :root{--pad:10px;--rgap:6px;--colgap:10px}
  .scoreboard{margin-bottom:10px}
  .wordmark{width:min(205px,72%)}

  .legal{margin-top:7px}
  .side .score{font-size:21px}
  .row{padding:11px 16px}
  .roll{height:48px}
}
@media (orientation:landscape) and (max-height:560px){
  :root{--pad:8px;--rgap:5px;--colgap:8px}
  .scoreboard{margin-bottom:8px}
  .nav{height:38px;margin-bottom:4px}

  .side .score{font-size:19px}
  .side .cap{font-size:10px}
  .dock{margin-top:8px}
  .hint{margin-top:6px}
}
</style>

<script src="net.js"></script>
<script src="tour.js"></script>
<script>
(function(){
"use strict";

/* ===================== ПРАВИЛА =====================
   В ящике открыты цифры 1…12. Ящик ОДИН на двоих. Игроки бросают
   два кубика по очереди: выпало 8 — закрой любые открытые цифры,
   сумма которых равна 8 («8», «5+3», «1+2+5» …), и ход переходит
   сопернику. Каждый набирает сумму тех цифр, которые закрыл сам.
   Нечем закрыть — ход просто переходит, ничего не теряешь.
   После двух промахов подряд кубики начинают подыгрывать: сумма
   всё чаще выбирается из тех, что на поле собираются.
   Когда закрыты все цифры больше двойки, бросается один кубик.
   Играем, пока ящик не захлопнут целиком — либо пока отстающий ещё
   может догнать: если даже все оставшиеся на поле очки не выведут
   его вперёд, партия закрывается досрочно (на равенство это не
   распространяется, ничья остаётся достижимой).
   Побеждает большая сумма, весь ящик — 78.
   Сумму броска игрок считает сам: подсветки возможных цифр нет,
   а по неподходящей цифре плашка вздрагивает.
==================================================== */

var N=12;                  /* цифр в ящике */
var ALL=4095;              /* биты 0…11 — цифры 1…12 */
var TOTAL=78;              /* 1+2+…+12 — весь ящик */
var DICE=2;                /* кубиков в броске */
var MINS=2, MAXS=12;       /* границы суммы броска */
var SUMOF=new Array(1<<N);
var BY_SUM=[];             /* BY_SUM[s] — все наборы цифр с суммой s */
var PS=[];                 /* PS[s] — вероятность выбросить s двумя кубиками */

(function precompute(){
  var s,m,i,t,a,b;
  for(s=0;s<=MAXS;s++){ BY_SUM.push([]); PS.push(0); }
  for(m=0;m<(1<<N);m++){
    t=0;
    for(i=0;i<N;i++) if(m&(1<<i)) t+=i+1;
    SUMOF[m]=t;
    if(m && t<=MAXS) BY_SUM[t].push(m);
  }
  for(a=1;a<=6;a++) for(b=1;b<=6;b++) PS[a+b]+=1/36;
})();

function combosFor(mask,s){
  var out=[],L,i;
  if(s<1||s>MAXS) return out;
  L=BY_SUM[s];
  for(i=0;i<L.length;i++) if((L[i]&~mask)===0) out.push(L[i]);
  return out;
}
function hasCombo(mask,s){
  var L,i;
  if(s<1||s>MAXS) return false;
  L=BY_SUM[s];
  for(i=0;i<L.length;i++) if((L[i]&~mask)===0) return true;
  return false;
}

/* ---- Ценность позиции для того, кто сейчас бросает: ожидаемая разница
       «мои будущие очки минус чужие» при идеальной игре обеих сторон.
       Промах не заканчивает партию, а отдаёт ход сопернику на том же
       поле, поэтому V ссылается сама на себя: V = A - q*V, где q —
       вероятность промаха. Отсюда V = A/(1+q), без итераций. ---- */
var memoV={};
function value(mask){
  if(mask===0) return 0;
  var v=memoV[mask];
  if(v!=null) return v;
  var acc=0,q=0,s,L,i,best,cand,pr;
  for(s=loSum(mask);s<=hiSum(mask);s++){
    pr=probOf(mask,s);
    L=combosFor(mask,s);
    if(!L.length){ q+=pr; continue; }
    best=-Infinity;
    for(i=0;i<L.length;i++){
      cand=SUMOF[L[i]]-value(mask&~L[i]);
      if(cand>best) best=cand;
    }
    acc+=best*pr;
  }
  v=(q>=1-1e-12)?0:acc/(1+q);
  memoV[mask]=v;
  return v;
}
/* Если закрыты все цифры больше двойки, бросается один кубик:
   иначе единицу и двойку не достать — двумя кубиками меньше двух
   не выпадает, а пара «1 и 2» ловится только суммой 2 или 3. */
function oneDie(mask){ return !(mask & ~3); }
function loSum(mask){ return oneDie(mask)?1:MINS; }
function hiSum(mask){ return oneDie(mask)?6:MAXS; }
function probOf(mask,s){ return oneDie(mask)?(1/6):PS[s]; }

/* Два промаха подряд — кубики начинают подыгрывать: с растущей
   вероятностью сумма броска выбирается только из тех, что на поле
   реально собираются. Внутри этой выборки веса остаются честными
   (семёрка по-прежнему вероятнее двенадцати), поэтому бросок не
   выглядит подложенным. 2 промаха — помощь в половине случаев,
   3 — в трёх четвертях, 4 — почти всегда. Грани кубиков потом
   подбираются под выпавшую сумму случайно. */
function rollSum(){
  var lo=loSum(openMask), hi=hiSum(openMask), s, i;
  var help = missStreak>=2 ? 1-Math.pow(.5,missStreak-1) : 0;
  if(mode===3){
    /* по сети берём три числа по номеру броска — одинаковые у обоих */
    var q1=netRand(0), q2=netRand(1), q3=netRand(2);
    if(help>0 && q1<help){
      var L=[], W=[], T=0, p2;
      for(s=lo;s<=hi;s++) if(hasCombo(openMask,s)){ p2=probOf(openMask,s); L.push(s); W.push(p2); T+=p2; }
      if(L.length){
        var rr=q2*T;
        for(i=0;i<L.length;i++){ rr-=W[i]; if(rr<=0) return L[i]; }
        return L[L.length-1];
      }
    }
    return oneDie(openMask) ? 1+((q2*6)|0) : (1+((q2*6)|0))+(1+((q3*6)|0));
  }
  if(help>0 && Math.random()<help){
    var list=[], w=[], tot=0, pr;
    for(s=lo;s<=hi;s++) if(hasCombo(openMask,s)){ pr=probOf(openMask,s); list.push(s); w.push(pr); tot+=pr; }
    if(list.length){
      var r=Math.random()*tot;
      for(i=0;i<list.length;i++){ r-=w[i]; if(r<=0) return list[i]; }
      return list[list.length-1];
    }
  }
  return oneDie(openMask)?rnd(6):rnd(6)+rnd(6);
}
function facesFor(sum){
  if(oneDie(openMask)) return [sum,0];
  var opts=[],a,b;
  for(a=1;a<=6;a++){ b=sum-a; if(b>=1&&b<=6) opts.push([a,b]); }
  /* грани тоже должны совпасть — иначе у игроков разные кубики при той же сумме */
  var r = mode===3 ? netRand(3) : Math.random();
  return opts[(r*opts.length)|0];
}

/* Отстающий математически выбыл: даже забрав ВСЕ оставшиеся на поле
   очки, он не перегонит лидера. Ничья ещё возможна — при равенстве
   партию не рвём, играем дальше. */
function decided(){
  var lead=Math.max(scores[1],scores[2]), low=Math.min(scores[1],scores[2]);
  return low+SUMOF[openMask]<lead;
}

/* поле умерло: из оставшихся цифр не собрать ни одной возможной суммы */
function boardDead(mask){
  for(var s=loSum(mask);s<=hiSum(mask);s++) if(hasCombo(mask,s)) return false;
  return true;
}

/* ===================== ЭЛЕМЕНТЫ ===================== */
var rootEl=document.documentElement;
var app=document.getElementById('app');
var arenaEl=document.getElementById('arena');
var rackEl=document.getElementById('rack');
var pitEl=document.getElementById('pit');
var dieEl=[document.getElementById('die1'),document.getElementById('die2')];
var rollEl=document.getElementById('roll');
var hintEl=document.getElementById('hint');
var liveEl=document.getElementById('live');
var sliderEl=document.getElementById('slider');
var sheetEl=document.getElementById('sheet');
var backdrop=document.getElementById('backdrop');
var pillEl=document.getElementById('pill');
var sideEl=[null,document.getElementById('side1'),document.getElementById('side2')];
var scoreEl=[null,document.getElementById('score1'),document.getElementById('score2')];
var nameEl=[null,document.getElementById('name1'),document.getElementById('name2')];
var mrowEl=document.getElementById('mrow');
var mdieEl=document.getElementById('mdie');
var tileEls=[];

/* ===================== СОСТОЯНИЕ ===================== */
var mode=1, turn=1, starter=1, session=0;
var over=false, locked=false, rolling=false;
var openMask=ALL, sel=0, pending=0, missStreak=0;
var net={seat:1,round:0};
var plies=0;          /* сколько сетевых ходов принято за раунд */
var rollNo=0;         /* номер броска в раунде — по нему считается, что выпало */
var netQueue=[];      /* чужие ходы ждут, пока доиграет анимация */
var scores=[0,0,0];
var wins=[0,0,0];
var hintMsg='';
/* Ход передаётся не сразу, а через паузу: доиграть анимацию плиток и дать
   увидеть промах. Всё это время очерёдность ещё старая, и трогать её нельзя —
   ни чужому ходу из очереди, ни подсказке сервера. Иначе отложенный таймер
   позже перезапишет очередь старым значением, и оба игрока станут ждать
   друг друга: игра встанет намертво. */
var handing=false;
var timers=[];

function later(ms,fn){
  var s=session;
  var id=setTimeout(function(){ if(s===session) fn(); },ms);
  timers.push(id);
  return id;
}
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function haptic(v,kind){ FX.fire(v,kind); }
function rnd(n){ return 1+((Math.random()*n)|0); }
/* ---------- имена игроков ---------- */
/* Своё имя и имя друга лежат в общей памяти приложения, имя сетевого
   соперника приходит из комнаты. Пусто — показываем как раньше. */
function who(){
  var p=DP.names();
  if(mode===3){
    var me=p.me||'Вы', them=NET.oppName||'Соперник';
    return net.seat===2?[them,me]:[me,them];
  }
  if(mode===2) return [p.me||'Красные', p.friend||'Жёлтые'];
  return [p.me||'Вы','Соперник'];
}
/* настоящее ли имя у стороны — от этого зависит, как назвать победителя */
function named(i){
  var p=DP.names();
  if(mode===3) return i===net.seat ? !!p.me : !!NET.oppName;
  if(mode===2) return i===1 ? !!p.me : !!p.friend;
  return false;
}
function names(){ return who(); }
/* сейчас не наша очередь: против ИИ это второй игрок, по сети — чужое место */
function notMine(){
  if(mode===3) return turn!==net.seat;
  return mode<2 && turn===2;
}
/* Бросок по сети: считается от зерна комнаты, номера раунда и НОМЕРА БРОСКА.
   Это важнее, чем кажется: так число не зависит от того, сколько раз кто-то
   дёрнул генератор, и клиенты не могут разъехаться. */
function netRand(k){
  var h = (NET.seed|0) ^ Math.imul(net.round+1,0x9E3779B1)
        ^ Math.imul(rollNo+1,0x85EBCA6B) ^ Math.imul(k+1,0xC2B2AE35);
  h ^= h>>>16; h = Math.imul(h,0x7FEB352D);
  h ^= h>>>15; h = Math.imul(h,0x846CA68B);
  h ^= h>>>16;
  return (h>>>0)/4294967296;
}
function currentName(){ return names()[turn-1]; }
function isAI(p){ return mode<2 && p===2; }
function jit(a){ return (Math.random()*2-1)*a; }
function clampv(v,a,b){ return v<a?a:(v>b?b:v); }

/* ===================== РАЗМЕР ЯЩИКА ===================== */
function cssPx(name){ return parseFloat(getComputedStyle(rootEl).getPropertyValue(name))||0; }
function fit(){
  var w=arenaEl.clientWidth, h=arenaEl.clientHeight;
  if(!w||!h) return;
  var pad=cssPx('--pad'), rgap=cssPx('--rgap'), colgap=cssPx('--colgap'), rpad=cssPx('--rpad');
  var innerW=Math.min(w,392)-pad*2, innerH=h-pad*2, rackH=innerH-rpad*2;
  var rows=6;                                        /* 12 цифр: два столбца по шесть */
  if((rackH-rgap*(rows-1))/rows<34) rows=4;          /* тесно — три столбца */
  if((rackH-rgap*(rows-1))/rows<30) rows=3;          /* совсем тесно — четыре */
  var cols=Math.ceil(N/rows);
  var tileH=(rackH-rgap*(rows-1))/rows;
  var rackW=Math.round(clampv(tileH*1.1*cols+rgap*(cols-1)+rpad*2,innerW*.30,innerW*.46));
  var tileW=(rackW-rpad*2-rgap*(cols-1))/cols;
  var pitW=innerW-colgap-rackW;
  var d=Math.min(pitW*.44,innerH*.30,86);
  if(d<30) d=30;
  rootEl.style.setProperty('--rrows',rows);
  rootEl.style.setProperty('--rackw',rackW+'px');
  rootEl.style.setProperty('--dsz',Math.round(d)+'px');
  rootEl.style.setProperty('--tfont',Math.round(Math.max(13,Math.min(tileH*.62,tileW*.42)))+'px');
  if(!rolling){ pickSpots(); placeDice(); }
}

/* ===================== ПОЛЕ ===================== */
function buildTiles(){
  rackEl.innerHTML='';
  tileEls=[];
  for(var i=0;i<N;i++){
    var b=document.createElement('button');
    b.type='button';
    b.className='tile';
    b.style.setProperty('--i',i);
    b.setAttribute('aria-label','Цифра '+(i+1));
    var up=document.createElement('span');
    up.className='face up';
    up.textContent=String(i+1);
    var dn=document.createElement('span');
    dn.className='face down';
    dn.textContent=String(i+1);
    b.appendChild(up); b.appendChild(dn);
    (function(k){ b.addEventListener('click',function(){ onTile(k); }); })(i);
    rackEl.appendChild(b);
    tileEls.push(b);
  }
}

/* ---- кубики ---- */
var spots=[{x:0,y:0,rot:0},{x:0,y:0,rot:0},{x:0,y:0,rot:0}];
var LANES=[.30,.68];
function pickSpots(){
  var pw=pitEl.clientWidth||220, ph=pitEl.clientHeight||320, d=cssPx('--dsz')||60, k;
  var cx=(pw-d)/2, n=oneDie(openMask)?1:DICE;
  for(k=0;k<DICE;k++){
    spots[k]=(n===1)
      ? {x:cx+jit(pw*.14), y:(ph-d)/2+jit(ph*.05), rot:jit(16)}
      : {x:cx+jit(pw*.16), y:ph*LANES[k]-d/2+jit(ph*.035), rot:jit(16)};
    spots[k].x=clampv(spots[k].x,6,Math.max(6,pw-d-6));
    spots[k].y=clampv(spots[k].y,6,Math.max(6,ph-d-6));
  }
}
function placeDice(){
  var n=oneDie(openMask)?1:DICE;
  dieEl[1].classList.toggle('hide',n===1);
  for(var k=0;k<DICE;k++){
    dieEl[k].style.setProperty('--x',Math.round(spots[k].x)+'px');
    dieEl[k].style.setProperty('--y',Math.round(spots[k].y)+'px');
    dieEl[k].style.setProperty('--rot',spots[k].rot.toFixed(1)+'deg');
  }
}
function setFace(k,v){
  var el=dieEl[k];
  el.classList.remove('v1','v2','v3','v4','v5','v6');
  el.classList.add('v'+v);
}
function idleDice(){       /* кубики остаются лежать как легли, только гаснут */
  for(var k=0;k<DICE;k++){
    dieEl[k].classList.remove('throw');
    dieEl[k].style.animationDelay='';
    dieEl[k].classList.add('idle');
  }
}
function resetDice(){
  pickSpots(); placeDice();
  for(var k=0;k<DICE;k++) setFace(k,rnd(6));
  idleDice();
}
function bump(p){
  sideEl[p].classList.add('bump');
  later(300,function(){ sideEl[p].classList.remove('bump'); });
}
var NOFIT='Эта цифра не подходит под кубики';
function shake(i){          /* эту цифру закрыть нельзя — плашка мотает головой */
  var el=tileEls[i];
  haptic(18,'error');
  el.classList.remove('nope');
  void el.offsetWidth;
  el.classList.add('nope');
  if(pending){ hintMsg=NOFIT; paint(); }
  later(440,function(){ el.classList.remove('nope'); });
  later(1200,function(){ if(hintMsg===NOFIT){ hintMsg=''; paint(); } });
}

/* ===================== ОТРИСОВКА ===================== */
function hintInfo(){
  /* сумму броска не пишем: игрок считает кубики сам */
  if(over||hintMsg) return {t:hintMsg,hot:false};
  /* ход соперника — и когда это ИИ, и когда живой игрок по сети */
  if(isAI(turn) || notMine()){
    if(rolling) return {t:'Соперник бросает кубики',hot:false};
    if(pending) return {t:'Соперник закрывает',hot:false};
    return {t:'Ход соперника',hot:false};
  }
  if(rolling) return {t:'Кубики катятся…',hot:false};
  if(!pending && missStreak>=2) return {t:'Два промаха подряд — кубики подыгрывают',hot:true};
  if(pending) return {t:oneDie(openMask)?'Закройте цифры на кубик':'Закройте цифры на сумму кубиков',hot:false};
  if(oneDie(openMask)) return {t:'Остались только 1 и 2 — бросается один кубик',hot:true};
  return {t:mode===2?('Ход '+(turn===1?'красных':'жёлтых')+' — бросьте кубики'):'Ваш ход — бросьте кубики',hot:false};
}
/* точка ожидания: против ИИ всегда справа, по сети — у того, чей ход */
function waitSide(){
  if(over) return 0;
  if(mode===3) return turn!==net.seat ? turn : 0;
  return (locked && isAI(turn)) ? 2 : 0;
}
/* имя приходит и от соперника по сети — в разметку только экранированным */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function paint(){
  var n=names(), DOTS=' <span class="dots"><i></i><i></i><i></i></span>';
  var wait=waitSide();
  sliderEl.style.transform='translateX('+(turn===1?0:100)+'%)';
  sliderEl.style.opacity=over?'0':'1';
  nameEl[1].innerHTML=esc(n[0])+(wait===1?DOTS:'');
  nameEl[2].innerHTML=esc(n[1])+(wait===2?DOTS:'');
  scoreEl[1].textContent=scores[1];
  scoreEl[2].textContent=scores[2];

  var mine=!isAI(turn) && !notMine();   /* по сети ждущий тоже не бросает */
  rollEl.disabled=over||locked||rolling||!!pending||!mine;
  rollEl.textContent=(!mine&&!over)?'Ходит соперник':'Бросить';
  pitEl.disabled=rollEl.disabled;

  var h=hintInfo();
  hintEl.textContent=h.t;
  hintEl.className='hint'+(h.hot?' hot':'');
  paintTiles();
}
function paintTiles(){
  var interactive=(!over&&!locked&&!rolling&&!isAI(turn));
  var k,bit,el,open;
  for(k=0;k<N;k++){
    bit=1<<k; el=tileEls[k]; open=!!(openMask&bit);
    el.classList.toggle('shut',!open);
    el.classList.toggle('sel',open&&!!(sel&bit));
    el.classList.toggle('off',open&&!pending);   /* до броска приглушены, после броска активны все */
    el.disabled=!open||!interactive;
  }
}

/* ===================== ХОД ===================== */
function startTurn(p){
  turn=p; sel=0; pending=0; hintMsg=''; handing=false;
  rackEl.className='rack p'+p;
  idleDice();
  locked=isAI(p);
  paint();
  liveEl.textContent = mode===3 ? (p===net.seat?'Ваш ход':'Ход соперника')
    : mode===2 ? ('Ход: '+currentName()) : (p===1?'Ваш ход':'Ход соперника');
  if(mode===3) locked = p!==net.seat;
  if(isAI(p)) later(620,function(){ rollDice(850); });
}

function rollDice(dur){
  if(rolling) return;
  rolling=true; sel=0;
  rollNo++; plies++;
  paint();
  var k, el, STAGGER=140;
  var n=oneDie(openMask)?1:DICE;
  var vals=facesFor(rollSum());
  var pw=pitEl.clientWidth||220, ph=pitEl.clientHeight||320;
  var d=dur||1150;
  pickSpots();
  placeDice();
  for(k=0;k<n;k++){
    el=dieEl[k];
    el.classList.remove('idle','throw');
    el.style.setProperty('--dx',Math.round(pw*.9+90)+'px');
    el.style.setProperty('--dy',Math.round(-ph*.55-120)+'px');
    el.style.setProperty('--spin',(-(480+((Math.random()*420)|0)))+'deg');
    el.style.setProperty('--dur',d+'ms');
    el.style.animationDelay=(k*STAGGER)+'ms';
    void el.offsetWidth;
    el.classList.add('throw');
  }
  /* грани мелькают в полёте всё медленнее, потом три удара о стол */
  for(k=0;k<n;k++){
    (function(j){
      var off=j*STAGGER, t=0, gap=42;
      while(t<d*.52-60){
        (function(tt){ later(off+tt,function(){ setFace(j,rnd(6)); }); })(t);
        t+=gap; gap=gap*1.14+2;
      }
      later(off+Math.round(d*.52),function(){ setFace(j,rnd(6)); haptic(10); });
      later(off+Math.round(d*.70),function(){ setFace(j,rnd(6)); haptic(6); });
      later(off+Math.round(d*.86),function(){ setFace(j,vals[j]); haptic(3); });
    })(k);
  }
  later(d+STAGGER*(n-1)+60,function(){
    for(var j=0;j<DICE;j++){ dieEl[j].classList.remove('throw'); dieEl[j].style.animationDelay=''; }
    rolling=false;
    afterRoll(n===1?vals[0]:vals[0]+vals[1]);
  });
}
function afterRoll(sum){
  liveEl.textContent='Выпало '+sum;
  if(!hasCombo(openMask,sum)){
    pending=0;
    missStreak++;
    var p=turn;
    locked=true;
    hintMsg='Эту сумму нечем закрыть — ход переходит';
    paint();
    liveEl.textContent='Промах: '+sum+' нечем закрыть';
    haptic(16,'error');
    handing=true;
    later(1150,function(){ startTurn(3-p); });
    return;
  }
  pending=sum;
  paint();
  if(isAI(turn)) later(300,aiClose);
}

function onTile(k){
  if(over||locked||rolling||isAI(turn)||notMine()) return;
  var bit=1<<k;
  if(!(openMask&bit)) return;
  if(!pending){ shake(k); return; }
  if(sel&bit){ sel&=~bit; paint(); return; }
  if(SUMOF[sel]+(k+1)>pending){ shake(k); return; }
  sel|=bit;
  haptic(6);
  if(SUMOF[sel]===pending){
    var sub=sel;
    applyMove(sub);
    if(mode===3) NET.send(sub,3-net.seat);   /* закрыли — ход переходит */
  }
  else paint();
}

function applyMove(sub){
  var p=turn,k,order=0;
  plies++;
  /* Ход передаётся только через 760мс, и всё это время по сети успеваешь
     бросить кубики второй раз — сервер такой ход отвергает. Запираем сразу. */
  if(mode===3) locked=true;
  for(k=0;k<N;k++){
    if(sub&(1<<k)){
      tileEls[k].classList.add('o'+p);
      (function(el,n){
        el.style.setProperty('--d',(n*90)+'ms');
        later(90*n+520,function(){ el.style.removeProperty('--d'); });
        if(n) later(90*n,function(){ haptic(11); });
      })(tileEls[k],order++);
    }
  }
  openMask&=~sub;
  scores[p]+=SUMOF[sub];
  sel=0; pending=0; missStreak=0;
  haptic(11);
  paint();
  bump(p);
  liveEl.textContent=names()[p-1]+': +'+SUMOF[sub];
  if(openMask===0){
    rackEl.classList.add('win');
    finishRound('shut');
    return;
  }
  /* Итог объявляем с паузой, чтобы игрок увидел последний ход, — но играть
     в эту паузу уже нельзя: успеешь бросить кубики, и у соперника, который
     партию уже закрыл, этого броска не будет. Запираем сразу. */
  if(decided()){ locked=true; later(820,function(){ finishRound('decided'); }); return; }
  if(boardDead(openMask)){ locked=true; later(760,function(){ finishRound('dead'); }); return; }
  handing=true;
  later(760,function(){ startTurn(3-p); });
}

function aiClose(){
  var sub=aiPick(openMask,pending);
  if(!sub){ finishRound('dead'); return; }  /* сюда не попадаем: ход уже проверен */
  sel=sub;
  paint();
  later(360,function(){ applyMove(sub); });
}
function aiPick(mask,s){
  var L=combosFor(mask,s),best=[],bv=-Infinity,i,v;
  if(!L.length) return 0;
  if(mode===0) return L[(Math.random()*L.length)|0];
  for(i=0;i<L.length;i++){
    v=SUMOF[L[i]]-value(mask&~L[i]);
    if(v>bv+1e-9){ bv=v; best=[L[i]]; }
    else if(v>bv-1e-9) best.push(L[i]);
  }
  return best[(Math.random()*best.length)|0];
}

/* ---------- общая память приложения dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии. Всё в try/catch:
   если хранилище недоступно, игра работает как раньше, просто без истории. */
var DP=(function(){
  var KEY='dvoeplay:v1';
  function read(){
    try{ var d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.games) return d; }catch(e){}
    return {v:1,games:{}};
  }
  function write(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function save(id,r){
    r=r||{};
    var d=read(), g=d.games[id]||{plays:0,w1:0,w2:0,draws:0,solved:0,solo:0};
    g.plays=(g.plays||0)+1;
    if(r.win===1) g.w1=(g.w1||0)+1;
    else if(r.win===2) g.w2=(g.w2||0)+1;
    else if(r.mode===2) g.draws=(g.draws||0)+1;   /* ничья бывает только вдвоём */
    if(r.mode!==2) g.solo=(g.solo||0)+1;
    if(r.solved) g.solved=(g.solved||0)+1;
    g.last=Date.now(); g.note=r.note||''; g.mode=r.mode;
    d.games[id]=g;
    try{ duel(d,id,r); }catch(e){}
    write(d);
    /* итог партии — тем, кто слушает: мини-турнир (tour.js) ведёт по нему счёт.
       Бросаем после записи, чтобы слушатель читал уже обновлённую память. */
    try{ document.dispatchEvent(new CustomEvent('dp:save',{detail:{id:id,win:r.win,mode:r.mode}})); }catch(e){}
  }
  /* Сброс статистики стирает только историю партий. Имена, тема и звук —
     настройки, а не статистика: раньше сброс стирал весь ключ, и вместе
     со счётом пропадали имена, выбранная тема и выключенный звук. */
  function clear(){ var d=read(); d.games={}; delete d.duel; write(d); }

  /* ---------- кто кого ----------
     Партия на двоих — на одном телефоне или по сети — пишется ещё и по
     людям: кто выиграл, я или соперник. Счёт по цветам для этого не
     годится: по сети моё место в каждой комнате своё.
     На одном телефоне я — всегда первая сторона (так устроены имена), по
     сети — своё место NET.seat. Соперник на одном телефоне — роль «друг»,
     а не имя: переименуют — счёт останется за ним. По сети соперника узнаём
     по имени, и если оно совпало с именем друга — это он и есть. */
  var PAIRS=12, LOG=40;
  /* день начинается в четыре утра: партия после полуночи — тот же вечер */
  function day(t){ var x=new Date(t-4*36e5); return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate(); }
  function duel(d,id,r){
    if(r.mode!==2) return;                          /* против ИИ и в одиночку — не пара */
    var N=window.NET, net=!!(N&&N.on), mine=net?N.seat:1;
    if(mine!==1 && mine!==2) return;
    var opp=net?clip(N.oppName):'', key=net?'net:'+opp.toLowerCase():'duo';
    var res = r.win===mine ? 1 : (r.win===1||r.win===2) ? 2 : 0;   /* 1 — я, 2 — соперник, 0 — ничья */
    var now=Date.now(), P=d.duel||(d.duel={p:{}});
    var p=P.p[key]||(P.p[key]={me:0,them:0,draw:0,g:{},log:[],run:null,since:now});
    if(net) p.name=opp;
    if(res===1) p.me++; else if(res===2) p.them++; else p.draw++;
    var t=p.g[id]||(p.g[id]=[0,0,0]);
    t[res===1?0:res===2?1:2]++;
    p.log.push([now,res,id]);
    if(p.log.length>LOG) p.log.splice(0,p.log.length-LOG);
    var today=day(now);
    if(!p.run || p.run.d!==today)
      p.run={d:today, n:(p.run && p.run.d===day(now-864e5)) ? p.run.n+1 : 1};
    p.last=now;
    fold(d);
    /* соперников по сети может набраться много — держим дюжину последних */
    var keys=Object.keys(P.p);
    if(keys.length>PAIRS){
      keys.sort(function(a,b){ return (P.p[a].last||0)-(P.p[b].last||0); });
      delete P.p[keys[0]];
    }
  }
  /* Друг с одного телефона и тот же человек по сети — одна пара. Имя друга
     могли вписать и после сетевых партий, поэтому сводим при каждом чтении. */
  function fold(d){
    var P=d.duel, f=names().friend, k='net:'+f.toLowerCase();
    if(!P || !P.p || !f || !P.p[k]) return false;
    var a=P.p.duo, b=P.p[k], id, i;
    if(!a){ P.p.duo=b; delete b.name; delete P.p[k]; return true; }
    a.me+=b.me; a.them+=b.them; a.draw+=b.draw;
    for(id in b.g) if(Object.prototype.hasOwnProperty.call(b.g,id)){
      var x=a.g[id]||(a.g[id]=[0,0,0]);
      for(i=0;i<3;i++) x[i]+=b.g[id][i];
    }
    a.log=a.log.concat(b.log).sort(function(u,v){ return u[0]-v[0]; }).slice(-LOG);
    /* серия вечеров — та, что свежее; в один и тот же день — та, что длиннее */
    if(b.run && (!a.run || (b.run.d===a.run.d ? b.run.n>a.run.n : (b.last||0)>(a.last||0)))) a.run=b.run;
    a.since=Math.min(a.since||b.since, b.since||a.since);
    a.last=Math.max(a.last||0, b.last||0);
    delete P.p[k];
    return true;
  }
  function pair(){
    var d=read();
    if(fold(d)) write(d);
    return d.duel||null;
  }
  function pairReset(key){
    var d=read();
    if(d.duel && d.duel.p && d.duel.p[key]){ delete d.duel.p[key]; write(d); }
  }

  /* Имена игроков. «me» — тот, кто держит телефон, «friend» — с кем
     играют вдвоём на одном телефоне. По сети имя соперника приходит из
     комнаты, здесь оно не хранится. Пусто — значит показываем как раньше. */
  var nmCache=null, nmAt=0;
  function clip(s){ return String(s==null?'':s).replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'').slice(0,12); }
  function names(v){
    if(v!==undefined){
      var d=read();
      d.names={me:clip(v.me),friend:clip(v.friend)};
      write(d); nmCache=null;
    }
    var n=Date.now();
    if(nmCache===null || n-nmAt>800){
      var q=read().names||{};
      nmCache={me:clip(q.me),friend:clip(q.friend)};
      nmAt=n;
    }
    return nmCache;
  }
  function sound(v){
    if(v===undefined){ try{ return read().sound!==false; }catch(e){ return true; } }
    var d=read(); d.sound=!!v; write(d); return d.sound;
  }
  /* Тема приложения: '' — как в телефоне, 'light'/'dark' — выбор игрока.
     К первой отрисовке её уже применил коротенький скрипт в шапке страницы; здесь
     только хранение и переключение на лету. */
  var LIGHT_BG='#F2F2F7', DARK_BG='#1C1C1E';
  /* Какой повод для большой плашки показали в прошлый раз — чтобы при
     следующем открытии главного экрана показать следующий по кругу.
     Пользуется этим только главный экран, но блок памяти у всех общий. */
  function hero(v){
    if(v!==undefined){ var d=read(); d.hero=String(v||''); write(d); return d.hero; }
    try{ return read().hero||''; }catch(e){ return ''; }
  }
  function theme(v){
    if(v!==undefined){
      var d=read();
      d.theme=(v==='light'||v==='dark')?v:'';
      write(d); wear(d.theme);
      return d.theme;
    }
    try{ var t=read().theme; return (t==='light'||t==='dark')?t:''; }catch(e){ return ''; }
  }
  /* какая тема на экране прямо сейчас — с оглядкой на настройки телефона */
  function dark(){
    var t=theme();
    if(t) return t==='dark';
    /* своей темы нет, но её мог поставить Telegram — тогда главнее он */
    try{ var a=document.documentElement.getAttribute('data-theme'); if(a) return a==='dark'; }catch(e){}
    try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
  }
  function wear(t){
    try{
      var r=document.documentElement, m, i;
      if(t==='light'||t==='dark') r.setAttribute('data-theme',t); else r.removeAttribute('data-theme');
      m=document.querySelectorAll('meta[name="theme-color"]');
      for(i=0;i<m.length;i++) m[i].setAttribute('content', dark()?DARK_BG:LIGHT_BG);
      /* внутри Telegram его шапка тоже должна перекраситься */
      var W=window.Telegram&&window.Telegram.WebApp;
      if(W){ W.setHeaderColor(dark()?DARK_BG:LIGHT_BG); W.setBackgroundColor(dark()?DARK_BG:LIGHT_BG); }
    }catch(e){}
  }
  return {read:read,save:save,clear:clear,sound:sound,names:names,theme:theme,dark:dark,hero:hero,
          pair:pair,pairReset:pairReset,day:day};
})();
/* ---------- звук и тактильная отдача dvoeplay ---------- */
/* Тот же блок стоит в index.html и во всех играх серии.
   Синтез на лету, файлов нет.

   Главное про характер: это ПЕРКУССИЯ, а не ноты. Ориентир —
   щелчок клавиатуры айфона: очень короткий сухой удар без звона,
   без обертонов и без реверберации, вся энергия в нижней середине.
   Две предыдущие попытки звучали звонко именно потому, что были
   построены как ноты с высокими обертонами и хвостом — не повторять.

   Щелчок = короткий шум через ФНЧ + короткий низкий «толчок».
   Вся шина дополнительно режется фильтром на 2.6кГц, поэтому
   в звуке физически нет частот, которые режут слух. */
var FX=(function(){
  var ctx=null, bus=null, lpf=null, noise=null;
  var lastKind='', lastAt=0, sndCache=null, sndAt=0;
  var CUT=4500;     /* «мягкость» — срез общего ФНЧ, Гц; выбрано на прослушивании */
  var VOL=0.95;     /* общая громкость */

  function allowed(){
    var n=Date.now();
    if(sndCache===null || n-sndAt>800){
      try{ sndCache=DP.read().sound!==false; }catch(e){ sndCache=true; }
      sndAt=n;
    }
    return sndCache;
  }
  function forget(){ sndCache=null; }
  function tune(cut,vol){
    if(cut){ CUT=cut; if(lpf) lpf.frequency.value=cut; }
    if(vol!==undefined){ VOL=vol; if(bus) bus.gain.value=vol; }
    return {cut:CUT,vol:VOL};
  }

  function boot(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx=new AC();
      bus=ctx.createGain(); bus.gain.value=VOL;
      var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=70;
      lpf=ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=CUT; lpf.Q.value=.7;
      var comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=2.2;
      comp.attack.value=.003; comp.release.value=.15;
      bus.connect(hp); hp.connect(lpf); lpf.connect(comp); comp.connect(ctx.destination);
      var n=Math.floor(ctx.sampleRate*.06), nb=ctx.createBuffer(1,n,ctx.sampleRate), d=nb.getChannelData(0), i;
      for(i=0;i<n;i++) d[i]=Math.random()*2-1;
      noise=nb;
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* сухой щелчок: шум через ФНЧ, затухание за единицы миллисекунд */
  function click(gain,cut,dur,at){
    if(!ctx||!noise) return;
    try{
      var t=ctx.currentTime+(at||0);
      var s=ctx.createBufferSource(); s.buffer=noise;
      s.playbackRate.value=.9+Math.random()*.2;          /* лёгкий разброс, чтобы не повторялось */
      var f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; f.Q.value=.6;
      var g=ctx.createGain();
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      s.connect(f); f.connect(g); g.connect(bus);
      s.start(t); s.stop(t+dur+.02);
    }catch(e){}
  }
  /* низкий толчок — тело щелчка, одна синусоида без обертонов */
  function thump(freq,dur,gain,at,bend){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      if(bend) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*bend),t+dur);
      var g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.002);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t+dur+.02);
    }catch(e){}
  }
  /* мягкая нота — только для итогов, с чуть более долгим затуханием */
  function note(freq,dur,gain,at){
    if(!ctx) return;
    try{
      var t=ctx.currentTime+(at||0);
      var o=ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(freq,t);
      var o2=ctx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(freq*2,t);
      var g=ctx.createGain(), g2=ctx.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(gain,t+.010);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      g2.gain.setValueAtTime(.0001,t);
      g2.gain.linearRampToValueAtTime(gain*.07,t+.010);
      g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.5);
      o.connect(g); g.connect(bus);
      o2.connect(g2); g2.connect(bus);
      o.start(t); o.stop(t+dur+.02);
      o2.start(t); o2.stop(t+dur*.5+.02);
    }catch(e){}
  }

  function play(kind){
    if(!boot()) return;
    if(ctx.state==='suspended'){ try{ var pr=ctx.resume(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} }
    switch(kind){
      case 'tick':                                     /* таймер */
        click(1.54,1000,.008);
        break;
      case 'light':                                    /* нажатие — как клавиша */
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
        break;
      case 'medium':                                   /* ход */
        click(1.61,1250,.016);
        thump(330,.045,.98,0,.80);
        break;
      case 'good':                                     /* удачно */
        click(.51,1500,.008);
        note(466.16,.16,.64);
        break;
      case 'heavy':                                    /* тяжёлый ход */
        click(1.66,850,.022);
        thump(200,.090,1.22,0,.72);
        break;
      case 'success':                                  /* победа */
        click(.17,1400,.008);
        note(392.00,.20,.29,0);
        note(523.25,.30,.26,.105);
        break;
      case 'error':                                    /* ошибка */
        click(.21,800,.014);
        thump(220.00,.14,.31,0,.85);
        thump(174.61,.20,.27,.105,.85);
        break;
      default:
        click(1.85,1500,.012);
        thump(420,.026,.88,0,.86);
    }
  }
  function buzz(pattern,kind){
    var tg=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;
    if(tg){
      try{
        if(kind==='success'||kind==='error'||kind==='warning') tg.notificationOccurred(kind);
        else if(kind==='heavy') tg.impactOccurred('heavy');
        else if(kind==='medium'||kind==='good') tg.impactOccurred('medium');
        else tg.impactOccurred('light');
        return;
      }catch(e){}
    }
    if(navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
  }
  function kindOf(v,kind){
    if(kind) return kind;
    if(Object.prototype.toString.call(v)==='[object Array]') return v.length>=5?'error':'success';
    if(v<=6)  return 'light';
    if(v<=11) return 'medium';
    return 'heavy';
  }
  function fire(pattern,kind){
    var k=kindOf(pattern,kind), now=Date.now();
    if(k===lastKind && now-lastAt<35) return;     /* без дублей от одного нажатия */
    lastKind=k; lastAt=now;
    if(allowed()) play(k);
    buzz(pattern,k);
  }

  /* мягкий щелчок по элементам управления */
  var UI=['row','btn','primary','back','icon','iconbtn','pill','forfeit','tohub','chip','hero','t'];
  document.addEventListener('pointerdown',function(e){
    var el=e.target, i;
    while(el && el.nodeType===1){
      if(el.classList) for(i=0;i<UI.length;i++) if(el.classList.contains(UI[i])){ fire(5,'light'); return; }
      el=el.parentNode;
    }
  },true);

  return {fire:fire,play:play,boot:boot,forget:forget,tune:tune};
})();


function openSheet(winner,r1,r2,why){
  /* для истории сетевая партия — это игра вдвоём: есть ничьи, не соло */
  DP.save('zahlopni-yaschik',{win:winner||0,mode:mode===3?2:mode,
    note:(mode===3?'По сети · ':'')+'Побед '+wins[1]+' : '+wins[2]});
  var n=names(), m=document.getElementById('medal');
  var pre = why==='shut' ? 'Ящик захлопнут · ' : (why==='decided' ? 'Досрочно · ' : '');
  document.getElementById('sheetSub').textContent=
    pre+'Сумма '+r1+' : '+r2+' · побед '+wins[1]+' : '+wins[2];
  if(!winner){
    document.getElementById('sheetTitle').textContent='Ничья';
    m.className='medal tie';
    forfeitEl.classList.remove('on');
  }else{
    document.getElementById('sheetTitle').textContent =
      mode===2 ? (named(winner) ? 'Победа: '+n[winner-1] : 'Победили '+(winner===1?'красные':'жёлтые'))
      : mode===3 ? (winner===net.seat ? 'Вы выиграли'
                    : (named(winner) ? 'Победа: '+n[winner-1] : 'Соперник выиграл'))
      : (winner===1?'Вы выиграли':'Соперник выиграл');
    m.className='medal';
    m.style.setProperty('--a',winner===1?'var(--red-a)':'var(--yel-a)');
    m.style.setProperty('--b',winner===1?'var(--red-b)':'var(--yel-b)');
    m.style.setProperty('--a2',winner===1?'var(--yel-a)':'var(--red-a)');
    m.style.setProperty('--b2',winner===1?'var(--yel-b)':'var(--red-b)');
    loserSide=3-winner;
    /* фант достаётся проигравшему: вдвоём видят оба, иначе только он сам */
    var showForfeit = mode===2 ? true : (mode===3 ? winner!==net.seat : winner===2);
    if(showForfeit){ ftextEl.textContent=rollForfeit(); forfeitEl.classList.add('on'); }
    else forfeitEl.classList.remove('on');
  }
  sheetEl.classList.add('on'); backdrop.classList.add('on'); pillEl.classList.remove('on');
}
function closeSheet(showPill){
  sheetEl.classList.remove('on'); backdrop.classList.remove('on');
  if(showPill) pillEl.classList.add('on'); else pillEl.classList.remove('on');
}
document.getElementById('look').addEventListener('click',function(){ closeSheet(true); });
backdrop.addEventListener('click',function(){ closeSheet(true); });
pillEl.addEventListener('click',function(){ pillEl.classList.remove('on'); sheetEl.classList.add('on'); backdrop.classList.add('on'); });
document.getElementById('again').addEventListener('click',function(){
  if(mode===3){ NET.rematch(); return; }          /* по сети раунд начинается по согласию обоих */
  closeSheet(false); setTimeout(newRound,180);
});
document.getElementById('reset').addEventListener('click',function(){ closeSheet(false); newRound(); });

/* ===================== ПАРТИЯ ===================== */
function newRound(){
  session++;
  clearTimers();
  over=false; locked=false; rolling=false;
  openMask=ALL; sel=0; pending=0; missStreak=0; hintMsg='';
  scores=[0,0,0];
  plies=0; rollNo=0; netQueue=[]; handing=false;
  if(mode===3) starter = net.round%2===0 ? 1 : 2;   /* очередь задаёт сервер */
  else starter=3-starter;
  rackEl.classList.remove('win');
  for(var k=0;k<N;k++){
    tileEls[k].classList.remove('shut','sel','off','nope','o1','o2');
    tileEls[k].style.removeProperty('--d');
  }
  pillEl.classList.remove('on');
  fit();
  resetDice();
  startTurn(starter);
}

/* ===================== УПРАВЛЕНИЕ ===================== */
function tryRoll(){
  if(over||locked||rolling||pending||isAI(turn)||notMine()) return;
  if(mode===3){
    /* что выпадет — уже известно, поэтому сразу видно, уйдёт ли ход */
    rollNo++;
    var sum=rollSum();
    rollNo--;
    rollDice(1150);                       /* сначала считаем ход у себя … */
    NET.send(-1, hasCombo(openMask,sum) ? net.seat : 3-net.seat);   /* … потом шлём */
    return;
  }
  rollDice(1150);
}
rollEl.addEventListener('click',tryRoll);
pitEl.addEventListener('click',tryRoll);
rackEl.addEventListener('contextmenu',function(e){ e.preventDefault(); });

/* ===================== ЗАСТАВКА ===================== */
var miniTimers=[], mtiles=[];
(function buildMini(){
  for(var i=0;i<N;i++){
    var d=document.createElement('div');
    d.className='mtile';
    mrowEl.appendChild(d);
    mtiles.push(d);
  }
})();
function playMini(){
  miniTimers.forEach(clearTimeout); miniTimers=[];
  mtiles.forEach(function(el){ el.className='mtile'; el.style.opacity=''; });
  var steps=[[[11],'r'],[[8],'y'],[[6,2],'r'],[[9,0],'y'],[[4],'r']];
  function at(ms,fn){ miniTimers.push(setTimeout(fn,ms)); }
  steps.forEach(function(st,idx){
    var t0=260+idx*700;
    at(t0,function(){
      mdieEl.classList.add('hop');
      setTimeout(function(){ mdieEl.classList.remove('hop'); },260);
    });
    at(t0+300,function(){
      st[0].forEach(function(i){ mtiles[i].className='mtile down '+st[1]; });
    });
  });
  at(260+steps.length*700+520,function(){
    mtiles.forEach(function(el){ el.style.opacity='0'; });
  });
  at(260+steps.length*700+960,playMini);
}

/* ===================== ЗАПУСК ===================== */
function startGame(m){
  mode=m;
  wins=[0,0,0]; starter=2;
  app.classList.add('playing');
  document.body.classList.toggle('playing-net',m===3);
  newRound();
}
[].slice.call(document.querySelectorAll('.row')).forEach(function(r){
  r.addEventListener('click',function(){
    var m=+r.getAttribute('data-mode');
    if(m===3) NET.open(); else startGame(m);
  });
});
function toMenu(){
  if(NET.on) NET.leave();
  session++; clearTimers();
  over=true; locked=true; rolling=false;
  for(var q=0;q<DICE;q++) dieEl[q].classList.remove('throw');
  closeSheet(false);
  app.classList.remove('playing');
  document.body.classList.remove('playing-net');
  playMini();
}
document.getElementById('toMenu').addEventListener('click',toMenu);

/* ---------- игра по сети ---------- */
/* Ходов здесь два вида: бросок (-1) и закрытие цифр (маска).
   Чужой ход ждёт в очереди, пока у нас доиграет анимация — иначе
   кубики и плитки наложились бы друг на друга. */
function netTake(v){
  netQueue.push(v);
  netDrain();
}
function netDrain(){
  if(!netQueue.length || over) return;
  /* ждём и анимацию, и передачу хода: следующий ход чужой только после того,
     как очередь по-настоящему перешла */
  if(rolling || handing){ setTimeout(netDrain,180); return; }
  var v=netQueue.shift();
  if(v===-1) rollDice(1150);
  else applyMove(v|0);
  if(netQueue.length) setTimeout(netDrain,180);
}
NET.init({
  game:'zahlopni-yaschik',
  title:'Захлопни ящик',
  applied:function(){ return plies+netQueue.length; },
  /* кубики ещё катятся или ход ещё передаётся — чужой ход подождёт */
  busy:function(){ return rolling || handing || netQueue.length>0; },
  begin:function(c){ net.seat=c.seat; net.round=c.round; startGame(3); },
  round:function(c){ net.round=c.round; closeSheet(false); newRound(); },
  move:netTake,
  /* Подстраховка: ход здесь передаётся отложенным таймером, а браузер
     придерживает таймеры в фоновой вкладке. Если сервер говорит, что
     очередь уже другая, а мы всё ещё ждём — догоняем. */
  turn:function(t){
    if(mode!==3||over||rolling||pending||handing||netQueue.length) return;
    if(t!==turn) startTurn(t);
  },
  ended:toMenu
});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
var rt=null;
window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(fit,80); });

buildTiles();
fit();
resetDice();
paint();
playMini();
})();
</script>
