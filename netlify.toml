[build]
  publish = "."
  command = "echo 'Статический сайт, сборка не требуется'"

# Красивые ссылки на витрину магазина: /s/my-shop отдаёт index.html,
# который сам разбирает slug из location.pathname (см. index.html).
[[redirects]]
  from = "/s/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
