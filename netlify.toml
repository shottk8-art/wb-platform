[build]
  publish = "."
  command = "echo 'Статический сайт, сборка не требуется'"

# Красивые ссылки на витрину магазина: /s/my-shop -> /index.html?shop=my-shop
[[redirects]]
  from = "/s/*"
  to = "/index.html?shop=:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
